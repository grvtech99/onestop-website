<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP Audio Joiner</title><style>body{font-family:Arial;background:#07142e;color:#fff;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:#0d2044;padding:28px;border-radius:18px}h1{color:#58a6ff}input,button{width:100%;padding:14px;margin:9px 0;border-radius:10px;border:0}button{background:#0757c9;color:white;font-weight:bold}.muted{color:#b8c7df}a{display:block;text-align:center;color:#fff;background:#16803c;padding:14px;border-radius:10px;text-decoration:none;margin-top:12px}</style></head><body><main class="box"><h1>🔗 Merge Audio</h1><p class="muted">Select multiple audio files. They will be joined in the selected order and exported as WAV.</p><input id="files" type="file" accept="audio/*" multiple><button id="go">Merge Audio</button><p id="status" class="muted"></p><a id="download" hidden>⬇️ Download Merged Audio</a></main><script>const fi=document.getElementById('files'),s=document.getElementById('status'),d=document.getElementById('download');document.getElementById('go').onclick=async()=>{if(fi.files.length<2)return s.textContent='Select at least 2 audio files.';try{s.textContent='Loading files...';const c=new AudioContext(),bs=[];for(const f of fi.files)bs.push(await c.decodeAudioData(await f.arrayBuffer()));const rate=bs[0].sampleRate,n=bs.reduce((a,b)=>a+b.length,0),ch=Math.max(...bs.map(b=>b.numberOfChannels)),out=new OfflineAudioContext(ch,n,rate),buf=out.createBuffer(ch,n,rate);let pos=0;for(const b of bs){for(let k=0;k<ch;k++){const src=b.getChannelData(Math.min(k,b.numberOfChannels-1));buf.getChannelData(k).set(src,pos)}pos+=b.length}const node=out.createBufferSource();node.buffer=buf;node.connect(out.destination);node.start();const rendered=await out.startRendering(),blob=new Blob([wav(rendered)],{type:'audio/wav'});d.href=URL.createObjectURL(blob);d.download='onestop-merged-audio.wav';d.hidden=false;s.textContent='Done. '+bs.length+' files merged.';await c.close()}catch(e){s.textContent='One or more files could not be decoded by this browser.'}};function wav(b){let n=b.numberOfChannels,l=b.length,r=b.sampleRate,a=new ArrayBuffer(44+l*n*2),v=new DataView(a),o=0,w=x=>{for(let q of x)v.setUint8(o++,q.charCodeAt(0))};w('RIFF');v.setUint32(o,36+l*n*2,true);o+=4;w('WAVEfmt ');v.setUint32(o,16,true);o+=4;v.setUint16(o,1,true);o+=2;v.setUint16(o,n,true);o+=2;v.setUint32(o,r,true);o+=4;v.setUint32(o,r*n*2,true);o+=4;v.setUint16(o,n*2,true);o+=2;v.setUint16(o,16,true);o+=2;w('data');v.setUint32(o,l*n*2,true);o+=4;for(let i=0;i<l;i++)for(let c=0;c<n;c++){let z=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(o,z<0?z*32768:z*32767,true);o+=2}return a}</script></body></html>
