<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP Audio Cutter</title><style>body{font-family:Arial;background:#07142e;color:#fff;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:#0d2044;padding:28px;border-radius:18px}h1{color:#58a6ff}input,button{width:100%;padding:14px;margin:9px 0;border-radius:10px;border:0}button{background:#0757c9;color:white;font-weight:bold}input[type=number]{box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}.muted{color:#b8c7df}a{display:block;text-align:center;color:#fff;background:#16803c;padding:14px;border-radius:10px;text-decoration:none;margin-top:12px}</style><link rel="stylesheet" href="../onestop-native-ui.css"></head><body><main class="box"><h1>✂️ Audio Cutter</h1><p class="muted">Cut any audio section and download it as WAV.</p><input id="file" type="file" accept="audio/*"><div class="grid"><label>Start (sec)<input id="start" type="number" min="0" step="0.01" value="0"></label><label>End (sec)<input id="end" type="number" min="0" step="0.01" value="0"></label></div><button id="go">Cut Audio</button><p id="status" class="muted"></p><a id="download" hidden>⬇️ Download Cut Audio</a></main><script>const f=document.getElementById('file'),s=document.getElementById('status'),d=document.getElementById('download');f.onchange=async()=>{if(!f.files[0])return;try{const c=new AudioContext(),b=await c.decodeAudioData(await f.files[0].arrayBuffer());document.getElementById('end').value=b.duration.toFixed(2);await c.close()}catch(e){}};document.getElementById('go').onclick=async()=>{if(!f.files[0])return s.textContent='Select an audio file first.';try{const c=new AudioContext(),b=await c.decodeAudioData(await f.files[0].arrayBuffer()),st=Math.max(0,+start.value),en=Math.min(b.duration,+end.value);if(en<=st)throw Error('range');const off=new OfflineAudioContext(b.numberOfChannels,Math.ceil((en-st)*b.sampleRate),b.sampleRate),x=off.createBuffer(b.numberOfChannels,Math.ceil((en-st)*b.sampleRate),b.sampleRate);for(let i=0;i<b.numberOfChannels;i++)x.copyToChannel(b.getChannelData(i).subarray(Math.floor(st*b.sampleRate),Math.floor(en*b.sampleRate)),i);const n=off.createBufferSource();n.buffer=x;n.connect(off.destination);n.start();const out=await off.startRendering(),blob=new Blob([wav(out)],{type:'audio/wav'});d.href=URL.createObjectURL(blob);d.download=f.files[0].name.replace(/\.[^.]+$/,'')+'-cut.wav';d.hidden=false;s.textContent='Done.';await c.close()}catch(e){s.textContent=e.message==='range'?'End time must be greater than start time.':'Unsupported audio format or decoding error.'}};function wav(b){let n=b.numberOfChannels,l=b.length,r=b.sampleRate,a=new ArrayBuffer(44+l*n*2),v=new DataView(a),o=0,w=x=>{for(let q of x)v.setUint8(o++,q.charCodeAt(0))};w('RIFF');v.setUint32(o,36+l*n*2,true);o+=4;w('WAVEfmt ');v.setUint32(o,16,true);o+=4;v.setUint16(o,1,true);o+=2;v.setUint16(o,n,true);o+=2;v.setUint32(o,r,true);o+=4;v.setUint32(o,r*n*2,true);o+=4;v.setUint16(o,n*2,true);o+=2;v.setUint16(o,16,true);o+=2;w('data');v.setUint32(o,l*n*2,true);o+=4;for(let i=0;i<l;i++)for(let c=0;c<n;c++){let z=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(o,z<0?z*32768:z*32767,true);o+=2}return a}</script></body></html>
