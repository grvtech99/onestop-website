<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video to Audio - ONESTOP</title><style>body{margin:0;padding:20px;font-family:system-ui;background:#070916;color:#fff}.box{max-width:700px;margin:auto;background:#11162f;padding:24px;border-radius:20px}input,button{width:100%;box-sizing:border-box;margin:10px 0;padding:14px;border-radius:10px;border:0}button{background:#16d9ff;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.msg{min-height:28px;color:#9fe9ff}audio{width:100%;margin-top:12px}small{opacity:.7}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main class="box"><h1>🎬 Video → Audio</h1><p>Extract audio from a video locally in your browser and export it as WAV.</p><input id="file" type="file" accept="video/*"><button id="go" disabled>Extract Audio & Export WAV</button><div id="msg" class="msg"></div><audio id="audio" controls></audio><a id="dl" hidden>Download extracted audio</a><p><small>Best compatibility: MP4/H.264/AAC or WebM supported by your browser. Files are processed locally.</small></p></main><script>let f=null;const input=document.getElementById('file'),go=document.getElementById('go'),msg=document.getElementById('msg'),audio=document.getElementById('audio'),dl=document.getElementById('dl');input.onchange=()=>{f=input.files[0];go.disabled=!f;msg.textContent=f?`Selected: ${f.name}`:''};go.onclick=async()=>{if(!f)return;go.disabled=true;msg.textContent='Extracting audio…';try{const c=new AudioContext();const b=await c.decodeAudioData(await f.arrayBuffer());await c.close();const blob=wav(b),url=URL.createObjectURL(blob);audio.src=url;dl.href=url;dl.download='onestop-extracted-audio.wav';dl.hidden=false;dl.textContent='⬇️ Download extracted audio';msg.textContent=`Done — ${b.duration.toFixed(2)} seconds extracted.`}catch(e){msg.textContent='This video codec/container could not be decoded by your browser. Try an MP4/H.264/AAC or WebM file.'}finally{go.disabled=false}};function wav(b){const n=b.numberOfChannels,l=b.length,r=b.sampleRate,a=new ArrayBuffer(44+l*n*2),v=new DataView(a),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+l*n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,n,true);v.setUint32(24,r,true);v.setUint32(28,r*n*2,true);v.setUint16(32,n*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,l*n*2,true);let p=44;for(let i=0;i<l;i++)for(let c=0;c<n;c++){let x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([a],{type:'audio/wav'})}</script></body></html>
