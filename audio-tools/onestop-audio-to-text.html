<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio to Text | ONESTOP</title><style>body{margin:0;font-family:system-ui;background:#070916;color:#fff}main{max-width:760px;margin:auto;padding:24px}.box{background:#11162f;border:1px solid #273052;border-radius:16px;padding:18px}button{font:inherit;background:#38e8ff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;margin:5px 5px 5px 0}textarea{width:100%;min-height:260px;box-sizing:border-box;margin-top:12px;background:#0d1128;color:#fff;border:1px solid #30385d;border-radius:12px;padding:13px;font:15px system-ui}p{color:#aeb7d8}.status{color:#9af5ff}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main><a href="free-tools.html" style="color:#38e8ff">← Back</a><h1>📝 Audio → Text</h1><p>Transcribe speech with your browser's built-in speech recognition.</p><div class="box"><button id="start">🎙 Start Listening</button><button id="stop">■ Stop</button><button id="copy">Copy Text</button><div id="s" class="status">Ready</div><textarea id="out" placeholder="Your recognized text will appear here…"></textarea><p>Tip: This uses the browser Speech Recognition API. Support and language availability depend on the browser/device.</p></div></main><script>const out=document.getElementById('out'),s=document.getElementById('s');let rec;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){s.textContent='Speech recognition is not supported in this browser. Try Chrome on Android or desktop.'}else{rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-IN';rec.onstart=()=>s.textContent='Listening…';rec.onerror=e=>s.textContent='Error: '+e.error;rec.onend=()=>s.textContent='Stopped';rec.onresult=e=>{let final='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){let x=e.results[i][0].transcript;x=e.results[i].isFinal?final+=x+' ':interim+=x}out.value=(out.dataset.base||'')+final+interim;if(final)out.dataset.base=out.value}}document.getElementById('start').onclick=()=>rec&&rec.start();document.getElementById('stop').onclick=()=>rec&&rec.stop();document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(out.value);s.textContent='Text copied.'};</script></body></html>
