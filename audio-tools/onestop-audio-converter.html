<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP Audio Converter</title><style>body{font-family:Arial,sans-serif;background:#07142e;color:#fff;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:#0d2044;padding:28px;border-radius:18px}h1{color:#58a6ff}input,button{width:100%;padding:14px;margin:9px 0;border-radius:10px;border:0}button{background:#0757c9;color:white;font-weight:bold;cursor:pointer}.muted{color:#b8c7df}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}a{display:block;text-align:center;color:white;background:#16803c;padding:14px;border-radius:10px;text-decoration:none;margin-top:12px}</style></head><body><main class="box"><h1>🎵 Audio Converter</h1><p class="muted">Convert browser-supported audio files to WAV. Processing happens on your device.</p><input id="file" type="file" accept="audio/*"><div class="row"><select id="rate"><option value="44100">44.1 kHz</option><option value="48000">48 kHz</option><option value="32000">32 kHz</option><option value="16000">16 kHz</option></select><select id="channels"><option value="keep">Keep channels</option><option value="1">Mono</option><option value="2">Stereo</option></select></div><button id="go">Convert to WAV</button><p id="status" class="muted"></p><a id="download" hidden>⬇️ Download WAV</a></main><script>const f=document.getElementById('file'),s=document.getElementById('status'),d=document.getElementById('download');document.getElementById('go').onclick=async()=>{if(!f.files[0])return s.textContent='Please select an audio file.';try{s.textContent='Processing...';const buf=await f.files[0].arrayBuffer(),ctx=new AudioContext(),src=await ctx.decodeAudioData(buf);const rate=+document.getElementById('rate').value,ch=document.getElementById('channels').value==='keep'?src.numberOfChannels:+document.getElementById('channels').value;const len=Math.ceil(src.duration*rate),off=new OfflineAudioContext(ch,len,rate),bs=off.createBuffer(src.numberOfChannels,src.length,src.sampleRate);for(let i=0;i<src.numberOfChannels;i++)bs.copyToChannel(src.getChannelData(i),i);const node=off.createBufferSource();node.buffer=bs;node.connect(off.destination);node.start();const out=await off.startRendering(),blob=new Blob([wav(out)],{type:'audio/wav'});d.href=URL.createObjectURL(blob);d.download=f.files[0].name.replace(/\.[^.]+$/,'')+'-converted.wav';d.hidden=false;s.textContent='Done. Output is WAV.';await ctx.close()}catch(e){s.textContent='This format is not supported by your browser. Try MP3, WAV, OGG or M4A.'}};function wav(b){let n=b.numberOfChannels,l=b.length,rate=b.sampleRate,ab=new ArrayBuffer(44+l*n*2),v=new DataView(ab),o=0;function w(x){for(let i=0;i<x.length;i++)v.setUint8(o++,x.charCodeAt(i))}w('RIFF');v.setUint32(o,36+l*n*2,true);o+=4;w('WAVEfmt ');v.setUint32(o,16,true);o+=4;v.setUint16(o,1,true);o+=2;v.setUint16(o,n,true);o+=2;v.setUint32(o,rate,true);o+=4;v.setUint32(o,rate*n*2,true);o+=4;v.setUint16(o,n*2,true);o+=2;v.setUint16(o,16,true);o+=2;w('data');v.setUint32(o,l*n*2,true);o+=4;for(let i=0;i<l;i++)for(let c=0;c<n;c++){let x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}return ab}</script></body></html>
