<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Waveform Generator - ONESTOP</title><style>body{margin:0;padding:20px;font-family:system-ui;background:#070916;color:#fff}.box{max-width:800px;margin:auto;background:#11162f;padding:24px;border-radius:20px}input,button{width:100%;box-sizing:border-box;margin:10px 0;padding:13px;border-radius:10px;border:0}button{background:#16d9ff;font-weight:800;cursor:pointer}canvas{width:100%;height:240px;background:#080b1c;border-radius:12px;margin-top:10px}.msg{min-height:25px;color:#9fe9ff}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main class="box"><h1>🌊 Audio Waveform Generator</h1><p>Generate a visual waveform from your audio and save it as PNG.</p><input id="file" type="file" accept="audio/*"><button id="go" disabled>Generate Waveform</button><canvas id="canvas" width="1200" height="360"></canvas><div id="msg" class="msg"></div><a id="dl" hidden>⬇️ Download Waveform PNG</a></main><script>let b=null;const f=document.getElementById('file'),go=document.getElementById('go'),m=document.getElementById('msg'),cv=document.getElementById('canvas'),dl=document.getElementById('dl');f.onchange=async()=>{try{const x=f.files[0];if(!x)return;const c=new AudioContext();b=await c.decodeAudioData(await x.arrayBuffer());await c.close();go.disabled=false;m.textContent=`Loaded ${b.duration.toFixed(2)} seconds.`}catch(e){m.textContent='Could not decode this audio file.'}};go.onclick=()=>{const ctx=cv.getContext('2d'),data=b.getChannelData(0),w=cv.width,h=cv.height,mid=h/2;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#38e8ff';ctx.lineWidth=2;ctx.beginPath();const step=Math.max(1,Math.floor(data.length/w));for(let x=0;x<w;x++){let st=x*step,en=Math.min(data.length,st+step),mn=1,mx=-1;for(let i=st;i<en;i++){const z=data[i];if(z<mn)mn=z;if(z>mx)mx=z}ctx.moveTo(x,mid+mn*mid*.9);ctx.lineTo(x,mid+mx*mid*.9)}ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(w,mid);ctx.stroke();dl.href=cv.toDataURL('image/png');dl.download='onestop-audio-waveform.png';dl.hidden=false;dl.textContent='⬇️ Download Waveform PNG';m.textContent='Waveform generated.'};</script></body></html>
