<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP Volume Booster</title><style>body{font-family:Arial;background:#07142e;color:#fff;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:#0d2044;padding:28px;border-radius:18px}h1{color:#58a6ff}input,button{width:100%;padding:14px;margin:9px 0;border-radius:10px;border:0}button{background:#0757c9;color:white;font-weight:bold}.muted{color:#b8c7df}output{font-size:20px;font-weight:bold}a{display:block;text-align:center;color:#fff;background:#16803c;padding:14px;border-radius:10px;text-decoration:none;margin-top:12px}</style><link rel="stylesheet" href="../onestop-native-ui.css"></head><body><main class="box"><h1>🔊 Volume Booster</h1><p class="muted">Increase or decrease audio level and export a new WAV file.</p><input id="file" type="file" accept="audio/*"><label>Gain: <output id="val">100%</output><input id="gain" type="range" min="25" max="300" value="100"></label><button id="go">Process Audio</button><p id="status" class="muted"></p><a id="download" hidden>⬇️ Download Audio</a></main><script>const f=document.getElementById('file'),g=document.getElementById('gain'),v=document.getElementById('val'),s=document.getElementById('status'),d=document.getElementById('download');g.oninput=()=>v.textContent=g.value+'%';document.getElementById('go').onclick=async()=>{if(!f.files[0])return s.textContent='Select an audio file.';try{s.textContent='Processing...';const c=new AudioContext(),b=await c.decodeAudioData(await f.files[0].arrayBuffer()),x=new OfflineAudioContext(b.numberOfChannels,b.length,b.sampleRate),src=x.createBufferSource();src.buffer=b;const gain=x.createGain();gain.gain.value=+g.value/100;src.connect(gain).connect(x.destination);src.start();const out=await x.startRendering(),blob=new Blob([wav(out)],{type:'audio/wav'});d.href=URL.createObjectURL(blob);d.download=f.files[0].name.replace(/\.[^.]+$/,'')+'-boosted.wav';d.hidden=false;s.textContent='Done. Peak-safe clipping is applied by WAV sample limiting.';await c.close()}catch(e){s.textContent='Unsupported audio format or decoding error.'}};function wav(b){let n=b.numberOfChannels,l=b.length,r=b.sampleRate,a=new ArrayBuffer(44+l*n*2),v=new DataView(a),o=0,w=x=>{for(let q of x)v.setUint8(o++,q.charCodeAt(0))};w('RIFF');v.setUint32(o,36+l*n*2,true);o+=4;w('WAVEfmt ');v.setUint32(o,16,true);o+=4;v.setUint16(o,1,true);o+=2;v.setUint16(o,n,true);o+=2;v.setUint32(o,r,true);o+=4;v.setUint32(o,r*n*2,true);o+=4;v.setUint16(o,n*2,true);o+=2;v.setUint16(o,16,true);o+=2;w('data');v.setUint32(o,l*n*2,true);o+=4;for(let i=0;i<l;i++)for(let c=0;c<n;c++){let z=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(o,z<0?z*32768:z*32767,true);o+=2}return a}</script></body></html>
