<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ringtone Maker - ONESTOP</title><style>body{margin:0;padding:20px;font-family:system-ui;background:#070916;color:#fff}.box{max-width:700px;margin:auto;background:#11162f;padding:24px;border-radius:20px}input,button{width:100%;box-sizing:border-box;margin:9px 0;padding:13px;border-radius:10px;border:0}button{background:#16d9ff;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}audio{width:100%;margin:10px 0}.msg{min-height:25px;color:#9fe9ff}@media(max-width:500px){.row{grid-template-columns:1fr}}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main class="box"><h1>📳 Ringtone Maker</h1><p>Create a ringtone from any supported audio file.</p><input id="file" type="file" accept="audio/*"><audio id="preview" controls></audio><div class="row"><label>Start (sec)<input id="s" type="number" min="0" step="0.1" value="0"></label><label>End (sec)<input id="e" type="number" min="0" step="0.1" value="30"></label></div><button id="go" disabled>Create Ringtone</button><div id="msg" class="msg"></div><a id="dl" hidden>⬇️ Download Ringtone WAV</a></main><script>let b=null;const f=document.getElementById('file'),p=document.getElementById('preview'),go=document.getElementById('go'),m=document.getElementById('msg'),d=document.getElementById('dl');f.onchange=async()=>{try{const x=f.files[0];if(!x)return;p.src=URL.createObjectURL(x);const c=new AudioContext();b=await c.decodeAudioData(await x.arrayBuffer());await c.close();document.getElementById('e').value=Math.min(30,b.duration).toFixed(1);document.getElementById('e').max=b.duration;document.getElementById('s').max=b.duration;go.disabled=false;m.textContent=`Loaded ${b.duration.toFixed(2)} seconds.`}catch(e){m.textContent='Could not decode this audio file.'}};go.onclick=()=>{try{const s=Math.max(0,+document.getElementById('s').value),e=Math.min(b.duration,+document.getElementById('e').value);if(e<=s)throw Error('range');const n=Math.floor((e-s)*b.sampleRate),o=new AudioBuffer({length:n,numberOfChannels:b.numberOfChannels,sampleRate:b.sampleRate}),from=Math.floor(s*b.sampleRate);for(let c=0;c<b.numberOfChannels;c++)o.copyToChannel(b.getChannelData(c).subarray(from,from+n),c);const u=URL.createObjectURL(wav(o));d.href=u;d.download='onestop-ringtone.wav';d.hidden=false;d.textContent='⬇️ Download Ringtone WAV';m.textContent=`Ringtone ready — ${o.duration.toFixed(2)} seconds.`}catch(e){m.textContent='End time must be greater than start time.'}};function wav(b){const n=b.numberOfChannels,l=b.length,r=b.sampleRate,a=new ArrayBuffer(44+l*n*2),v=new DataView(a),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+l*n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,n,true);v.setUint32(24,r,true);v.setUint32(28,r*n*2,true);v.setUint16(32,n*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,l*n*2,true);let q=44;for(let i=0;i<l;i++)for(let c=0;c<n;c++){let x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(q,x<0?x*32768:x*32767,true);q+=2}return new Blob([a],{type:'audio/wav'})}</script></body></html>
