<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary Calculator | ONESTOP</title><style>body{margin:0;font-family:system-ui;background:#070916;color:#fff;padding:20px}.box{max-width:650px;margin:auto;background:#11162f;padding:22px;border-radius:18px}label{display:block;margin:12px 0}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2b365d;background:#0d1128;color:#fff}button{width:100%;padding:12px;border:0;border-radius:10px;background:#38e8ff;color:#001018;font-weight:800;cursor:pointer;margin-top:8px}.result{margin-top:18px;padding:16px;background:#0d1128;border-radius:12px;line-height:1.8}.muted{color:#aeb7d8}a{color:#38e8ff}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main class="box"><a href="free-tools.html">← Back to Free Tools</a><h1>💵 Salary Calculator</h1><p class="muted">Estimate monthly take-home salary from gross salary and deductions. This is an estimate; actual payroll rules vary.</p><label>Monthly Gross Salary (₹)<input id="g" type="number" min="0" step="1" placeholder="30000"></label><label>PF Deduction (%)<input id="pf" type="number" min="0" max="100" step="0.01" value="12"></label><label>Professional Tax / Month (₹)<input id="pt" type="number" min="0" step="1" value="0"></label><label>Other Deductions / Month (₹)<input id="od" type="number" min="0" step="1" value="0"></label><button id="go">Calculate Salary</button><div id="out" class="result">Enter salary details and calculate.</div></main><script>const $=id=>document.getElementById(id);$('go').onclick=()=>{const g=+$('g').value,pf=+$('pf').value,pt=+$('pt').value,od=+$('od').value;if(!Number.isFinite(g)||!Number.isFinite(pf)||!Number.isFinite(pt)||!Number.isFinite(od)||g<0||pf<0||pf>100||pt<0||od<0){$('out').textContent='Please enter valid values.';return}const p=g*pf/100,total=p+pt+od,net=g-total;$('out').innerHTML=`<b>Monthly Gross:</b> ₹${g.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>PF Deduction:</b> ₹${p.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Total Deductions:</b> ₹${total.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Estimated Take-Home:</b> ₹${net.toLocaleString('en-IN',{maximumFractionDigits:2})}<hr><b>Annual Gross:</b> ₹${(g*12).toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Annual Estimated Take-Home:</b> ₹${(net*12).toLocaleString('en-IN',{maximumFractionDigits:2})}`}</script></body></html>
