<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONESTOP Speed Widget — Live Test V5</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#preview-status{position:fixed;right:12px;bottom:12px;z-index:99999;background:#06265f;color:#fff;padding:8px 12px;border-radius:8px;font:600 12px Arial;box-shadow:0 5px 18px rgba(0,0,0,.2)}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<div id="preview-status">Loading ONESTOP homepage…</div>
<iframe id="site" title="ONESTOP homepage preview"></iframe>
<script>
(function(){
 var frame=document.getElementById('site'),status=document.getElementById('preview-status');
 frame.src='index.html?v='+Date.now();
 frame.addEventListener('load',function(){
   try{
     var doc=frame.contentDocument||frame.contentWindow.document;
     var old=doc.querySelectorAll('script[src*="onestop-speed-widget"]');
     old.forEach(function(s){s.remove();});
     var s=doc.createElement('script');
     s.src='onestop-speed-widget-v2.js?v='+Date.now();
     s.defer=true;
     doc.body.appendChild(s);
     status.style.display='none';
   }catch(e){
     status.textContent='Preview error: '+e.message;
     status.style.background='#b91c1c';
   }
 });
})();
</script>
</body>
</html>
