<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP Fast Document Print</title><style>:root{--b:#0b63ce;--bg:#eef3f8;--line:#d7e0ea}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial;background:var(--bg);color:#172b45}header{height:62px;background:linear-gradient(135deg,#0757b8,#1591ff);color:#fff;padding:8px 16px;display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0}.app{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 62px)}aside{background:#fff;padding:10px;border-right:1px solid var(--line);overflow:auto}.sec{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}.sec h3{font-size:13px;margin:0 0 8px}.mode{width:100%;padding:9px;margin:3px 0;border:1px solid #cbd7e4;border-radius:7px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.mode.active{background:#eaf3ff;border-color:var(--b);color:#0757b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}label{font-size:10px;display:flex;justify-content:space-between;margin-top:5px}input[type=range]{width:100%}button.action{width:100%;padding:10px;margin-top:5px;border:0;border-radius:8px;background:var(--b);color:#fff;font-weight:700;cursor:pointer}.hint{font-size:10px;color:#617187;line-height:1.35}.stage{padding:12px;display:flex;align-items:center;justify-content:center;overflow:auto;background:#dfe7ef}.paper{position:relative;background:#fff;width:210mm;height:297mm;flex:none;box-shadow:0 2px 14px #0003;transform-origin:center}.item{position:absolute;overflow:hidden;border:1px dashed #8da2b6;touch-action:none}.item img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#718096}.badge{font-size:10px;background:#fff;color:#0757b8;padding:5px 8px;border-radius:20px}@media(max-width:800px){.app{grid-template-columns:1fr;height:auto}.stage{height:70vh}.paper{transform:scale(.75)}}@media print{html,body{width:210mm;height:297mm;background:#fff}.app{display:block;height:297mm}.stage{display:block;padding:0;background:#fff;overflow:visible}.paper{width:210mm!important;height:297mm!important;transform:none!important;box-shadow:none}header,aside{display:none!important}@page{size:A4 portrait;margin:0}}</style></head><body><header><h1>ONESTOP Fast Document Print</h1><span class="badge">LOCAL PROCESSING</span></header><div class="app"><aside><div class="sec"><h3>Document Type</h3><button class="mode active" id="two">▣ 2 Side ID Card</button><button class="mode" id="one">▤ 1 Side ID Card</button><button class="mode" id="a4">▥ A4 Document</button><input id="front" type="file" accept="image/*" hidden><input id="back" type="file" accept="image/*" hidden><input id="single" type="file" accept="image/*" hidden><div id="status" class="hint">Add Front and Back.</div></div><div class="sec"><h3>Image Tools</h3><div class="hint">Click/drag an image to position it. Each side keeps its own settings.</div><div class="grid"><div><label>Zoom <output id="zv">100%</output></label><input id="zoom" type="range" min="25" max="2000" value="100"></div><div><label>Rotation <output id="av">0°</output></label><input id="angle" type="range" min="-180" max="180" value="0"></div><div><label>Perspective H <output id="pxv">0°</output></label><input id="px" type="range" min="-20" max="20" value="0"></div><div><label>Perspective V <output id="pyv">0°</output></label><input id="py" type="range" min="-20" max="20" value="0"></div><div><label>Brightness <output id="bv">100%</output></label><input id="bright" type="range" min="50" max="150" value="100"></div><div><label>Contrast <output id="cv">100%</output></label><input id="contrast" type="range" min="50" max="150" value="100"></div></div></div><div class="sec"><button class="action" id="png">⬇ Download PNG</button><button class="action" id="jpg">⬇ Download JPG</button><button class="action" id="print">🖨 Print</button></div><div class="hint">Privacy: received documents are processed only in this browser.</div></aside><main class="stage"><div id="paper" class="paper"><div class="empty">Waiting for document…</div></div></main></div><script>const MM=3.7795275591,W=210,H=297,CW=86,CH=54,G=4;let mode='two',imgs=[null,null],sizes=[null,null],sel=-1;const fresh=()=>({z:100,a:0,x:0,y:0,b:100,c:100,px:0,py:0});let ed=[fresh(),fresh()];const $=x=>document.getElementById(x);function setMode(m){mode=m;imgs=[null,null];sizes=[null,null];ed=[fresh(),fresh()];sel=-1;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));$(m).classList.add('active');update();render()}function read(file,i){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{imgs[i]=r.result;sizes[i]={w:im.naturalWidth,h:im.naturalHeight};sel=i;sync();update();render()};im.src=r.result};r.readAsDataURL(file)}function update(){$('status').textContent=mode==='two'?(imgs[0]&&imgs[1]?'Front ✓ • Back ✓ • Ready':'Add Front and Back.'):(imgs[0]?'Ready to print':'Add image.')}function sync(){if(sel<0)return;let t=ed[sel];[['zoom','z','%'],['angle','a','°'],['px','px','°'],['py','py','°'],['bright','b','%'],['contrast','c','%']].forEach(([i,k,s])=>{$(i).value=t[k];$(i+'v').textContent=t[k]+s})}function tool(k,v){if(sel<0||!imgs[sel])return;ed[sel][k]=+v;sync();render()}function add(i,x,y,w,h){const d=document.createElement('div');d.className='item';d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;const im=document.createElement('img');im.src=imgs[i];const t=ed[i],n=sizes[i];const fit=Math.min(w/n.w,h/n.h),bw=n.w*fit,bh=n.h*fit;im.style.width=bw+'px';im.style.height=bh+'px';im.style.left=`calc(50% + ${t.x}px)`;im.style.top=`calc(50% + ${t.y}px)`;im.style.transform=`translate(-50%,-50%) scale(${t.z/100}) rotate(${t.a}deg) skew(${t.px/2}deg,${t.py/2}deg)`;im.style.filter=`brightness(${t.b}%) contrast(${t.c}%)`;d.appendChild(im);let down=false,sx=0,sy=0,ox=0,oy=0;d.onpointerdown=e=>{sel=i;sync();down=true;sx=e.clientX;sy=e.clientY;ox=t.x;oy=t.y;d.setPointerCapture?.(e.pointerId);e.preventDefault()};d.onpointermove=e=>{if(!down)return;t.x=ox+e.clientX-sx;t.y=oy+e.clientY-sy;im.style.left=`calc(50% + ${t.x}px)`;im.style.top=`calc(50% + ${t.y}px)`};d.onpointerup=()=>down=false;$('paper').appendChild(d)}function render(){const p=$('paper');p.innerHTML='';if(mode==='two'){let x=(W*MM-CW*MM)/2,y=(H*MM-(CH*2+G)*MM)/2;imgs[0]?add(0,x,y,CW*MM,CH*MM):null;imgs[1]?add(1,x,y+(CH+G)*MM,CW*MM,CH*MM):null}else if(mode==='one'){imgs[0]&&add(0,(W-CW)*MM/2,(H-CH)*MM/2,CW*MM,CH*MM)}else imgs[0]&&add(0,0,0,W*MM,H*MM);if(!p.children.length){const e=document.createElement('div');e.className='empty';e.textContent='Waiting for document…';p.appendChild(e)}}function blob(){return new Promise((res,rej)=>{const c=document.createElement('canvas');c.width=2480;c.height=3508;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);const scale=2480/210;x.save();x.scale(scale,scale);let list=[];if(mode==='two'){let y=(H-(CH*2+G))/2;list=[[0,(W-CW)/2,y],[1,(W-CW)/2,y+CH+G]]}else if(mode==='one')list=[[0,(W-CW)/2,(H-CH)/2]];else list=[[0,0,0]];Promise.all(list.filter(q=>imgs[q[0]]).map(q=>new Promise(ok=>{const im=new Image();im.onload=()=>{let i=q[0],t=ed[i],n=sizes[i],w=mode==='a4'?W:CW,h=mode==='a4'?H:CH,fit=Math.min(w/n.w,h/n.h),dw=n.w*fit,dh=n.h*fit;x.save();x.beginPath();x.rect(q[1],q[2],w,h);x.clip();x.translate(q[1]+w/2+t.x/MM,q[2]+h/2+t.y/MM);x.rotate(t.a*Math.PI/180);x.transform(1,Math.tan(t.py/2*Math.PI/180),Math.tan(t.px/2*Math.PI/180),1,0,0);x.scale(t.z/100,t.z/100);x.filter=`brightness(${t.b}%) contrast(${t.c}%)`;x.drawImage(im,-dw/2,-dh/2,dw,dh);x.restore();ok()};im.src=imgs[q[0]]}))).then(()=>{x.restore();c.toBlob(b=>b?res(b):rej(new Error('Canvas failed')),'image/png')})})}function dl(b,n){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}$('two').onclick=()=>{setMode('two');$('front').click()};$('one').onclick=()=>{setMode('one');$('single').click()};$('a4').onclick=()=>{setMode('a4');$('single').click()};$('front').onchange=e=>read(e.target.files[0],0);$('back').onchange=e=>read(e.target.files[0],1);$('single').onchange=e=>read(e.target.files[0],0);[['zoom','z'],['angle','a'],['px','px'],['py','py'],['bright','b'],['contrast','c']].forEach(([i,k])=>$(i).oninput=e=>tool(k,e.target.value));$('print').onclick=()=>window.print();$('png').onclick=async()=>dl(await blob(),'onestop-fast-print-A4.png');$('jpg').onclick=async()=>{const b=await blob();const c=document.createElement('canvas');const im=new Image();im.onload=()=>{c.width=2480;c.height=3508;c.getContext('2d').drawImage(im,0,0);c.toBlob(x=>dl(x,'onestop-fast-print-A4.jpg'),'image/jpeg',.9)};im.src=URL.createObjectURL(b)};window.addEventListener('message',async e=>{const d=e.data||{};if(d.type!=='ONESTOP_PRINT_JOB')return;const map={ID_CARD_2SIDE:'two',ID_CARD_1SIDE:'one',A4:'a4'};if(map[d.printType]&&mode!==map[d.printType])setMode(map[d.printType]);let i=0;for(const f of d.files||[]){if((f.mime||'').startsWith('image/')){const file=new File([f.buffer],f.name||'document',{type:f.mime});read(file,i++)}}});render()</script></body></html>
