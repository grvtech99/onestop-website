<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP GST Calculator</title><style>body{margin:0;font-family:system-ui,Arial;background:#07142e;color:#fff}main{max-width:620px;margin:auto;padding:22px}a{color:#38e8ff}.box{background:#111d3d;border:1px solid #2c3c6b;border-radius:16px;padding:20px}label{display:block;margin:14px 0 6px}input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #46557f;background:#08122d;color:#fff;font-size:16px}button{margin-top:16px;padding:12px 16px;border:0;border-radius:10px;background:#38e8ff;font-weight:800}.out{margin-top:18px;padding:16px;background:#08122d;border-radius:12px;line-height:1.8}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main><a href="free-tools.html">← Back to Free Tools</a><h1>🧾 GST Calculator</h1><div class="box"><label>Amount (₹)</label><input id="amt" type="number" min="0" step="0.01"><label>GST rate</label><select id="rate"><option>0</option><option>5</option><option selected>12</option><option>18</option><option>28</option></select><label>Calculation</label><select id="mode"><option value="add">Add GST to amount</option><option value="remove">Remove GST from GST-inclusive amount</option></select><button onclick="go()">Calculate GST</button><div id="out" class="out">Enter an amount.</div></div></main><script>function go(){let a=+amt.value,r=+rate.value;if(!Number.isFinite(a)||a<0){out.textContent='Please enter a valid amount.';return}if(mode.value==='add'){let g=a*r/100;out.innerHTML='Base Amount: <b>₹'+a.toFixed(2)+'</b><br>GST: <b>₹'+g.toFixed(2)+'</b><br>Total: <b>₹'+(a+g).toFixed(2)+'</b>'}else{let base=a/(1+r/100),g=a-base;out.innerHTML='Original GST-inclusive Amount: <b>₹'+a.toFixed(2)+'</b><br>Base Amount: <b>₹'+base.toFixed(2)+'</b><br>GST included: <b>₹'+g.toFixed(2)+'</b>'}}</script></body></html>
