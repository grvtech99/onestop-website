<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Online Games | ONESTOP</title>
<style>
:root{--blue:#0757c9;--dark:#06265f;--green:#16a34a;--light:#f5f9ff;--text:#14213d;--muted:#60708d;--border:#e2eafa}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--text)}
header{background:linear-gradient(135deg,#031d50,#0757c9);color:#fff;padding:30px 20px}
.container{max-width:1100px;margin:auto;padding:0 20px}
.back{display:inline-block;color:#fff;text-decoration:none;font-weight:800;margin-bottom:20px}
h1{margin:0;font-size:clamp(30px,5vw,48px)}header p{margin:8px 0 0;color:#dceaff}
section{padding:45px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(20,33,61,.07);transition:.2s}
.card:hover{transform:translateY(-4px)}.icon{font-size:40px}.card h2{font-size:19px;color:var(--dark);margin:12px 0 6px}.card p{color:var(--muted);font-size:14px}
.play{display:inline-block;margin-top:12px;background:var(--green);color:#fff;text-decoration:none;padding:10px 14px;border-radius:9px;font-weight:800}
.empty{background:#fff;padding:25px;border-radius:16px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="container">
<a class="back" href="index.html">← Back to ONESTOP</a>
<h1>🎮 Free Online Games</h1>
<p>Play fun, simple browser games directly from the ONESTOP game portal.</p>
</div>
</header>
<section>
<div class="container">
<div class="grid" id="gamesGrid"></div>
</div>
</section>
<script>
/* =========================================================
   FUTURE FREE ONLINE GAMES
   Add every new game ONLY inside this array.
   Example:
   {name:"Game Name",icon:"🎯",description:"Game description",url:"game.html"}
   ========================================================= */
const FREE_GAMES = [
  {
    name:"Tic-Tac-Toe",
    icon:"❌⭕",
    description:"Classic two-player strategy game.",
    url:"tic-tac-toe.html"
  },
  {
    name:"Snake Game",
    icon:"🐍",
    description:"Classic snake game for quick fun.",
    url:"snake-game.html"
  },
  {
    name:"Memory Match",
    icon:"🧠",
    description:"Test your memory by matching pairs.",
    url:"memory-match.html"
  }
];

const grid=document.getElementById("gamesGrid");
if(!FREE_GAMES.length){
  grid.innerHTML='<div class="empty">Games coming soon.</div>';
}else{
  FREE_GAMES.forEach(game=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=
      '<div class="icon">'+escapeHtml(game.icon||"🎮")+'</div>'+
      '<h2>'+escapeHtml(game.name||"Game")+'</h2>'+
      '<p>'+escapeHtml(game.description||"Free online game.")+'</p>'+
      '<a class="play" href="'+escapeHtml(game.url||"#")+'">Play Now →</a>';
    grid.appendChild(card);
  });
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
