<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Interest Calculator | ONESTOP</title><style>body{margin:0;font-family:system-ui,Arial;background:#070916;color:#fff;padding:20px}.box{max-width:650px;margin:auto;background:#11162f;padding:22px;border-radius:18px}label{display:block;margin:12px 0}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2b365d;background:#0d1128;color:#fff}button{background:#38e8ff;color:#001018;border:0;font-weight:800;cursor:pointer;margin-top:8px}.result{margin-top:18px;padding:16px;background:#0d1128;border-radius:12px;line-height:1.8}.muted{color:#aeb7d8}a{color:#38e8ff}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main class="box"><a href="free-tools.html">← Back to Free Tools</a><h1>💰 Simple Interest Calculator</h1><p class="muted">Calculate simple interest and total amount.</p><label>Principal Amount<input id="p" type="number" min="0" step="0.01" placeholder="10000"></label><label>Annual Interest Rate (%)<input id="r" type="number" min="0" step="0.01" placeholder="8"></label><label>Time (Years)<input id="t" type="number" min="0" step="0.01" placeholder="2"></label><button id="go">Calculate</button><div id="out" class="result">Enter values and calculate.</div></main><script>const $=id=>document.getElementById(id);$('go').onclick=()=>{const p=+$('p').value,r=+$('r').value,t=+$('t').value;if(!Number.isFinite(p)||!Number.isFinite(r)||!Number.isFinite(t)||p<0||r<0||t<0){$('out').textContent='Please enter valid non-negative values.';return}const si=p*r*t/100;$('out').innerHTML=`<b>Simple Interest:</b> ₹${si.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Total Amount:</b> ₹${(p+si).toLocaleString('en-IN',{maximumFractionDigits:2})}`}</script></body></html>
