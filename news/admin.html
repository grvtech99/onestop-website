<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP News Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#14213d;font-family:Arial,'Noto Sans Devanagari',sans-serif}.top{background:#0757c9;color:#fff;padding:18px;font-size:1.25rem;font-weight:800}.wrap{max-width:900px;margin:auto;padding:18px}.box{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #14213d0b}label{display:block;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd8ef;border-radius:8px;font:inherit}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;background:#0757c9;color:white;padding:11px 15px;border-radius:8px;margin:12px 8px 0 0;cursor:pointer}.muted{font-size:.88rem;color:#60708d;line-height:1.5}.item{border-top:1px solid #e5eaf1;padding:12px 0}.item strong{display:block}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top">ONESTOP Hindi News · Admin CMS</div><main class="wrap"><section class="box"><h2>कनेक्शन सेटिंग</h2><label>Apps Script Web App URL</label><input id="api" value="https://script.google.com/macros/s/AKfycbyNZ47P0AVPUKzEiDMoKjiD4zpJPoy_Pk5z1skCoNHJrb2rf4F-2HwRaQe003eNoPOoLA/exec"><label>Admin token</label><input id="token" type="password" placeholder="Code.gs वाला ADMIN_TOKEN"><button class="btn" id="connect">कनेक्ट करें</button><span id="connection" class="muted"></span><p class="muted">Token केवल इस पेज के चलने के दौरान उपयोग होगा; इसे सार्वजनिक कोड में hard-code न करें।</p></section><section class="box"><h2>नई खबर / Draft बनाएँ</h2><form id="form"><label>शीर्षक *</label><input id="title" required maxlength="180"><div class="grid"><div><label>श्रेणी</label><select id="category"><option>स्थानीय</option><option>देश-दुनिया</option><option>शिक्षा और रोजगार</option><option>टेक्नोलॉजी</option><option>सरकारी योजनाएँ</option><option>सूचना</option></select></div><div><label>स्रोत</label><input id="source"></div></div><label>संक्षिप्त विवरण *</label><textarea id="summary" required maxlength="1500"></textarea><label>पूरा लेख (वैकल्पिक)</label><textarea id="body" maxlength="12000"></textarea><label>स्रोत URL (वैकल्पिक)</label><input id="url" type="url"><button class="btn" type="submit">Draft सेव करें</button><button class="btn" type="button" id="refresh">Draft/लेख देखें</button><p id="msg" class="muted"></p></form></section><section class="box"><h2>लेख सूची</h2><div id="list" class="muted">पहले कनेक्ट करें।</div></section></main><script>let api='',token='';const $=id=>document.getElementById(id);$('connect').onclick=()=>{api=$('api').value.trim().replace(/\/$/,'');token=$('token').value.trim();$('connection').textContent=api&&token?'सेटिंग दर्ज हुई।':'URL और token भरें।'};async function call(action,extra={}){if(!api||!token)throw Error('पहले URL और token भरकर कनेक्ट करें।');const res=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...extra})});const data=await res.json();if(!data.ok)throw Error(data.error||'API error');return data}$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='सेव हो रहा है…';const article={title:$('title').value.trim(),category:$('category').value,source:$('source').value.trim(),summary:$('summary').value.trim(),body:$('body').value.trim(),url:$('url').value.trim()};try{let d=await call('createDraft',{article});$('msg').textContent='Draft सेव हो गया: '+d.id;e.target.reset()}catch(err){$('msg').textContent='सेव नहीं हुआ: '+err.message}};$('refresh').onclick=async()=>{try{const d=await call('adminList');$('list').innerHTML=(d.articles||[]).map(a=>`<div class="item"><strong>${esc(a.title)}</strong><div>${esc(a.category)} · ${esc(a.status)}</div>${a.status!=='published'?`<button class="btn" data-pub="${esc(a.id)}">Publish</button>`:''}<button class="btn" data-del="${esc(a.id)}">Delete</button></div>`).join('')||'कोई लेख नहीं';document.querySelectorAll('[data-pub]').forEach(b=>b.onclick=()=>mutate('publish',b.dataset.pub));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>mutate('delete',b.dataset.del))}catch(e){$('list').textContent=e.message}};async function mutate(action,id){if(action==='delete'&&!confirm('क्या हटाना है?'))return;try{await call(action,{id});$('refresh').click()}catch(e){alert(e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
