<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Equalizer | ONESTOP</title><style>body{margin:0;font-family:system-ui;background:#070916;color:#fff;padding:20px}.box{max-width:720px;margin:auto;background:#11162f;padding:22px;border-radius:18px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.band{background:#0d1128;padding:12px;border-radius:12px;text-align:center}input{width:100%}button{padding:12px 16px;border:0;border-radius:10px;margin:6px;background:#38e8ff;font-weight:800}audio{width:100%;margin:15px 0}.muted{color:#aeb7d8}</style></head><body><div class="box"><h1>🎛️ Audio Equalizer</h1><p class="muted">Adjust bass, mid and treble locally in your browser. Export as WAV.</p><input id="file" type="file" accept="audio/*"><audio id="player" controls></audio><div class="row"><label class="band">Bass<br><input id="bass" type="range" min="-15" max="15" value="0"><b id="bv">0 dB</b></label><label class="band">Mid<br><input id="mid" type="range" min="-15" max="15" value="0"><b id="mv">0 dB</b></label><label class="band">Treble<br><input id="treble" type="range" min="-15" max="15" value="0"><b id="tv">0 dB</b></label></div><button id="preview">▶ Preview</button><button id="export">⬇ Export WAV</button><p id="msg" class="muted"></p></div><script>let buf,ctx;const $=id=>document.getElementById(id);['bass','mid','treble'].forEach(x=>$(x).oninput=()=>$(x[0]+'v').textContent=$(x).value+' dB');$('file').onchange=async e=>{try{if(!e.target.files[0])return;ctx=ctx||new AudioContext();buf=await ctx.decodeAudioData(await e.target.files[0].arrayBuffer());$('player').src=URL.createObjectURL(e.target.files[0]);$('msg').textContent='Loaded '+buf.duration.toFixed(2)+' seconds.'}catch(e){$('msg').textContent='Could not decode this audio format.'}};function render(play=false){if(!buf)throw Error('Select an audio file first.');const o=new OfflineAudioContext(buf.numberOfChannels,buf.length,buf.sampleRate),s=o.createBufferSource();s.buffer=buf;const b=o.createBiquadFilter(),m=o.createBiquadFilter(),t=o.createBiquadFilter();b.type='lowshelf';b.frequency.value=150;b.gain.value=+$('bass').value;m.type='peaking';m.frequency.value=1000;m.Q.value=.7;m.gain.value=+$('mid').value;t.type='highshelf';t.frequency.value=5000;t.gain.value=+$('treble').value;s.connect(b).connect(m).connect(t).connect(o.destination);s.start();return o.startRendering()}$('preview').onclick=async()=>{try{const r=await render();const u=URL.createObjectURL(wav(r));$('player').src=u;$('player').play()}catch(e){$('msg').textContent=e.message}};$('export').onclick=async()=>{try{const r=await render();download(wav(r),'onestop-equalized.wav')}catch(e){$('msg').textContent=e.message}};function wav(b){let n=b.numberOfChannels,l=b.length*2*n+44,a=new ArrayBuffer(l),v=new DataView(a),p=0;function w(s){for(let i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i))}function u(x){v.setUint32(p,x,true);p+=4}function q(x){v.setUint16(p,x,true);p+=2}w('RIFF');u(l-8);w('WAVEfmt ');u(16);q(1);q(n);u(b.sampleRate);u(b.sampleRate*n*2);q(n*2);q(16);w('data');u(l-p-4);for(let i=0;i<b.length;i++)for(let c=0;c<n;c++){let x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([a],{type:'audio/wav'})}function download(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}</script></body></html>
