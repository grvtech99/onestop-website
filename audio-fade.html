<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Fade In Out - ONESTOP</title><style>body{margin:0;padding:20px;font-family:system-ui;background:#070916;color:#fff}.box{max-width:700px;margin:auto;background:#11162f;padding:24px;border-radius:20px}input,button{width:100%;box-sizing:border-box;margin:8px 0;padding:13px;border-radius:10px;border:0}button{background:#16d9ff;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}audio{width:100%;margin:12px 0}.msg{min-height:24px;color:#9fe9ff}@media(max-width:500px){.row{grid-template-columns:1fr}}</style></head><body><main class="box"><h1>🌅 Audio Fade In / Out</h1><p>Add smooth fade-in and fade-out effects and export WAV.</p><input id="file" type="file" accept="audio/*"><audio id="player" controls></audio><div class="row"><label>Fade in (sec)<input id="fi" type="number" min="0" step="0.1" value="1"></label><label>Fade out (sec)<input id="fo" type="number" min="0" step="0.1" value="1"></label></div><button id="go" disabled>Apply Fades & Export WAV</button><div id="msg" class="msg"></div><a id="dl" hidden>Download faded audio</a></main><script>let buf=null;const file=document.getElementById('file'),p=document.getElementById('player'),go=document.getElementById('go'),msg=document.getElementById('msg'),dl=document.getElementById('dl');file.onchange=async()=>{try{const f=file.files[0];if(!f)return;msg.textContent='Loading…';p.src=URL.createObjectURL(f);const c=new AudioContext();buf=await c.decodeAudioData(await f.arrayBuffer());await c.close();go.disabled=false;msg.textContent=`Loaded ${buf.duration.toFixed(2)} seconds.`}catch(e){msg.textContent='Could not decode this file.'}};go.onclick=()=>{try{const fi=Math.max(0,Number(document.getElementById('fi').value)),fo=Math.max(0,Number(document.getElementById('fo').value));if(fi+fo>buf.duration){msg.textContent='Fade durations are longer than the audio.';return}const out=new AudioBuffer({length:buf.length,numberOfChannels:buf.numberOfChannels,sampleRate:buf.sampleRate});for(let ch=0;ch<buf.numberOfChannels;ch++){const s=buf.getChannelData(ch),d=out.getChannelData(ch);for(let i=0;i<s.length;i++){const t=i/buf.sampleRate;let g=1;if(fi>0&&t<fi)g*=.5-.5*Math.cos(Math.PI*t/fi);if(fo>0&&t>buf.duration-fo)g*=.5-.5*Math.cos(Math.PI*(buf.duration-t)/fo);d[i]=s[i]*g}}const url=URL.createObjectURL(wav(out));dl.href=url;dl.download='onestop-faded-audio.wav';dl.hidden=false;dl.textContent='⬇️ Download faded audio';msg.textContent='Done.'}catch(e){msg.textContent='Export failed: '+e.message}};function wav(b){const n=b.numberOfChannels,l=b.length,r=b.sampleRate,a=new ArrayBuffer(44+l*n*2),v=new DataView(a),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+l*n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,n,true);v.setUint32(24,r,true);v.setUint32(28,r*n*2,true);v.setUint16(32,n*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,l*n*2,true);let q=44;for(let i=0;i<l;i++)for(let c=0;c<n;c++){let x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(q,x<0?x*32768:x*32767,true);q+=2}return new Blob([a],{type:'audio/wav'})}</script></body></html>
