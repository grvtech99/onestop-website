<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP Percentage Calculator</title><style>body{margin:0;font-family:system-ui,Arial;background:#07142e;color:#fff}main{max-width:620px;margin:auto;padding:22px}a{color:#38e8ff}.box{background:#111d3d;border:1px solid #2c3c6b;border-radius:16px;padding:20px}label{display:block;margin:14px 0 6px;color:#cbd4f4}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #46557f;background:#08122d;color:#fff;font-size:16px}button{margin-top:16px;padding:12px 16px;border:0;border-radius:10px;background:#38e8ff;font-weight:800}.out{margin-top:18px;padding:16px;background:#08122d;border-radius:12px;line-height:1.8}</style></head><body><main><a href="free-tools.html">← Back to Free Tools</a><h1>📊 Percentage Calculator</h1><div class="box"><label>What is X% of Y?</label><input id="p" type="number" placeholder="Percentage"><input id="y" type="number" placeholder="Number" style="margin-top:8px"><button onclick="one()">Calculate</button><label>What percentage is X of Y?</label><input id="x2" type="number" placeholder="X"><input id="y2" type="number" placeholder="Y" style="margin-top:8px"><button onclick="two()">Calculate</button><div id="out" class="out">Enter values above.</div></div></main><script>const o=document.getElementById('out');function one(){let p=+document.getElementById('p').value,y=+document.getElementById('y').value;if(!Number.isFinite(p)||!Number.isFinite(y)){o.textContent='Please enter valid numbers.';return}o.innerHTML=p+'% of '+y+' = <b>'+(p*y/100).toLocaleString()+'</b>'}function two(){let x=+document.getElementById('x2').value,y=+document.getElementById('y2').value;if(!Number.isFinite(x)||!Number.isFinite(y)||y===0){o.textContent='Please enter valid numbers and a non-zero Y.';return}o.innerHTML=x+' is <b>'+((x/y)*100).toFixed(2)+'%</b> of '+y}</script></body></html>
