<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discount Calculator | ONESTOP</title><style>body{margin:0;font-family:system-ui;background:#070916;color:#fff;padding:20px}.box{max-width:650px;margin:auto;background:#11162f;padding:22px;border-radius:18px}label{display:block;margin:12px 0}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2b365d;background:#0d1128;color:#fff}button{background:#38e8ff;color:#001018;border:0;font-weight:800;cursor:pointer;margin-top:8px}.result{margin-top:18px;padding:16px;background:#0d1128;border-radius:12px;line-height:1.8}.muted{color:#aeb7d8}a{color:#38e8ff}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main class="box"><a href="free-tools.html">← Back to Free Tools</a><h1>🏷️ Discount Calculator</h1><p class="muted">Find discount amount, savings and final sale price.</p><label>Original Price<input id="p" type="number" min="0" step="0.01" placeholder="2000"></label><label>Discount (%)<input id="d" type="number" min="0" max="100" step="0.01" placeholder="20"></label><button id="go">Calculate</button><div id="out" class="result">Enter values and calculate.</div></main><script>const $=id=>document.getElementById(id);$('go').onclick=()=>{const p=+$('p').value,d=+$('d').value;if(!Number.isFinite(p)||!Number.isFinite(d)||p<0||d<0||d>100){$('out').textContent='Enter a valid price and discount from 0–100%.';return}const save=p*d/100,final=p-save;$('out').innerHTML=`<b>Discount:</b> ₹${save.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Final Price:</b> ₹${final.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>You Save:</b> ₹${save.toLocaleString('en-IN',{maximumFractionDigits:2})}`}</script></body></html>
