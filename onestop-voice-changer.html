<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Changer | ONESTOP</title><style>body{margin:0;font-family:system-ui;background:#070916;color:#fff}main{max-width:760px;margin:auto;padding:24px}h1{margin:6px 0}p{color:#aeb7d8}.box{background:#11162f;border:1px solid #273052;border-radius:16px;padding:18px;margin-top:16px}input,select,button{font:inherit}select,input{padding:10px;border-radius:9px;border:1px solid #394264;background:#0d1128;color:#fff;max-width:100%}button{background:#38e8ff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;margin-top:10px}audio{width:100%;margin-top:14px}.status{color:#9af5ff;margin-top:12px}.note{font-size:13px;color:#8892b0}</style></head><body><main><a href="free-tools.html" style="color:#38e8ff">← Back</a><h1>🗣️ Voice Changer</h1><p>Apply fun voice effects to an audio recording locally.</p><div class="box"><input id="file" type="file" accept="audio/*"><br><select id="fx"><option value="robot">🤖 Robot</option><option value="deep">🧟 Deep</option><option value="bright">✨ Bright</option><option value="echo">🌌 Echo</option></select><br><button id="go">Apply Effect</button><div id="s" class="status">Select an audio file.</div><audio id="a" controls></audio><a id="d" download="onestop-voice-effect.wav" style="display:none;color:#65f6a2;font-weight:800">⬇ Download WAV</a><p class="note">Effects are DSP-based and processed entirely in your browser.</p></div></main><script>const f=file,s=document.getElementById('s'),a=document.getElementById('a'),d=document.getElementById('d');document.getElementById('go').onclick=async()=>{try{if(!f.files[0])throw Error('Select an audio file.');s.textContent='Processing…';const ac=new AudioContext(),x=await ac.decodeAudioData(await f.files[0].arrayBuffer()),rate=x.sampleRate,n=x.length,ch=x.numberOfChannels,o=new AudioBuffer({length:n,numberOfChannels:ch,sampleRate:rate}),mode=document.getElementById('fx').value;for(let c=0;c<ch;c++){const src=x.getChannelData(c),dst=o.getChannelData(c);for(let i=0;i<n;i++){let v=src[i];if(mode==='robot')v=Math.tanh(v*3)*.75;else if(mode==='deep'){let j=Math.max(0,i-3);v=(src[j]*.55+v*.45)}else if(mode==='bright')v=Math.tanh((v-src[Math.max(0,i-1)])*2.2)*.8;else if(mode==='echo'){let e=i-Math.floor(rate*.22);v=v+(e>=0?src[e]*.35:0);v=Math.max(-1,Math.min(1,v))}dst[i]=v}}const blob=wav(o);const url=URL.createObjectURL(blob);a.src=url;d.href=url;d.style.display='inline-block';s.textContent='Done. Preview and download.';ac.close()}catch(e){s.textContent='Error: '+e.message}};function wav(b){const ch=b.numberOfChannels,r=b.sampleRate,len=b.length*ch,buf=new ArrayBuffer(44+len*2),v=new DataView(buf);let p=0,w=x=>{for(const z of x)v.setUint8(p++,z.charCodeAt(0))},u=x=>{v.setUint32(p,x,true);p+=4},q=x=>{v.setUint16(p,x,true);p+=2};w('RIFF');u(36+len*2);w('WAVEfmt ');u(16);q(1);q(ch);u(r);u(r*ch*2);q(ch*2);q(16);w('data');u(len*2);for(let i=0;i<b.length;i++)for(let c=0;c<ch;c++){let z=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,z<0?z*32768:z*32767,true);p+=2}return new Blob([buf],{type:'audio/wav'})}</script></body></html>
