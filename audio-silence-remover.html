<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silence Remover - ONESTOP</title><style>body{margin:0;padding:20px;font-family:system-ui;background:#070916;color:#fff}.box{max-width:700px;margin:auto;background:#11162f;padding:24px;border-radius:20px}input,button{width:100%;box-sizing:border-box;margin:8px 0;padding:13px;border-radius:10px;border:0}button{background:#16d9ff;font-weight:800;cursor:pointer}.msg{min-height:28px;color:#9fe9ff}audio{width:100%;margin:12px 0}label{display:block;margin-top:10px}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main class="box"><h1>🤫 Silence Remover</h1><p>Automatically remove quiet sections from audio and export a WAV.</p><input id="file" type="file" accept="audio/*"><label>Silence threshold (dB)<input id="th" type="number" min="-80" max="-10" step="1" value="-45"></label><label>Minimum silence (ms)<input id="dur" type="number" min="50" max="5000" step="50" value="300"></label><button id="go" disabled>Remove Silence & Export WAV</button><div id="msg" class="msg"></div><audio id="audio" controls></audio><a id="dl" hidden>Download processed audio</a></main><script>let buf=null;const file=document.getElementById('file'),go=document.getElementById('go'),msg=document.getElementById('msg'),audio=document.getElementById('audio'),dl=document.getElementById('dl');file.onchange=async()=>{try{const f=file.files[0];if(!f)return;msg.textContent='Loading…';const c=new AudioContext();buf=await c.decodeAudioData(await f.arrayBuffer());await c.close();go.disabled=false;msg.textContent=`Loaded ${buf.duration.toFixed(2)} seconds.`}catch(e){msg.textContent='Could not decode this audio file.';go.disabled=true}};go.onclick=()=>{try{const threshold=Math.pow(10,Number(document.getElementById('th').value)/20),minFrames=Math.max(1,Math.floor(Number(document.getElementById('dur').value)/1000*buf.sampleRate)),hop=Math.max(1,Math.floor(buf.sampleRate*.02)),mono=new Float32Array(Math.ceil(buf.length/hop));const chs=buf.numberOfChannels;for(let w=0,i=0;i<buf.length;i+=hop,w++){let end=Math.min(buf.length,i+hop),mx=0;for(let j=i;j<end;j++)for(let c=0;c<chs;c++)mx=Math.max(mx,Math.abs(buf.getChannelData(c)[j]));mono[w]=mx}let keep=new Uint8Array(mono.length);for(let i=0;i<mono.length;i++)keep[i]=mono[i]>=threshold?1:0;let run=0;for(let i=0;i<=keep.length;i++){if(i<keep.length&&!keep[i])run++;else{if(run*hop<minFrames)for(let j=i-run;j<i;j++)keep[j]=1;run=0}}let ranges=[],start=null;for(let i=0;i<=keep.length;i++){if(i<keep.length&&keep[i]&&start===null)start=i*hop;if((i===keep.length||!keep[i])&&start!==null){ranges.push([start,Math.min(i*hop,buf.length)]);start=null}}if(!ranges.length){msg.textContent='No non-silent audio found. Lower the threshold.';return}let len=ranges.reduce((n,r)=>n+r[1]-r[0],0),out=new AudioBuffer({length:len,numberOfChannels:chs,sampleRate:buf.sampleRate}),pos=0;for(const r of ranges){for(let c=0;c<chs;c++)out.getChannelData(c).set(buf.getChannelData(c).subarray(r[0],r[1]),pos);pos+=r[1]-r[0]}const url=URL.createObjectURL(wav(out));audio.src=url;dl.href=url;dl.download='onestop-silence-removed.wav';dl.hidden=false;dl.textContent='⬇️ Download processed audio';msg.textContent=`Done — reduced from ${buf.duration.toFixed(2)}s to ${out.duration.toFixed(2)}s.`}catch(e){msg.textContent='Processing failed: '+e.message}};function wav(b){const n=b.numberOfChannels,l=b.length,r=b.sampleRate,a=new ArrayBuffer(44+l*n*2),v=new DataView(a),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+l*n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,n,true);v.setUint32(24,r,true);v.setUint32(28,r*n*2,true);v.setUint16(32,n*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,l*n*2,true);let p=44;for(let i=0;i<l;i++)for(let c=0;c<n;c++){let x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([a],{type:'audio/wav'})}</script></body></html>
