<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mute Audio - ONESTOP</title><style>body{margin:0;padding:20px;font-family:system-ui;background:#070916;color:#fff}.box{max-width:700px;margin:auto;background:#11162f;padding:24px;border-radius:20px}h1{margin-top:0}input,button{width:100%;box-sizing:border-box;margin:8px 0;padding:13px;border-radius:10px;border:0}button{background:#16d9ff;color:#001018;font-weight:800;cursor:pointer}button:disabled{opacity:.45}audio{width:100%;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{min-height:24px;color:#9fe9ff}@media(max-width:500px){.row{grid-template-columns:1fr}}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main class="box"><h1>🔇 Mute Audio</h1><p>Select an audio file, choose the section to mute, then export a new WAV.</p><input id="file" type="file" accept="audio/*"><audio id="player" controls></audio><div class="row"><label>Start (sec)<input id="start" type="number" min="0" step="0.01" value="0"></label><label>End (sec)<input id="end" type="number" min="0" step="0.01" value="0"></label></div><button id="go" disabled>Mute Selected Section & Export WAV</button><div id="msg" class="msg"></div><a id="dl" hidden>Download muted audio</a></main><script>let buffer=null;const file=document.getElementById('file'),player=document.getElementById('player'),start=document.getElementById('start'),end=document.getElementById('end'),go=document.getElementById('go'),msg=document.getElementById('msg'),dl=document.getElementById('dl');file.onchange=async()=>{try{msg.textContent='Loading…';const f=file.files[0];if(!f)return;player.src=URL.createObjectURL(f);const c=new AudioContext();buffer=await c.decodeAudioData(await f.arrayBuffer());await c.close();start.max=end.max=buffer.duration.toFixed(2);end.value=buffer.duration.toFixed(2);go.disabled=false;msg.textContent=`Loaded ${buffer.duration.toFixed(2)} seconds.`}catch(e){msg.textContent='Could not decode this audio file. Try MP3, WAV, OGG or M4A.';go.disabled=true}};go.onclick=()=>{try{let s=Math.max(0,Number(start.value)),e=Math.min(buffer.duration,Number(end.value));if(e<=s){msg.textContent='End time must be greater than start time.';return}const out=new AudioBuffer({length:buffer.length,numberOfChannels:buffer.numberOfChannels,sampleRate:buffer.sampleRate});const a=Math.floor(s*buffer.sampleRate),b=Math.floor(e*buffer.sampleRate);for(let ch=0;ch<buffer.numberOfChannels;ch++){const src=buffer.getChannelData(ch),dst=out.getChannelData(ch);dst.set(src);dst.fill(0,a,b)}const blob=wav(out),url=URL.createObjectURL(blob);dl.href=url;dl.download='onestop-muted-audio.wav';dl.hidden=false;dl.textContent='⬇️ Download muted audio';msg.textContent='Done.'}catch(e){msg.textContent='Export failed: '+e.message}};function wav(b){const n=b.numberOfChannels,l=b.length,rate=b.sampleRate,ab=new ArrayBuffer(44+l*n*2),v=new DataView(ab),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+l*n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,n,true);v.setUint32(24,rate,true);v.setUint32(28,rate*n*2,true);v.setUint16(32,n*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,l*n*2,true);let p=44;for(let i=0;i<l;i++)for(let ch=0;ch<n;ch++){let x=Math.max(-1,Math.min(1,b.getChannelData(ch)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}</script></body></html>
