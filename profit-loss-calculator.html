<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profit &amp; Loss Calculator | ONESTOP</title><style>body{margin:0;font-family:system-ui;background:#070916;color:#fff;padding:20px}.box{max-width:650px;margin:auto;background:#11162f;padding:22px;border-radius:18px}label{display:block;margin:12px 0}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2b365d;background:#0d1128;color:#fff}button{background:#38e8ff;color:#001018;border:0;font-weight:800;cursor:pointer;margin-top:8px}.result{margin-top:18px;padding:16px;background:#0d1128;border-radius:12px;line-height:1.8}.muted{color:#aeb7d8}a{color:#38e8ff}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main class="box"><a href="free-tools.html">← Back to Free Tools</a><h1>📦 Profit &amp; Loss Calculator</h1><p class="muted">Calculate profit/loss and the percentage based on cost price.</p><label>Cost Price (CP)<input id="c" type="number" min="0" step="0.01" placeholder="1000"></label><label>Selling Price (SP)<input id="s" type="number" min="0" step="0.01" placeholder="1200"></label><button id="go">Calculate</button><div id="out" class="result">Enter values and calculate.</div></main><script>const $=id=>document.getElementById(id);$('go').onclick=()=>{const c=+$('c').value,s=+$('s').value;if(!Number.isFinite(c)||!Number.isFinite(s)||c<=0||s<0){$('out').textContent='Enter valid prices. Cost price must be greater than 0.';return}const diff=s-c,pct=Math.abs(diff)/c*100;if(diff>0)$('out').innerHTML=`<b>Profit:</b> ₹${diff.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Profit %:</b> ${pct.toFixed(2)}%`;else if(diff<0)$('out').innerHTML=`<b>Loss:</b> ₹${Math.abs(diff).toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Loss %:</b> ${pct.toFixed(2)}%`;else $('out').innerHTML='<b>No Profit, No Loss</b><br>Profit/Loss: ₹0'}</script></body></html>
