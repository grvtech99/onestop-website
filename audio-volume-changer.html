<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volume Changer - ONESTOP</title><style>body{margin:0;padding:20px;font-family:system-ui;background:#070916;color:#fff}.box{max-width:700px;margin:auto;background:#11162f;padding:24px;border-radius:20px}input,button{width:100%;box-sizing:border-box;margin:9px 0;padding:13px;border-radius:10px;border:0}button{background:#16d9ff;font-weight:800;cursor:pointer}audio{width:100%;margin:10px 0}.msg{min-height:26px;color:#9fe9ff}.value{text-align:center;font-size:24px;font-weight:800}</style></head><body><main class="box"><h1>🔊 Volume Changer</h1><p>Increase or decrease audio volume and export a new WAV file.</p><input id="file" type="file" accept="audio/*"><input id="gain" type="range" min="0" max="200" value="100"><div class="value" id="val">100%</div><button id="go" disabled>Apply Volume & Export WAV</button><div class="msg" id="msg"></div><audio id="audio" controls></audio><a id="dl" hidden>Download</a></main><script>let b=null;const f=document.getElementById('file'),g=document.getElementById('gain'),v=document.getElementById('val'),go=document.getElementById('go'),m=document.getElementById('msg'),a=document.getElementById('audio'),d=document.getElementById('dl');g.oninput=()=>v.textContent=g.value+'%';f.onchange=async()=>{try{const x=f.files[0];if(!x)return;m.textContent='Loading…';const c=new AudioContext();b=await c.decodeAudioData(await x.arrayBuffer());await c.close();go.disabled=false;m.textContent=`Loaded ${b.duration.toFixed(2)} seconds.`}catch(e){m.textContent='Could not decode this audio file.'}};go.onclick=()=>{try{const factor=+g.value/100,out=new AudioBuffer({length:b.length,numberOfChannels:b.numberOfChannels,sampleRate:b.sampleRate});for(let c=0;c<b.numberOfChannels;c++){const s=b.getChannelData(c),t=out.getChannelData(c);for(let i=0;i<s.length;i++)t[i]=Math.max(-1,Math.min(1,s[i]*factor))}const u=URL.createObjectURL(wav(out));a.src=u;d.href=u;d.download='onestop-volume-changed.wav';d.hidden=false;d.textContent='⬇️ Download volume-changed audio';m.textContent='Done.'}catch(e){m.textContent='Export failed: '+e.message}};function wav(b){const n=b.numberOfChannels,l=b.length,r=b.sampleRate,x=new ArrayBuffer(44+l*n*2),v=new DataView(x),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+l*n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,n,true);v.setUint32(24,r,true);v.setUint32(28,r*n*2,true);v.setUint16(32,n*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,l*n*2,true);let p=44;for(let i=0;i<l;i++)for(let c=0;c<n;c++){let z=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,z<0?z*32768:z*32767,true);p+=2}return new Blob([x],{type:'audio/wav'})}</script></body></html>
