<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONESTOP Typing Master</title>
<style>
:root{
  --blue:#1268d5;--blue2:#0754b7;--ink:#183a66;--panel:#eef3ff;
  --line:#b9c9ed;--bg:#f5f8fd;--white:#fff;
  --lp:#ef476f;--lr:#9b5de5;--li:#8ac926;--ri:#1982c4;--rr:#6a4c93;--rp:#ef476f;--th:#f4a261;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
button,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;overflow:auto}
.classic-page{
  min-height:100vh;padding:30px 20px 34px;
  background:
    radial-gradient(circle at 95% 5%,#0b92e8 0 180px,transparent 181px),
    radial-gradient(circle at 2% 92%,#0751b8 0 175px,transparent 176px),
    linear-gradient(135deg,#f8fbff,#eef4fa);
}
.classic-header{
  width:min(790px,100%);margin:0 auto 22px;
  display:flex;align-items:center;gap:14px;
}
.brand-mark{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(145deg,#0b59c7,#063c98);
  color:#fff;display:grid;place-items:center;
  font-size:38px;font-weight:900;
  box-shadow:0 6px 16px #174f9c33;
}
.brand-title{font-size:39px;font-weight:800;font-style:italic;color:#1268d5;letter-spacing:-1.5px}
.brand-sub{font-size:11px;color:#67819c;margin-top:2px}
.workspace{
  width:min(790px,100%);margin:0 auto;
  background:#fff;border:7px solid #fff;
  box-shadow:0 15px 40px #183d6530;
  display:grid;grid-template-columns:minmax(0,1fr) 205px;
  grid-template-rows:auto auto auto auto;
  grid-template-areas:"lesson progress" "keyboard progress" "hands progress" "controls progress";
}
.lesson-board{grid-area:lesson;background:#f1f5ff;border-right:1px solid #cad7ec;padding:18px 24px 12px}
.target-line{height:66px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.target-key{
  width:34px;height:36px;border:1px solid #aebde5;background:#f9fbff;
  color:#154a9a;display:grid;place-items:center;font-size:18px;font-weight:800;
  position:relative;border-radius:1px;flex:0 0 auto;
}
.target-key.current{border:2px solid #0b58c5;background:#fff;box-shadow:0 0 0 2px #d9e5ff}
.target-key.done{opacity:.42}
.target-key.wrong{background:#ffd8d8;border-color:#d22;color:#a00}
.target-key .dot,.key .dot{position:absolute;width:6px;height:6px;border-radius:50%;bottom:3px;left:4px;border:1px solid #fff;box-shadow:0 0 0 1px #7083a3}
.target-key.space{width:54px;font-size:9px}
.drill-title{font-size:12px;font-weight:800;margin:4px 0 5px;color:#2e5688}
.drill-text{font-size:14px;line-height:1.45;color:#55708c;height:42px;overflow:hidden}
.keyboard-wrap{grid-area:keyboard;background:#f1f5ff;padding:0 22px 12px;border-right:1px solid #cad7ec}
.keyboard{display:grid;gap:3px}
.keyrow{display:flex;gap:3px}
.key{
  flex:1;height:35px;border:1px solid #9db0dc;border-radius:2px;
  background:#edf1ff;color:#163f79;font-weight:800;font-size:11px;
  display:grid;place-items:center;position:relative;min-width:0;
  box-shadow:0 1px 0 #7f91bb;
}
.key:hover{filter:brightness(.98)}
.key.active{background:#fff;border:2px solid #0d5fc9;color:#0d5fc9;box-shadow:0 0 0 2px #d9e5ff}
.key.error{background:#ffd2d2!important;border-color:#c11!important;color:#9d1111!important}
.key.space{flex:0 0 54%;height:30px}
.key .dot{bottom:3px;left:4px}
.f-lp{--fc:var(--lp)}.f-lr{--fc:var(--lr)}.f-li{--fc:var(--li)}.f-ri{--fc:var(--ri)}.f-rr{--fc:var(--rr)}.f-rp{--fc:var(--rp)}.f-th{--fc:var(--th)}
.key .dot{background:var(--fc)}
.hands{grid-area:hands;background:#f1f5ff;border-right:1px solid #cad7ec;height:145px;display:flex;justify-content:center;align-items:flex-end;gap:28px;overflow:hidden;padding-top:8px}
.hand{width:180px;height:135px;position:relative}
.palm{position:absolute;left:43px;bottom:-33px;width:96px;height:100px;border-radius:48% 48% 25% 25%;background:linear-gradient(150deg,#ffe0c5,#edb08d 58%,#c77c60);border:2px solid #a8664e;box-shadow:inset 5px 5px 10px #fff8,0 2px 3px #86503e55}
.finger{position:absolute;bottom:50px;width:22px;border-radius:14px 14px 8px 8px;background:linear-gradient(150deg,#ffe2c7,#e9a981 65%,#c57a5e);border:2px solid #a8664e;transform-origin:bottom;transition:.15s}
.finger:after{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#fff8;border:1px solid #a8664e}
.finger.active{background:#ffd54a;border-color:#b77900;box-shadow:0 0 0 3px #fff,0 0 0 5px #f0ad00,0 0 15px #ffd54a}
.left .pinky{left:23px;height:57px;transform:rotate(-20deg)}
.left .ring{left:48px;height:88px;transform:rotate(-8deg)}
.left .middle{left:76px;height:99px}
.left .index{left:103px;height:91px;transform:rotate(6deg)}
.left .thumb{left:126px;bottom:39px;height:57px;transform:rotate(45deg)}
.right .pinky{right:23px;height:57px;transform:rotate(20deg)}
.right .ring{right:48px;height:88px;transform:rotate(8deg)}
.right .middle{right:76px;height:99px}
.right .index{right:103px;height:91px;transform:rotate(-6deg)}
.right .thumb{right:126px;bottom:39px;height:57px;transform:rotate(-45deg)}
.hand-label{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;color:#71859b;white-space:nowrap}
.progress-panel{grid-area:progress;background:#dceafb;padding:18px 14px;display:flex;flex-direction:column;min-height:560px}
.progress-title{font-weight:900;font-size:13px;padding-bottom:9px;border-bottom:2px solid #fff}
.bars{height:120px;display:flex;align-items:end;justify-content:center;gap:3px;padding:15px 0}
.bar{width:12px;background:#efffdc;border:1px solid #63784b}
.bar:nth-child(1){height:22px}.bar:nth-child(2){height:30px}.bar:nth-child(3){height:38px}.bar:nth-child(4){height:47px}.bar:nth-child(5){height:57px}.bar:nth-child(6){height:68px}.bar:nth-child(7){height:80px}.bar:nth-child(8){height:92px}.bar:nth-child(9){height:104px}.bar:nth-child(10){height:114px}
.side-label{font-size:10px;font-weight:800;margin-top:7px}
.side-time{font-size:25px;font-weight:900;margin:3px 0 8px}
.side-value{font-size:19px;font-weight:900;padding:7px 0;border-bottom:1px solid #fff}
.progress-panel .spacer{flex:1}
.side-btn{width:100%;padding:10px 6px;border-radius:7px;border:1px solid #1268d5;font-weight:800}
.next{background:#1268d5;color:#fff}.back{background:#fff;color:#1268d5;margin-top:8px}
.controls{grid-area:controls;background:#f7f9fd;border-top:1px solid #c9d7e9;padding:10px 18px;display:flex;gap:6px}
.controls select,.controls button{height:32px;border:1px solid #afc2df;background:#fff;color:#23496f;border-radius:4px;padding:0 8px;font-size:11px}
.controls .start{background:#1268d5;color:#fff;border-color:#1268d5;flex:1}
.controls .clear{width:70px}
.hidden{display:none!important}
.dot-lp{background:var(--lp)}.dot-lr{background:var(--lr)}.dot-li{background:var(--li)}.dot-ri{background:var(--ri)}.dot-rr{background:var(--rr)}.dot-rp{background:var(--rp)}.dot-th{background:var(--th)}
@media(max-width:800px){
 .classic-page{padding:14px 7px 22px;background:#f5f8fd}
 .classic-header{margin-bottom:10px}.brand-mark{width:45px;height:45px;font-size:27px}.brand-title{font-size:27px}
 .workspace{grid-template-columns:1fr;grid-template-areas:"lesson" "keyboard" "hands" "controls" "progress"}
 .lesson-board,.keyboard-wrap,.hands{border-right:0}
 .progress-panel{min-height:220px}
 .target-key{width:28px;height:31px;font-size:14px}.target-line{height:55px}
 .keyboard-wrap{padding:0 6px 8px}.key{height:31px;font-size:9px}.key.space{height:27px}
 .hands{height:110px;gap:0}.hand{transform:scale(.72);transform-origin:bottom center}
 .drill-text{font-size:12px}
}
</style>
</head>
<body>
<div class="app">
<section class="classic-page">
  <div class="classic-header">
    <div class="brand-mark">T</div>
    <div><div class="brand-title">ONESTOP TypingMaster</div><div class="brand-sub">Learn • Practice • Test • Play</div></div>
  </div>

  <main class="workspace" id="workspace">
    <section class="lesson-board">
      <div class="target-line" id="targetLine"></div>
      <div class="drill-title" id="drillTitle">Home Row — Finger Placement</div>
      <div class="drill-text" id="drillText">Place your fingers correctly and practice only the selected keys. Accuracy comes before speed.</div>
    </section>

    <section class="keyboard-wrap">
      <div class="keyboard" id="keyboard"></div>
    </section>

    <section class="hands">
      <div class="hand left" id="leftHand"><span class="hand-label">LEFT HAND</span><div class="palm"></div>
        <i class="finger pinky" data-f="lp"></i><i class="finger ring" data-f="lr"></i><i class="finger middle" data-f="li"></i><i class="finger index" data-f="li"></i><i class="finger thumb" data-f="th"></i>
      </div>
      <div class="hand right" id="rightHand"><span class="hand-label">RIGHT HAND</span><div class="palm"></div>
        <i class="finger thumb" data-f="th"></i><i class="finger index" data-f="ri"></i><i class="finger middle" data-f="ri"></i><i class="finger ring" data-f="rr"></i><i class="finger pinky" data-f="rp"></i>
      </div>
    </section>

    <aside class="progress-panel">
      <div class="progress-title">▥ YOUR PROGRESS</div>
      <div class="bars" id="bars"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div>
      <div class="side-label">TIME</div><div class="side-time" id="time">00:00</div>
      <div class="side-label">WPM</div><div class="side-value" id="wpm">0</div>
      <div class="side-label">ACCURACY</div><div class="side-value" id="accuracy">100%</div>
      <div class="side-label">ERRORS</div><div class="side-value" id="errors">0</div>
      <div class="spacer"></div>
      <button class="side-btn next" id="nextBtn">Next</button>
      <button class="side-btn back" id="backBtn">Back</button>
    </aside>

    <div class="controls">
      <select id="level">
        <option value="home">Basic 1 — ASDFG / HJKL;</option>
        <option value="top">Basic 2 — QWERTY / UIOP</option>
        <option value="bottom">Basic 3 — ZXCV / BNM</option>
        <option value="full">Basic 4 — Full Letters</option>
        <option value="words">Intermediate — Words</option>
        <option value="paragraph">Advanced — Paragraph</option>
      </select>
      <button class="start" id="startBtn">Start / Restart</button>
      <button class="clear" id="clearBtn">Clear</button>
    </div>
  </main>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const fingers={q:"lp",a:"lp",z:"lp",w:"lr",s:"lr",x:"lr",e:"li",d:"li",c:"li",r:"li",f:"li",v:"li",t:"li",g:"li",b:"li",y:"ri",h:"ri",n:"ri",u:"ri",j:"ri",m:"ri",i:"rr",k:"rr",",":"rr",o:"rr",l:"rr",".":"rr",">":"rr",p:"rp",";":"rp","/":"rp","?":"rp","[":"rp","]":"rp","-":"rp","=":"rp"," ":"th","1":"lp","2":"lr","3":"li","4":"li","5":"li","6":"ri","7":"ri","8":"ri","9":"rr","0":"rp"};
const rows=["1234567890-=","qwertyuiop[]\\","asdfghjkl;'","zxcvbnm,./"];
const texts={
 home:"asdfg hjkl; asdfg fdsa hjkl; aa ss dd ff gg hh jj kk ll ;; as df gh hj kl ;l",
 top:"qwerty uiop qw er ty yu ui io op qi wo ei ru to yp",
 bottom:"zxcv bnm zxcv bnm zx cv bn nm xc vb",
 full:"asdf jkl; sad dad lad ask flask fall all the quick brown fox jumps",
 words:"the quick brown fox jumps over the lazy dog. good typing needs correct finger placement.",
 paragraph:"Good typing is built with correct finger placement, steady rhythm, careful accuracy, and relaxed hands."
};
const names={lp:"Left little",lr:"Left ring",li:"Left index",ri:"Right index",rr:"Right ring",rp:"Right little",th:"Thumb"};
let target="",started=false,startTime=0,timer=null,errors=0;
function keyForChar(ch){return (ch||"").toLowerCase()}
function buildTarget(level){
 let base=texts[level]||texts.home;
 if(["home","top","bottom"].includes(level)){let s="";while(s.length<70)s+=base+" ";return s.trim()}
 let s="";while(s.length<240)s+=base+" ";return s.trim()
}
function keyClass(k){return "f-"+(fingers[k]||"ri")}
function makeKeyboard(){
 let html="";
 rows.forEach(row=>{html+="<div class='keyrow'>";[...row].forEach(k=>{
   html+="<button class='key "+keyClass(k)+"' data-key='"+k.replace(/'/g,"&#39;")+"'>"+k.replace(/</g,"&lt;")+"<i class='dot dot-"+(fingers[k]||"ri")+"'></i></button>";
 });html+="</div>"});
 html+="<div class='keyrow'><button class='key space f-th' data-key=' '>SPACE<i class='dot dot-th'></i></button></div>";
 $("keyboard").innerHTML=html;
 document.querySelectorAll(".key").forEach(k=>k.addEventListener("click",()=>typeKey(k.dataset.key)));
}
function renderTarget(){
 const pos=$("input")?.value.length||0;
 const start=Math.max(0,pos-2), chars=target.slice(start,start+8);
 $("targetLine").innerHTML=chars.map((ch,i)=>{
   const idx=start+i, f=fingers[ch.toLowerCase()]||"ri";
   return "<span class='target-key "+(idx===pos?"current ":"")+(idx<pos?"done ":"")+(ch===" "?"space":"")+"'>"+(ch===" "?"SPACE":ch)+"<i class='dot dot-"+f+"'></i></span>";
 }).join("");
}
function highlight(){
 document.querySelectorAll(".key").forEach(k=>k.classList.remove("active"));
 document.querySelectorAll(".finger").forEach(f=>f.classList.remove("active"));
 const ch=target[$("input").value.length]||"";
 const k=[...document.querySelectorAll(".key")].find(x=>x.dataset.key===ch);
 if(k)k.classList.add("active");
 const f=fingers[ch.toLowerCase()]||"";
 if(f)document.querySelectorAll("[data-f='"+f+"']").forEach(x=>x.classList.add("active"));
 renderTarget();
}
function start(){
 clearInterval(timer);started=false;errors=0;$("input")?.remove();
 const ta=document.createElement("textarea");ta.id="input";ta.setAttribute("aria-label","Typing input");
 ta.style.cssText="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0";
 document.body.appendChild(ta);
 target=buildTarget($("level").value);$("time").textContent="00:00";$("wpm").textContent="0";$("accuracy").textContent="100%";$("errors").textContent="0";
 renderTarget();highlight();ta.focus();
 ta.addEventListener("input",onInput);
}
function onInput(){
 const ta=$("input"),v=ta.value,pos=v.length-1,expected=(target[pos]||"").toLowerCase(),typed=(v[pos]||"").toLowerCase();
 if(!started){started=true;startTime=Date.now();timer=setInterval(update,100)}
 if(typed&&typed!==expected){errors++;const k=[...document.querySelectorAll(".key")].find(x=>x.dataset.key===v[pos]);if(k){k.classList.add("error");setTimeout(()=>k.classList.remove("error"),180)}}
 update();highlight();
 if(v.length>=target.length){clearInterval(timer);started=false}
}
function update(){
 const v=$("input")?.value||"",elapsed=started?Math.max(1,(Date.now()-startTime)/1000):Math.max(1,(Date.now()-startTime)/1000);
 $("time").textContent=Math.floor(elapsed/60).toString().padStart(2,"0")+":"+Math.floor(elapsed%60).toString().padStart(2,"0");
 const wpm=Math.round((v.length/5)/(elapsed/60));$("wpm").textContent=isFinite(wpm)?wpm:0;
 const good=Math.max(0,v.length-errors);$("accuracy").textContent=(v.length?Math.max(0,Math.round(good/v.length*100)):100)+"%";$("errors").textContent=errors;
}
function typeKey(ch){
 const ta=$("input");if(!ta)return;
 const pos=ta.selectionStart||ta.value.length;ta.setRangeText(ch,pos,ta.selectionEnd||pos,"end");ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus()
}
$("startBtn").onclick=start;$("clearBtn").onclick=start;
$("level").onchange=start;
$("nextBtn").onclick=()=>{let i=$("level").selectedIndex;if(i<$("level").options.length-1){$("level").selectedIndex=i+1;start()}};
$("backBtn").onclick=()=>{clearInterval(timer);window.history.back()};
makeKeyboard();start();
</script>
</body>
</html>
