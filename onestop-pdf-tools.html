function closeTool(){modal.classList.remove('show');body.innerHTML=''}modal.onclick=e=>{if(e.target===modal)closeTool()};function base(type,multi,desc){let a=type==='pdf'?'.pdf':type==='image'?'image/jpeg,image/png':type==='docx'?'.docx':type==='pptx'?'.ppt,.pptx':type==='xlsx'?'.xls,.xlsx':'.html,.htm';return '<div class="drop" id="drop"><input id="pick" type="file" accept="'+a+'" '+(multi?'multiple':'')+'><b>📁 Click to select or drag & drop</b><div style="margin-top:8px;color:var(--m);font-size:13px">'+esc(desc)+'</div></div><div id="list" class="files"></div><div class="prog"><i id="bar"></i></div><div id="status" class="status">Ready.</div>'}
function setup(multi){files=[];let d=document.getElementById('drop'),p=document.getElementById('pick'),l=document.getElementById('list');function show(){l.innerHTML=files.map((f,i)=>'<div class="file"><span>'+esc(f.name)+' — '+Math.max(1,Math.round(f.size/1024))+' KB</span><button class="smallbtn" data-i="'+i+'">Remove</button></div>').join('');l.querySelectorAll('button').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.i,1);show()})}function add(x){files=multi?[...files,...x]:[...x].slice(0,1);show()}d.onclick=()=>p.click();p.onchange=()=>add([...p.files]);d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};d.ondragleave=()=>d.classList.remove('drag');d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');add([...e.dataTransfer.files])}}

function openTool(t){title.textContent=t[1]+' '+t[0];let k=t[4],h='';if(['split','remove','extract'].includes(k))h=base('pdf',0,'Enter pages such as 1,3-5,8.')+'<input id="pages" type="text" placeholder="1,3-5,8"><div class="actions"><button class="btn" id="run">Process & Download</button></div>';else if(k==='organize')h=base('pdf',0,'Enter complete new order, e.g. 3,1,2,4.')+'<input id="order" type="text" placeholder="3,1,2,4"><div class="actions"><button class="btn" id="run">Reorder</button></div>';else if(k==='rotate')h=base('pdf',0,'Choose rotation.')+'<select id="deg"><option>90</option><option>180</option><option>270</option></select><div class="actions"><button class="btn" id="run">Rotate</button></div>';else if(['watermark','edit'].includes(k))h=base('pdf',0,'Enter text.')+'<input id="text" type="text" value="ONESTOP"><div class="actions"><button class="btn" id="run">Process</button></div>';else if(k==='sign')h=base('pdf',0,'Draw your signature below.')+'<canvas id="sig" width="600" height="190" style="width:100%;border:1px solid #ccd8ef;border-radius:9px;touch-action:none"></canvas><div class="actions"><button class="btn secondary" id="clear">Clear</button><button class="btn" id="run">Sign & Download</button></div>';else if(k==='redact')h=base('pdf',0,'Enter page and x,y,width,height in PDF points.')+'<input id="page" type="number" value="1"><input id="rect" type="text" value="50,50,150,40"><div class="actions"><button class="btn" id="run">Redact</button></div>';else if(k==='compare')h=base('pdf',1,'Select exactly two PDFs.')+'<div class="actions"><button class="btn" id="run">Compare</button></div>';else if(k==='jpgpdf')h=base('image',1,'Select JPG/PNG images.')+'<div class="actions"><button class="btn" id="run">Create PDF</button></div>';else if(k==='pdfjpg')h=base('pdf',0,'Select one PDF. Each page downloads as JPG.')+'<div class="actions"><button class="btn" id="run">Convert</button></div>';else if(k==='wordpdf')h=base('docx',0,'DOCX to PDF using browser async function run(k){if(!files.length)throw Error('Please select a file.');pg(8);if(k==='merge'){if(files.length<2)throw Error('Select at least two PDFs.');let o=await PDFLib.PDFDocument.create();for(let i=0;i<files.length;i++){let s=await PDFLib.PDFDocument.load(await bytes(files[i]));(await o.copyPages(s,s.getPageIndices())).forEach(p=>o.addPage(p));pg(10+(i+1)/files.length*85)}return dl(new Blob([await o.save({useObjectStreams:true})],{type:'application/pdf'}),'ONESTOP-Merged.pdf')}

if(k==='compare'){if(files.length!==2)throw Error('Select exactly two PDFs.');let a=await textOf(files[0]),b=await textOf(files[1]),da=await getPdf(files[0]),db=await getPdf(files[1]);let same=a.replace(/\s+/g,' ').trim()===b.replace(/\s+/g,' ').trim();st('PDF 1 pages: '+da.numPages+'\nPDF 2 pages: '+db.numPages+'\nExtracted text: '+(same?'MATCH':'DIFFERENT'));pg(100);return}
