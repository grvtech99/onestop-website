<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compound Interest Calculator | ONESTOP</title><style>body{margin:0;font-family:system-ui;background:#070916;color:#fff;padding:20px}.box{max-width:650px;margin:auto;background:#11162f;padding:22px;border-radius:18px}label{display:block;margin:12px 0}input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2b365d;background:#0d1128;color:#fff}button{background:#38e8ff;color:#001018;border:0;font-weight:800;cursor:pointer;margin-top:8px}.result{margin-top:18px;padding:16px;background:#0d1128;border-radius:12px;line-height:1.8}.muted{color:#aeb7d8}a{color:#38e8ff}</style></head><body><main class="box"><a href="free-tools.html">← Back to Free Tools</a><h1>💹 Compound Interest Calculator</h1><p class="muted">Estimate compound growth for savings or investments.</p><label>Principal Amount<input id="p" type="number" min="0" step="0.01" placeholder="10000"></label><label>Annual Interest Rate (%)<input id="r" type="number" min="0" step="0.01" placeholder="8"></label><label>Time (Years)<input id="t" type="number" min="0" step="0.1" placeholder="5"></label><label>Compounding<select id="n"><option value="1">Yearly</option><option value="2">Half-yearly</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option></select></label><button id="go">Calculate</button><div id="out" class="result">Enter values and calculate.</div></main><script>const $=id=>document.getElementById(id);$('go').onclick=()=>{const p=+$('p').value,r=+$('r').value,t=+$('t').value,n=+$('n').value;if(!Number.isFinite(p)||!Number.isFinite(r)||!Number.isFinite(t)||p<0||r<0||t<0){$('out').textContent='Please enter valid non-negative values.';return}const a=p*Math.pow(1+r/100/n,n*t),ci=a-p;$('out').innerHTML=`<b>Interest Earned:</b> ₹${ci.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Final Amount:</b> ₹${a.toLocaleString('en-IN',{maximumFractionDigits:2})}`}</script></body></html>
