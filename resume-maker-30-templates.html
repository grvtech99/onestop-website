<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Resume — 30 Professional Templates | ONESTOP</title><style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#edf1f6;color:#172033}.app{max-width:1400px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #d9e1eb;border-radius:14px;padding:12px 16px;margin-bottom:12px}.brand{font-weight:900}.back{color:#0757c9;text-decoration:none;font-weight:800}.panel{background:#fff;border:1px solid #d9e1eb;border-radius:14px;padding:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid #cfd8e6;background:#f8fbff;padding:9px 12px;border-radius:9px;font-weight:800;cursor:pointer}.tab.active{background:#0757c9;color:#fff}.notice{padding:10px 12px;background:#eef5ff;border-left:4px solid #0757c9;border-radius:8px;margin-bottom:12px}.templates{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.template{border:1px solid #d9e1eb;border-radius:12px;padding:12px;background:#fff}.template h3{font-size:14px;margin:0 0 6px}.template p{font-size:12px;color:#60708d;min-height:34px}.open{background:#0757c9;color:#fff;border:0;border-radius:8px;padding:8px 10px;font-weight:800}.locked{background:#f3f5f8;color:#8b95a6;border-color:#d8dde5}.foot{text-align:center;color:#60708d;font-size:12px;margin-top:15px}@media(max-width:1000px){.templates{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.templates{grid-template-columns:repeat(2,1fr)}.top{gap:10px;align-items:flex-start;flex-direction:column}}</style></head><body><div class="app"><header class="top"><div class="brand">📄 ONESTOP Digital Solutions — One Resume</div><a class="back" href="free-online-games.html">← Back to Free Online Games</a></header><main class="panel"><div class="tabs"><button class="tab active" onclick="show('basic',this)">Basic • 10 Free</button><button class="tab" onclick="show('advance',this)">Advance • 10 Premium</button><button class="tab" onclick="show('pro',this)">Pro • 10 Premium</button></div><div id="notice" class="notice">Basic templates are free. Premium templates are ₹499/month.</div><div id="templates" class="templates"></div></main><div class="foot">© 2026 ONESTOP Digital Solutions. All Rights Reserved.</div></div><script>const groups={basic:[['B01','Classic','ATS-friendly single-column'],['B02','Modern','Clean professional layout'],['B03','Professional','Balanced corporate structure'],['B04','Student','Education-first format'],['B05','Simple','Minimal and readable'],['B06','Career','Experience-focused format'],['B07','Fresh','Modern starter resume'],['B08','Executive Lite','Strong senior profile'],['B09','Job Ready','Practical job-seeker layout'],['B10','Clean Edge','Polished basic format']],advance:[['A01','Modern Pro','Enhanced professional layout'],['A02','Corporate','Business-ready presentation'],['A03','Elegant','Refined visual hierarchy'],['A04','Executive','Leadership-oriented layout'],['A05','Creative Pro','Modern professional styling'],['A06','Consultant','Consulting-style resume'],['A07','Manager','Management-focused structure'],['A08','Tech Pro','Technology professional layout'],['A09','Marketing Pro','Brand and communication focus'],['A10','Premium Clean','High-end clean design']],pro:[['P01','Corporate Elite','Senior corporate profile'],['P02','Executive Black','Executive-style layout'],['P03','Boardroom','Leadership and strategy focus'],['P04','Global Executive','International profile format'],['P05','Director','Director-level presentation'],['P06','Founder','Founder and entrepreneur layout'],['P07','C-Suite','C-suite professional structure'],['P08','Premium Modern','High-end modern corporate'],['P09','Strategic Leader','Strategy and achievements focus'],['P10','Signature','Premium signature resume']]};function show(group,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');const premium=group!=='basic';document.getElementById('notice').innerHTML=premium?'🔒 Premium templates: <b>₹499/month</b>. Advance + Pro are locked in the free version.':'🟢 Basic templates are <b>FREE</b>.';document.getElementById('templates').innerHTML=groups[group].map(t=>`<article class="template"><h3>${t[0]} — ${t[1]}</h3><p>${t[2]}</p><button class="open ${premium?'locked':''}" ${premium?'onclick="alert(\'Premium plan: ₹499/month. Advance + Pro templates are locked in the free version.\')"':'onclick="alert(\'Basic template selected. The shared resume editor can be connected here.\')"'}>${premium?'🔒 Premium':'Open Template'}</button></article>`).join('')}show('basic',document.querySelector('.tab'));</script></body></html>
