<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1Click ID Card Print Maker — Free Version</title><style>:root{--blue:#0b63ce;--bg:#eef3f8}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Arial;background:var(--bg);color:#102033}header{height:68px;background:linear-gradient(135deg,#0757b8,#1591ff);color:#fff;padding:8px 16px;display:flex;align-items:center}header h1{margin:0;font-size:20px}.app{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 68px)}aside{background:#fff;padding:10px;overflow:auto}.section{border:1px solid #d7e0ea;border-radius:10px;padding:10px;margin-bottom:8px}.section h3{margin:0 0 8px;font-size:13px}button,input{font:inherit}button{padding:8px;border:1px solid #cbd7e4;border-radius:7px;background:#fff;cursor:pointer}.primary{background:var(--blue);color:#fff;border-color:var(--blue);width:100%}.upload-buttons{display:grid;gap:5px}.upload-mode{text-align:left;font-weight:700}.upload-mode.active{background:#eaf3ff;border-color:var(--blue);color:#0757b8}.hidden{display:none}.status{font-size:10px;color:#5b6b7c;margin-top:7px}.adjust label{font-size:10px;display:flex;justify-content:space-between}.adjust input{width:100%}.preview{background:#dfe7ef;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.paper{position:relative;background:#fff;width:min(56vw,794px);aspect-ratio:210/297;box-shadow:0 2px 14px #0002}.slot{position:absolute;width:40.95%;height:18.18%;left:29.52%;border:2px dashed #8da2b6;overflow:hidden}.slot.front{top:39.9%}.slot.back{top:58.75%}.slot img{width:100%;height:100%;object-fit:contain}.empty{text-align:center;color:#637486;padding:30px}@media(max-width:850px){html,body{overflow:auto}.app{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 68px)}.preview{height:calc(100vh - 360px);min-height:420px}.paper{width:min(90vw,794px)}}</style></head><body><header><h1>1Click ID Card Print Maker free version</h1></header><div class="app"><aside><div class="section"><h3>Document Type</h3><div class="upload-buttons"><button class="upload-mode active" id="two">▣ 2 Side ID Card</button><button class="upload-mode" id="one">▤ 1 Side ID Card</button><button class="upload-mode" id="a4">▥ A4 Document</button></div><input id="front" class="hidden" type="file" accept="image/*"><input id="back" class="hidden" type="file" accept="image/*"><input id="single" class="hidden" type="file" accept="image/*"><div class="status" id="status">2 Side ID Card: add Front and Back.</div></div><div class="section"><h3>✦ Image Tools</h3><div class="adjust"><label>Zoom <output id="zoomVal">100%</output></label><input id="zoom" type="range" min="25" max="2000" value="100"></div></div><div class="section"><button id="jpg" class="primary">⬇ Download JPG</button></div><div class="status">Free: Zoom, position and JPG download. Files are processed in your browser.</div></aside><main class="preview"><div class="paper" id="paper"></div></main></div><script>let mode='two',imgs=[null,null],zoom=100;const paper=document.getElementById('paper'),status=document.getElementById('status'),z=document.getElementById('zoom'),zv=document.getElementById('zoomVal');function render(){paper.innerHTML='';if(mode==='two'){slot('UPLOAD FRONT','front',imgs[0]);slot('UPLOAD BACK','back',imgs[1])}else if(mode==='one'){slot('UPLOAD ID CARD','front',imgs[0])}else{const s=document.createElement('div');s.className='empty';s.textContent=imgs[0]?'A4 document loaded':'UPLOAD A4 DOCUMENT';paper.appendChild(s)}update()}function slot(label,cls,src){const d=document.createElement('div');d.className='slot '+cls;if(src){const i=document.createElement('img');i.src=src;i.style.transform='scale('+zoom/100+')';d.appendChild(i)}else{d.textContent=label;d.style.display='flex';d.style.alignItems='center';d.style.justifyContent='center';d.style.color='#637486';d.style.fontSize='12px'}paper.appendChild(d)}function update(){status.textContent=mode==='two'?(imgs[0]&&imgs[1]?'2 Side ID Card: Front ✓ • Back ✓ • Ready to download':'2 Side ID Card: add Front and Back.'):imgs[0]?(mode==='one'?'1 Side ID Card: Ready to download':'A4 Document: Ready to download'):(mode==='one'?'1 Side ID Card: add image.':'A4 Document: add image.')}function file(input,n){input.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imgs[n]=r.result;render()};r.readAsDataURL(f)}}file(document.getElementById('front'),0);file(document.getElementById('back'),1);file(document.getElementById('single'),0);function choose(m){mode=m;imgs=[null,null];zoom=100;z.value=100;zv.textContent='100%';document.querySelectorAll('.upload-mode').forEach(b=>b.classList.remove('active'));document.getElementById(m).classList.add('active');render();if(m==='two')document.getElementById('front').click();else document.getElementById('single').click()}document.getElementById('two').onclick=()=>choose('two');document.getElementById('one').onclick=()=>choose('one');document.getElementById('a4').onclick=()=>choose('a4');z.oninput=()=>{zoom=+z.value;zv.textContent=zoom+'%';render()};document.getElementById('jpg').onclick=()=>{if(!imgs[0]||(mode==='two'&&!imgs[1])){alert(mode==='two'?'Please upload Front and Back.':'Please upload an image.');return}const c=document.createElement('canvas'),S=300/25.4;c.width=210*S;c.height=297*S;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);const draw=(src,xx,yy,w,h)=>new Promise(res=>{const i=new Image();i.onload=()=>{const fit=Math.min(w/i.width,h/i.height),dw=i.width*fit,dh=i.height*fit;x.save();x.beginPath();x.rect(xx,yy,w,h);x.clip();x.translate(xx+w/2,yy+h/2);x.scale(zoom/100,zoom/100);x.drawImage(i,-dw/2,-dh/2,dw,dh);x.restore();res()};i.src=src});(async()=>{if(mode==='two'){const w=86,h=54,g=4,xx=(210-w)/2,yy=(297-(h*2+g))/2;await draw(imgs[0],xx,yy,w,h);await draw(imgs[1],xx,yy+h+g,w,h)}else if(mode==='one'){const w=86,h=54;await draw(imgs[0],(210-w)/2,(297-h)/2,w,h)}else await draw(imgs[0],0,0,210,297);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='1click-id-card-print-maker.jpg';a.click() },'image/jpeg',.9)})()};render()</script></body></html>
