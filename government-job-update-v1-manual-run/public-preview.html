<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP Job Update — Test Preview</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="nav"><div class="brand">ONESTOP JOB UPDATE <small>TEST PUBLIC PREVIEW</small></div><a class="btn secondary" href="admin.html">← Admin</a></div></header><main class="wrap"><div id="empty" class="card"><h2>No test record found</h2><p class="muted">Run Execute Test from the admin page first.</p></div><div id="view" class="preview hidden"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const r=localStorage.getItem('onestopJobV1TestRecord');if(r){const x=JSON.parse(r),v=x.fields||[],custom=x.custom||[],tables=x.tables||[],links=x.links||[];document.title=(v.find(f=>f[0]=='Recruitment Name')?.[1]||'Job')+' — ONESTOP';const sec=(title,a)=>a.length?`<div class="section"><h3>${esc(title)}</h3><div class="kv">${a.filter(f=>f[1]).map(f=>`<div><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join('')}</div></div>`:'';document.getElementById('empty').classList.add('hidden');const view=document.getElementById('view');view.classList.remove('hidden');view.innerHTML=`<div class="preview-head"><span class="pill">TEST / NOT LIVE</span><h1>${esc(v.find(f=>f[0]=='Recruitment Name')?.[1]||'Untitled Vacancy')}</h1><div>${esc(v.find(f=>f[0]=='Organization / Authority')?.[1]||'')}</div></div>${sec('Job Information',v.slice(0,7))}${sec('Application & Age',v.slice(7,11))}${sec('Eligibility / Selection',v.slice(11))}${custom.length?sec('Custom Fields',custom):''}${tables.map(t=>`<div class="section"><h3>${esc(t.name)}</h3><div class="table-wrap"><table class="data-table"><thead><tr>${t.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('')}${links.length?`<div class="section"><h3>Important Links</h3>${links.map(l=>`<p><a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a></p>`).join('')}</div>`:''}`}</script></body></html>
