<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#070916"><title>ENGLISH VOCABULARY | ONESTOP</title><style>
:root{--bg:#070916;--panel:#11162f;--text:#f7f9ff;--muted:#aeb7d8;--cyan:#38e8ff;--blue:#5aa7ff;--pink:#ff4fd8;--gold:#ffd45a;--green:#43e37d;--red:#ff5573}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 8%,rgba(56,232,255,.15),transparent 28%),radial-gradient(circle at 88% 10%,rgba(255,79,216,.14),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(7,9,22,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}.topin{max-width:1200px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand span{color:var(--cyan)}.back{color:#fff;text-decoration:none;font-size:12px;font-weight:850;padding:8px 11px;border:1px solid rgba(255,255,255,.12);border-radius:9px}
.page{max-width:1150px;margin:auto;padding:24px 15px 55px}.hero{text-align:center}.tag{display:inline-block;color:#9af5ff;background:rgba(56,232,255,.08);border:1px solid rgba(56,232,255,.2);padding:7px 12px;border-radius:999px;font-size:10px;font-weight:950;letter-spacing:1px}.hero h1{font-size:clamp(32px,5vw,58px);margin:11px 0 6px;letter-spacing:-1.5px}.hero p{color:var(--muted);max-width:760px;margin:0 auto 20px}
.box{max-width:1000px;margin:auto;padding:1px;border-radius:24px;background:linear-gradient(135deg,rgba(56,232,255,.55),rgba(255,79,216,.5))}.panel{background:linear-gradient(180deg,#11162f,#090c20);border-radius:23px;overflow:hidden}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:11px;background:rgba(255,255,255,.035)}.h{background:rgba(255,255,255,.045);padding:9px;border-radius:11px;text-align:center}.h small{display:block;color:#8f99bc;font-size:9px;text-transform:uppercase;font-weight:900;letter-spacing:1px}.h b{font-size:20px}
.stage{min-height:550px;padding:28px;position:relative;background:#050713;touch-action:manipulation}.content{max-width:820px;margin:auto}.question{font-size:clamp(24px,4vw,40px);font-weight:950;text-align:center;margin:18px 0 22px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{padding:16px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:#151a36;color:#fff;font-weight:850;font-size:15px}.choice:hover{border-color:var(--cyan);transform:translateY(-1px)}.correct{background:rgba(67,227,125,.2)!important;border-color:var(--green)!important}.wrong{background:rgba(255,85,115,.18)!important;border-color:var(--red)!important}.primary{border:0;border-radius:12px;padding:13px 22px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04101e;font-weight:950}.center{text-align:center}.feedback{min-height:32px;text-align:center;font-weight:900;margin:14px}.hint{color:#8993b5;font-size:12px;text-align:center;margin-top:10px}.input{width:min(600px,100%);display:block;margin:15px auto;padding:15px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:#0c1028;color:#fff;text-align:center;font-size:20px;font-weight:800}
.credit{max-width:1000px;margin:16px auto 0;padding:10px 14px;display:flex;justify-content:flex-end;align-items:center;gap:10px;border:1px solid rgba(56,232,255,.13);border-radius:15px;background:rgba(255,255,255,.035)}.credit img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid rgba(56,232,255,.55)}.credit small{display:block;color:#8791b3;font-size:9px;text-transform:uppercase;font-weight:900}.credit strong{font-size:13px}
.info{max-width:1000px;margin:16px auto;padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.035);color:var(--muted);font-size:13px;line-height:1.6}.info b{color:#fff}
.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,5,15,.7);backdrop-filter:blur(6px)}.overlay.hide{display:none}.modal{width:min(480px,100%);text-align:center;padding:28px 22px;border-radius:20px;background:#121733;border:1px solid rgba(255,255,255,.12)}.modal .emoji{font-size:50px}.modal h2{font-size:32px;margin:7px}.modal p{color:var(--muted);line-height:1.55}
@media(max-width:650px){.topin{padding:10px 12px}.page{padding:18px 9px 40px}.stage{min-height:500px;padding:16px}.choices{grid-template-columns:1fr}.hud{gap:5px;padding:7px}.h{padding:7px 3px}.h b{font-size:16px}.h small{font-size:8px}.credit img{width:46px;height:46px}.credit strong{font-size:11px}}

/* ONESTOP MOBILE RESPONSIVE PATCH */
html{width:100%;max-width:100%;overflow-x:hidden}
body{width:100%;max-width:100%;overflow-x:hidden}
.top,.topin,.page,main{max-width:100%;width:100%}
.page{box-sizing:border-box}
.gamebox,.panel,.stage,canvas{max-width:100%;box-sizing:border-box}
.gamebox{width:100%;margin-left:auto;margin-right:auto}
.panel{width:100%}
.stage{width:100%;min-width:0}
img,video,canvas,svg{max-width:100%}
button,.primary{max-width:100%}
@media(max-width:650px){
  .topin{padding-left:10px;padding-right:10px;gap:8px}
  .brand{min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{flex:0 0 auto;font-size:11px;padding:8px 9px;white-space:nowrap}
  .page{padding:16px 10px 30px}
  h1{font-size:clamp(28px,9vw,42px);line-height:1.05;overflow-wrap:anywhere}
  .hero p{font-size:14px;line-height:1.45;max-width:100%}
  .gamebox{border-radius:18px}
  .panel{border-radius:17px}
  .hud{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:7px}
  .h{min-width:0;padding:7px 4px}
  .h b{font-size:17px}
  .h small{font-size:8px}
  .stage{height:min(62vh,520px);min-height:360px}
  .overlay{padding:12px}
  .modal{width:100%;max-width:calc(100vw - 44px);max-height:calc(100% - 24px);overflow:auto;padding:22px 16px;border-radius:17px}
  .modal .big{font-size:42px}
  .modal h2{font-size:28px;line-height:1.15}
  .modal p{font-size:14px;line-height:1.45}
  .primary{width:100%;padding:12px 14px;font-size:15px}
  .credit{margin-top:12px;padding:9px 10px;gap:8px;justify-content:center}
  .info{margin-top:12px;padding:13px;font-size:12px}
}
@media(max-width:430px){
  .topin{padding-left:8px;padding-right:8px}
  .brand{font-size:14px}
  .back{font-size:10px}
  .page{padding-left:8px;padding-right:8px}
  .tag{font-size:9px;letter-spacing:.5px;padding:6px 9px}
  .stage{min-height:340px;height:min(60vh,500px)}
  .modal{max-width:calc(100vw - 34px);padding:18px 13px}
  .modal h2{font-size:25px}
  .modal p{font-size:13px}
  .primary{font-size:14px}
}
@media(max-width:360px){
  .hud{gap:4px}
  .h b{font-size:15px}
  .stage{min-height:320px;height:58vh}
}


/* ONESTOP MOBILE GAME POLISH */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{min-width:0}
.top,.topin,.page,main{width:100%;max-width:100%;box-sizing:border-box}
.page{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));padding-bottom:max(30px,env(safe-area-inset-bottom))}
.gamebox,.box,.panel,.stage{width:100%;max-width:100%;box-sizing:border-box;min-width:0}
.gamebox,.box{margin-left:auto;margin-right:auto}
canvas{display:block;width:100%;max-width:100%;box-sizing:border-box}
img,video,svg{max-width:100%;height:auto}
.topin{gap:8px}
.brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{flex:0 0 auto;white-space:nowrap}

/* Developer credit is a top-of-game identity card */
.credit{position:relative;z-index:2;width:min(100%,1000px);max-width:1000px;margin:0 auto 14px;padding:9px 13px;display:flex;align-items:center;justify-content:flex-start;gap:11px;box-sizing:border-box;border:1px solid rgba(56,232,255,.25);border-radius:16px;background:linear-gradient(135deg,rgba(56,232,255,.10),rgba(255,79,216,.08) 55%,rgba(255,255,255,.035));box-shadow:0 8px 28px rgba(0,0,0,.22)}
.credit:before{content:'DEVELOPED & DESIGNED BY';align-self:stretch;display:flex;align-items:center;padding-right:11px;border-right:1px solid rgba(255,255,255,.10);color:#8e99bb;font-size:8px;font-weight:900;letter-spacing:1px;white-space:nowrap}
.credit img{width:42px;height:42px;flex:0 0 42px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid rgba(56,232,255,.65);box-shadow:0 0 0 3px rgba(56,232,255,.06)}
.credit div{min-width:0;text-align:left}
.credit small{display:block;margin:0 0 2px;color:#8290b4;font-size:8px;text-transform:uppercase;letter-spacing:.7px;font-weight:900}
.credit strong{display:block;color:#fff;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit{order:-1}

@media(max-width:650px){
  .topin{padding:9px 10px}
  .page{padding-top:12px;padding-left:8px;padding-right:8px}
  .credit{margin-bottom:12px;padding:8px 10px;gap:8px;border-radius:14px}
  .credit:before{font-size:7px;letter-spacing:.7px;padding-right:8px}
  .credit img{width:38px;height:38px;flex-basis:38px}
  .credit strong{font-size:12px}
  .credit small{font-size:7px}
  .hero h1{font-size:clamp(28px,9vw,40px);line-height:1.05;margin:8px 0 5px}
  .hero p{font-size:13px;line-height:1.4;margin-bottom:12px}
  .tag{font-size:9px;padding:6px 9px}
  .gamebox,.box{border-radius:18px}
  .panel{border-radius:17px}
  .hud{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:6px}
  .h{min-width:0;padding:7px 3px;border-radius:9px}
  .h b{font-size:16px}
  .h small{font-size:7px}
  .stage{height:min(62dvh,520px);height:min(62vh,520px);min-height:320px;padding:clamp(8px,3vw,16px)}
  .modal{width:100%;max-width:calc(100vw - 32px);max-height:calc(100% - 18px);overflow:auto;padding:18px 13px;border-radius:16px}
  .modal h2{font-size:24px;line-height:1.15}
  .modal p{font-size:13px;line-height:1.45}
  .modal .big,.modal .emoji{font-size:40px}
  .primary{width:100%;max-width:100%;padding:11px 12px;font-size:14px}
  .choices{grid-template-columns:1fr!important}
  .choice{font-size:14px;padding:13px}
  .input{width:100%;max-width:100%;font-size:17px;padding:12px}
  .content{width:100%;max-width:100%}
  .info{width:100%;max-width:100%;font-size:12px;padding:12px;margin-top:12px}
}
@media(max-width:430px){
  .topin{padding-left:7px;padding-right:7px}
  .back{font-size:9px;padding:7px 8px}
  .brand{font-size:13px}
  .page{padding-left:7px;padding-right:7px}
  .credit:before{display:none}
  .credit{justify-content:center}
  .credit img{width:36px;height:36px;flex-basis:36px}
  .credit strong{font-size:11px}
  .stage{height:min(60dvh,500px);height:min(60vh,500px);min-height:300px}
  .modal{max-width:calc(100vw - 28px);padding:16px 11px}
  .modal h2{font-size:22px}
  .modal p{font-size:12px}
  .primary{font-size:13px}
}
@media(max-width:360px){
  .credit{padding:7px 8px}
  .credit strong{font-size:10px}
  .hud{gap:4px;padding:5px}
  .h{padding:6px 2px}
  .h b{font-size:14px}
  .stage{height:56vh;min-height:285px}
  .modal{max-width:calc(100vw - 24px);padding:14px 9px}
}
</body></html>
