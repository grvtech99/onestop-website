id="c"></canvas></div><button class="primary" id="sound">🔊 Sound On</button><button id="reset">↻ Reset</button><script>const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,score=0,streak=0,time=60,on=true,pts=[],timer;function size(){W=c.clientWidth;H=c.clientHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}function beep(f=420,d=.08){if(!on)return;try{let A=window.AudioContext||webkitAudioContext;if(!window.a)window.a=new A;let o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.03;o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}c.onpointerdown=e=>{let r=c.getBoundingClientRect();pts.push({x:e.clientX-r.left,y:e.clientY-r.top,r:3,a:1});score++;streak++;s.textContent=score;k.textContent=streak;beep(400+Math.random()*300)};function draw(){x.fillStyle='#071014';x.fillRect(0,0,W,H);pts.forEach(p=>{p.r+=.7;p.a-=.01;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.strokeStyle='rgba(102,224,192,'+p.a+')';x.stroke()});pts=pts.filter(p=>p.a>0);requestAnimationFrame(draw)}sound.onclick=()=>{on=!on;sound.textContent=on?'🔊 Sound On':'🔇 Sound Off';ss.textContent=on?'ON':'OFF'};reset.onclick=()=>{score=streak=0;time=60;s.textContent=k.textContent=0;tm.textContent=60;pts=[];clearInterval(timer);timer=setInterval(()=>{if(time){tm.textContent=--time}else clearInterval(timer)},1000)};addEventListener('resize',size);size();reset.click();draw();</script></main></body></html>
