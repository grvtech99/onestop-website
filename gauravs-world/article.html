<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>लेख — Gaurav’s World</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="gwMenuPanel">☰</button>
  <a class="brand" href="index.html" aria-label="Gaurav’s World Home"><strong>Gaurav’s <span>World</span> 🌐</strong><small>DISCOVER · LEARN · EXPLORE · GROW</small></a>
  <button class="iconbtn" id="searchBtn" aria-label="Search" aria-expanded="false" aria-controls="searchWrap">⌕</button>
</header>
<nav id="gwMenuPanel" hidden aria-label="विस्तृत मेन्यू">
  <a href="index.html">सभी लेख</a>
  <a href="index.html?category=Technology">Technology</a>
  <a href="index.html?category=Science">Science</a>
  <a href="index.html?category=History">History</a>
  <a href="index.html?category=Universe">Universe</a>
  <a href="index.html?category=Mystery">Mystery</a>
  <a href="index.html?category=Nature">Nature</a>
  <a href="index.html?category=World">World</a>
  <a href="index.html?category=AI">AI</a>
  <a href="index.html?category=Trending">Trending</a>
  <a href="index.html?saved=1">Saved Articles</a>
</nav>
<div class="searchwrap" id="searchWrap"><input id="searchInput" placeholder="टॉपिक खोजें…" autocomplete="off" aria-label="टॉपिक खोजें"></div>
<main class="article-main" id="articleRoot"><p class="state">लेख लोड हो रहा है…</p></main>
<footer class="bottomnav" aria-label="मुख्य नेविगेशन">
  <a href="index.html"><span>⌂</span>Home</a>
  <a href="index.html?category=Technology"><span>💻</span>Technology</a>
  <a href="index.html?category=Science"><span>⚛</span>Science</a>
  <a href="index.html?category=History"><span>🏛</span>History</a>
  <button type="button" id="moreNavBtn" aria-label="More menu" aria-controls="gwMenuPanel" aria-expanded="false"><span>☰</span>More</button>
</footer>
<script>
(()=>{
 const menu=document.getElementById('gwMenuPanel');
 const menuBtn=document.getElementById('menuBtn');
 const more=document.getElementById('moreNavBtn');
 const searchBtn=document.getElementById('searchBtn');
 const searchWrap=document.getElementById('searchWrap');
 const input=document.getElementById('searchInput');
 const setMenu=(open)=>{menu.hidden=!open;menuBtn.setAttribute('aria-expanded',String(open));more.setAttribute('aria-expanded',String(open));};
 const toggle=()=>setMenu(menu.hidden);
 menuBtn.addEventListener('click',toggle);
 more.addEventListener('click',toggle);
 document.addEventListener('keydown',event=>{if(event.key==='Escape'){setMenu(false);searchWrap.classList.remove('open');searchBtn.setAttribute('aria-expanded','false');}});
 document.addEventListener('click',event=>{if(!menu.hidden&&!menu.contains(event.target)&&!menuBtn.contains(event.target)&&!more.contains(event.target))setMenu(false);});
 searchBtn.addEventListener('click',()=>{const open=searchWrap.classList.toggle('open');searchBtn.setAttribute('aria-expanded',String(open));if(open)input.focus();});
 input.addEventListener('keydown',event=>{if(event.key==='Enter'&&input.value.trim())window.location.href='index.html?q='+encodeURIComponent(input.value.trim());});
})();
</script>
<script src="assets/app.js"></script>
</body>
</html>
