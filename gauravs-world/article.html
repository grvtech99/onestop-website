<script>
const content={
'computer-basics':{title:'Computer सीखना कहाँ से शुरू करें?',category:'Computer Skills',date:'Beginner Guide',intro:'अगर आप computer सीखना शुरू कर रहे हैं, तो छोटे और नियमित अभ्यास से शुरुआत करें। पहले बुनियादी कामों में सहज बनें, फिर धीरे-धीरे नए tools सीखें।',sections:[['1. Computer के हिस्से पहचानें','Monitor, keyboard, mouse और system unit का काम समझें। Laptop में इन्हीं के कई हिस्से एक ही device में होते हैं।'],['2. रोज़मर्रा के जरूरी काम','Computer को सही तरीके से चालू और बंद करना, apps खोलना, typing करना और files को save करना सीखें।'],['3. Files और folders व्यवस्थित करें','Documents, photos और downloads के लिए अलग folders बनाएँ। Files के नाम ऐसे रखें कि बाद में आसानी से मिल सकें।'],['4. Internet safety भी सीखें','मजबूत password रखें, OTP किसी से साझा न करें और अनजान links या attachments खोलने से पहले जाँचें।'],['5. रोज़ 20 मिनट अभ्यास','Typing, document बनाना और file save करना दोहराएँ। हर सप्ताह एक छोटा practical task पूरा करें।']]},
'online-safety':{title:'Online काम करते समय अपनी सुरक्षा कैसे रखें',category:'Digital Services',date:'Safety Guide',intro:'Online services का उपयोग करते समय आपकी personal information और account की सुरक्षा जरूरी है। कुछ सरल आदतें जोखिम कम कर सकती हैं।',sections:[['OTP और password निजी रखें','OTP, PIN या password किसी व्यक्ति के साथ साझा न करें—भले ही वह support या अधिकारी होने का दावा करे।'],['संदिग्ध links से सावधान रहें','अनजान message में आए link पर तुरंत click न करें। Website का पता ध्यान से देखें और जरूरी service को official site/app से खोलें।'],['मजबूत और अलग password','अलग-अलग accounts के लिए अलग password रखें। जहाँ उपलब्ध हो, two-step verification चालू करें।'],['Public device पर logout करें','काम पूरा होने पर logout करें और browser में password save करने से बचें।'],['शक होने पर तुरंत कार्रवाई','यदि account compromise होने का संदेह हो, तो official channel से password बदलें और संबंधित provider से संपर्क करें.']]},
'ai-tools':{title:'AI tools का पढ़ाई और काम में उपयोग',category:'Technology',date:'Practical Guide',intro:'AI tools ideas, explanations और drafts बनाने में मदद कर सकते हैं। इनके उत्तरों को अंतिम सत्य मानने के बजाय जाँचकर उपयोग करें।',sections:[['पढ़ाई में मदद','किसी कठिन विषय को सरल भाषा में समझाने, अभ्यास प्रश्न बनाने या अध्ययन योजना तैयार करने को कहें।'],['काम में productivity','Email का draft, checklist, outline या spreadsheet formula का शुरुआती सुझाव तैयार करवाएँ।'],['सही prompt लिखें','काम, संदर्भ, भाषा और अपेक्षित format स्पष्ट लिखें। संवेदनशील personal या business data साझा न करें।'],['उत्तर verify करें','तारीखें, गणना, कानूनी/चिकित्सकीय जानकारी और महत्वपूर्ण तथ्य विश्वसनीय स्रोतों से जाँचें।'],['अपना निर्णय बनाए रखें','AI को सहायक की तरह इस्तेमाल करें; महत्वपूर्ण निर्णय से पहले स्वयं समीक्षा करें।']]},
'digital-skills':{title:'Digital skills क्यों जरूरी हैं?',category:'Education',date:'Learning Guide',intro:'Digital skills पढ़ाई, काम और रोजमर्रा की सेवाओं में उपयोगी हैं। शुरुआत बुनियादी digital literacy से करें और फिर अपनी जरूरत के अनुसार आगे बढ़ें।',sections:[['बुनियादी डिजिटल साक्षरता','Typing, files, email, browser और online forms का उपयोग सीखें।'],['सुरक्षित online व्यवहार','Privacy settings, passwords, OTP safety और misinformation पहचानने की आदत विकसित करें।'],['काम के अनुसार कौशल चुनें','Office tools, accounting software, design, data entry या hardware/networking में से रुचि और लक्ष्य के अनुसार अभ्यास करें।'],['Portfolio बनाएं','अपने बनाए documents, designs या projects के नमूने व्यवस्थित रखें—लेकिन निजी जानकारी सार्वजनिक न करें।'],['निरंतर अभ्यास','छोटे projects बनाकर सीखें और जरूरत के अनुसार नए tools सीखते रहें।']]},
'pdf-mobile':{title:'मोबाइल से PDF और documents व्यवस्थित करें',category:'Digital Services',date:'How-to',intro:'मोबाइल में documents को व्यवस्थित रखने से जरूरी फाइलें जल्दी मिलती हैं और साझा करते समय गलती कम होती है।',sections:[['Folders बनाएँ','Study, Work, Bills या Personal जैसे folders बनाएँ। संवेदनशील documents को सुरक्षित जगह रखें।'],['स्पष्ट file names रखें','उदाहरण: Resume_2026 या FeeReceipt_August। नाम में जरूरत से ज्यादा personal details न जोड़ें।'],['PDF जाँचें','Share करने से पहले पेज क्रम, readability और सही document होने की पुष्टि करें।'],['Backup रखें','महत्वपूर्ण files का सुरक्षित backup रखें। Public/shared device पर copies छोड़ने से बचें।'],['Share करने से पहले सोचें','Recipient और permissions जाँचें। Aadhaar, PAN या अन्य निजी दस्तावेज केवल जरूरत होने पर भरोसेमंद माध्यम से भेजें।']]},
'typing-practice':{title:'Typing speed बेहतर करने के आसान अभ्यास',category:'Computer Skills',date:'Practice Guide',intro:'Typing में speed के साथ accuracy भी जरूरी है। सही posture और नियमित अभ्यास से धीरे-धीरे सुधार हो सकता है।',sections:[['सही posture','सीधे बैठें, shoulders relaxed रखें और keyboard तक आराम से पहुँचें।'],['Accuracy से शुरुआत','पहले सही अक्षर और कम गलतियाँ करने पर ध्यान दें। Speed अपने आप अभ्यास के साथ बढ़ सकती है।'],['छोटे daily sessions','रोज 10–20 मिनट अभ्यास करें। बीच में छोटा break लें।'],['Progress नोट करें','हर सप्ताह speed और accuracy दोनों देखें; केवल speed पर ध्यान न दें।'],['वास्तविक सामग्री टाइप करें','छोटे paragraphs, emails और सामान्य documents टाइप करके अभ्यास को उपयोगी बनाएं।']]}
};
const slug=new URLSearchParams(location.search).get('id')||'computer-basics';const a=content[slug];const el=document.getElementById('article');document.getElementById('year').textContent=new Date().getFullYear();
if(!a){el.innerHTML='<h1>लेख नहीं मिला</h1><p>यह लेख उपलब्ध नहीं है। कृपया सभी लेखों पर वापस जाएँ।</p>';}else{document.title=a.title+' | Gaurav’s World';el.innerHTML=`<span class="tag">${a.category}</span><h1>${a.title}</h1><div class="date">${a.date} · Gaurav's World</div><p class="notice">${a.intro}</p>${a.sections.map(s=>`<section><h2>${s[0]}</h2><p>${s[1]}</p></section>`).join('')}<p class="notice"><strong>Takeaway:</strong> छोटे कदमों से शुरुआत करें, नियमित अभ्यास करें और महत्वपूर्ण जानकारी की पुष्टि जरूर करें।</p>`;}
</script></body></html>
