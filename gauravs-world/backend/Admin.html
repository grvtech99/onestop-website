<!doctype html>
<html lang="hi"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaurav's World — Secure Admin</title><style>:root{font-family:Inter,system-ui,Arial;color:#152033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#0876d1;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1180px;margin:20px auto;padding:0 14px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.card{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:18px;box-shadow:0 8px 30px #15304a10;margin-bottom:18px}h1,h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700;font-size:14px;margin-bottom:5px;display:block}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd7e2;border-radius:9px;font:inherit}textarea{min-height:150px;resize:vertical}.full{grid-column:1/-1}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer;background:#0876d1;color:#fff}button.secondary{background:#e9f1f8;color:#16466b}button.danger{background:#b42318}.status{padding:10px;border-radius:9px;background:#f6f8fb;min-height:38px;margin-top:12px}.list{max-height:600px;overflow:auto}.item{padding:12px;border-bottom:1px solid #e8edf2;cursor:pointer}.item:hover{background:#f7faff}.preview{background:#f8fafc;border:1px solid #e2e8f0;padding:15px;border-radius:10px;overflow-wrap:anywhere}.preview img{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:10px;margin:0 0 16px;background:#e9eef4}.preview-title{font-size:1.5rem;font-weight:800;margin:0 0 10px}.preview-meta{color:#526174;font-size:.9rem;margin-bottom:12px}.preview-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.dangerzone{border:1px solid #f0c2c2;background:#fff8f8}@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}.top{padding:14px}.wrap{margin:10px auto}}</style></head><body><header class="top"><strong>Gaurav’s World — Secure Admin</strong><span id="who">Checking account…</span></header><main class="wrap"><div class="grid"><section><div class="card"><h1>Article Editor</h1><div class="fields"><div><label>Title / शीर्षक</label><input id="title" maxlength="160"></div><div><label>Slug</label><input id="slug" maxlength="100" pattern="[a-z0-9]+(?:-[a-z0-9]+)*"></div><div><label>Category</label><select id="category"><option>Technology</option><option>Science</option><option>History</option><option>Universe</option><option>World Secret</option><option>Trending</option><option>Computer Skills</option><option>Education</option></select></div><div><label>Author</label><input id="author" value="Gaurav"></div><div class="full"><label>Summary / सारांश</label><textarea id="summary" maxlength="1500"></textarea></div><div class="full"><label>Article Body — Markdown</label><textarea id="body" style="min-height:340px"></textarea></div><div class="full"><label>Tags — comma separated</label><input id="tags"></div><div class="full"><label>Cover Image — Manual Upload only</label><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"><small>Max 2 MB. PNG/JPG/WEBP. Upload goes to GitHub images/.</small><div id="imagePath" data-path=""></div></div></div><div class="row"><button onclick="saveDraft()">Save Draft</button><button onclick="publish()">Publish</button><button class="secondary" onclick="previewArticle()">Preview</button><button class="secondary" onclick="newArticle()">New</button></div><div id="status" class="status">Ready.</div></div><div class="card"><h2>Preview</h2><div id="preview" class="preview">Nothing to preview.</div></div></section><aside><div class="card"><h2>Published Articles</h2><button class="secondary" onclick="loadArticles()">Refresh</button><div id="list" class="list">Loading…</div></div><div class="card dangerzone"><h2>Article Actions</h2><p>Select an article from the list.</p><div class="row"><button class="danger" onclick="unpublish()">Unpublish</button><button class="danger" onclick="deleteDraft()">Delete Draft</button></div></div><div class="card"><h2>Admin Status</h2><div id="health">Checking…</div></div></aside></div></main><script>
const $=id=>document.getElementById(id);let selected=null;function msg(t,ok=true){$('status').textContent=t;$('status').style.background=ok?'#f1f8f3':'#fff1f1'}function call(fn,arg,done){google.script.run.withSuccessHandler(done).withFailureHandler(e=>msg((e&&e.message)||'Request failed',false))[fn](arg)}function article(){return{slug:$('slug').value.trim(),title:$('title').value.trim(),category:$('category').value,summary:$('summary').value.trim(),bodyMarkdown:$('body').value.trim(),author:$('author').value.trim()||'Gaurav',tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),image:$('imagePath').dataset.path||''}}function valid(a){return /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(a.slug)&&a.title&&a.bodyMarkdown}function saveDraft(){const a=article();if(!valid(a))return msg('Title, slug और article body सही भरें।',false);call('saveDraft',a,r=>{msg('Draft saved. Commit: '+r.commit);loadArticles()})}function publish(){const a=article();if(!valid(a))return msg('Publish से पहले title, slug और body भरें।',false);if(!confirm('Publish this article to the live blog?'))return;call('publishArticle',a,r=>{msg('Published successfully. '+r.url);loadArticles()})}
function imageUrl(path){if(!path)return'';if(/^https:\/\//i.test(path))return path;const clean=String(path).replace(/^\/+/, '').replace(/^\.\//,'');return new URL(clean,location.href).href}
function previewArticle(){const a=article();if(!valid(a))return msg('Preview के लिए title, slug और body भरें।',false);const box=$('preview');box.replaceChildren();if(a.image){const img=document.createElement('img');img.alt=a.title+' cover image';img.src=imageUrl(a.image);img.onerror=()=>{img.remove();msg('Preview image load नहीं हुई: '+a.image,false)};box.appendChild(img)}const title=document.createElement('h3');title.className='preview-title';title.textContent=a.title;box.appendChild(title);const meta=document.createElement('div');meta.className='preview-meta';meta.textContent=a.category+' · '+a.author;box.appendChild(meta);if(a.summary){const summary=document.createElement('p');summary.textContent=a.summary;box.appendChild(summary)}const body=document.createElement('div');body.className='preview-body';body.textContent=a.bodyMarkdown;box.appendChild(body);msg(a.image?'Preview updated with cover image.':'Preview updated (no cover image selected).')}
function loadArticles(){call('listArticles',null,r=>{const arr=r.articles||[];$('list').innerHTML=arr.length?arr.map(x=>`<div class="item" onclick="selectArticle('${String(x.slug).replace(/'/g,"\\'")}')"><b>${esc(x.title||x.slug)}</b><br><small>${esc(x.category||'')} · ${esc(x.updatedAt||'')}</small></div>`).join(''):'No published articles.'})}function selectArticle(slug){call('getArticle',slug,r=>{const a=r.article;$('title').value=a.title||'';$('slug').value=a.slug||slug;$('category').value=a.category||'Technology';$('summary').value=a.summary||'';$('body').value=a.bodyMarkdown||a.body||'';$('author').value=a.author||'Gaurav';$('tags').value=(a.tags||[]).join(', ');$('imagePath').dataset.path=a.image||'';$('imagePath').textContent=a.image?'Current: '+a.image:'';selected=slug;msg('Article loaded.');previewArticle()})}function unpublish(){if(!selected)return msg('पहले article select करें।',false);if(!confirm('Unpublish this article?'))return;call('unpublishArticle',selected,r=>{msg('Article unpublished.');selected=null;loadArticles()})}function deleteDraft(){if(!selected)return msg('पहले article select करें।',false);if(!confirm('Delete this draft?'))return;call('deleteDraft',selected,r=>{msg('Draft deleted.');selected=null})}function newArticle(){['title','slug','summary','body','tags'].forEach(id=>$(id).value='');$('imagePath').textContent='';$('imagePath').dataset.path='';$('imageFile').value='';$('preview').textContent='Nothing to preview.';selected=null;msg('New article ready.')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('imageFile').addEventListener('change',()=>{const f=$('imageFile').files[0];if(!f)return;if(f.size>2*1024*1024)return msg('Image 2 MB से बड़ी है।',false);const reader=new FileReader();reader.onload=()=>{const b64=reader.result.split(',')[1];call('uploadImage',{name:f.name,mime:f.type,base64:b64},r=>{$('imagePath').dataset.path=r.path;$('imagePath').textContent='Uploaded: '+r.path;msg('Cover image uploaded.');previewArticleIfReady()})};reader.readAsDataURL(f)});function previewArticleIfReady(){const a=article();if(valid(a))previewArticle()}call('health',null,r=>{$('who').textContent=r.admin||'Admin';$('health').textContent='Authenticated · GitHub '+(r.githubConfigured?'OK':'NOT CONFIGURED')+' · OpenAI '+(r.openaiConfigured?'configured':'optional')});loadArticles();
</script></body></html>
