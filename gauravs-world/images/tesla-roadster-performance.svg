xt><text x="28" y="135" fill="#fff" font-family="Arial,sans-serif" font-size="49" font-weight="700">480+</text><text x="28" y="180" fill="#d0deea" font-family="Arial,sans-serif" font-size="22">km reported</text><text x="28" y="220" fill="#d0deea" font-family="Arial,sans-serif" font-size="18">Over 300 miles</text><path d="M28 260 H285" stroke="#ff626b" stroke-width="5"/></g><text x="60" y="565" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Important: these are reported company claims, not independent test results.</text><text x="60" y="607" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="19">Final production specifications may change.</text></svg>