<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0876d1"><title>Static Article Generator | Gaurav's World</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.bar{background:#0876d1;color:white;padding:15px 20px}.bar a{color:white}.wrap{max-width:900px;margin:24px auto;padding:0 14px}.panel{background:white;border:1px solid #e1e8f0;border-radius:16px;padding:20px}textarea,input{width:100%;font:inherit;border:1px solid #ccd7e3;border-radius:9px;padding:11px;margin:6px 0 14px}textarea{min-height:250px}button{border:0;border-radius:9px;padding:12px 16px;background:#0876d1;color:white;font:inherit;font-weight:700;cursor:pointer}.muted{color:#5c6b7c}.status{min-height:24px}@media(max-width:600px){.panel{padding:14px}}
</style></head><body><header class="bar"><a href="./">← Admin Draft Studio</a><strong style="float:right">Static HTML Generator</strong></header><main class="wrap"><section class="panel"><h1>Approved Draft → Static HTML</h1><p class="muted">यह standalone utility है। इसमें approved draft का JSON paste करें या JSON file चुनें। यह पूरा article HTML में embed करके डाउनलोड करेगा—पाठक के browser को article JSON fetch नहीं करना होगा। यह पेज अपने-आप publish नहीं करता।</p><label for="jsonFile"><b>JSON draft file</b></label><input id="jsonFile" type="file" accept="application/json,.json"><label for="json"><b>या JSON यहाँ paste करें</b></label><textarea id="json" placeholder='{"id":"example-article","title":"लेख का शीर्षक","category":"Technology","summary":"संक्षिप्त परिचय","image":"images/example.webp","body":"पूरा लेख यहाँ…","status":"approved"}'></textarea><button id="generate">Generate & Download HTML</button><p class="status" id="status" role="status" aria-live="polite"></p></section></main><script>
'use strict';
const $=id=>document.getElementById(id),slugOK=s=>typeof s==='string'&&/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(s);
$('jsonFile').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{$('json').value=await f.text();$('status').textContent='JSON file loaded. Draft status and fields will be checked on generation.'}catch{$('status').textContent='File पढ़ नहीं पाए। JSON paste करके कोशिश करें।'}});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inline(s){return esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
function markdown(source){const out=[];let ul=false;const close=()=>{if(ul){out.push('</ul>');ul=false}};for(const line of String(source||'').replace(/\r/g,'').split('\n')){const t=line.trim();if(!t){close();continue}const h=/^(#{1,3})\s+(.+)$/.exec(t),li=/^[-*]\s+(.+)$/.exec(t);if(h){close();const n=h[1].length;out.push(`<h${n}>${inline(h[2])}</h${n}>`)}else if(li){if(!ul){out.push('<ul>');ul=true}out.push(`<li>${inline(li[1])}</li>`)}else{close();out.push(`<p>${inline(t)}</p>`)}}close();return out.join('')}
function safeImage(value){const p=String(value||'').trim();return /^images\/[A-Za-z0-9][A-Za-z0-9._/-]*\.webp$/i.test(p)&&!p.includes('..')?'../'+p:''}
$('generate').addEventListener('click',()=>{let a;try{a=JSON.parse($('json').value)}catch{$('status').textContent='Valid JSON paste करें।';return}const id=String(a.id||'').trim(),title=String(a.title||'').trim(),body=a.bodyMarkdown||a.body||a.content||'';if(!slugOK(id)||!title||!String(body).trim()){$('status').textContent='Valid id (lowercase slug), title और full body आवश्यक हैं।';return}if(String(a.status||'').toLowerCase()!=='approved'){$('status').textContent='Safety check: status approved होना चाहिए। Draft को पहले approve करें।';return}const image=safeImage(a.image||a.coverImage),description=String(a.summary||'').slice(0,300),cover=image?`<figure class="cover"><img src="${esc(image)}" alt="${esc(title)}" loading="eager" fetchpriority="high" decoding="async"></figure>`:'';const html=`<!doctype html>\n<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0876d1"><meta name="description" content="${esc(description)}"><title>${esc(title)} | Gaurav's World</title><style>:root{--brand:#0876d1;--ink:#172033;--muted:#64748b;--line:#e5eaf1;--bg:#f6f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{color:var(--brand);text-decoration:none}.top{background:var(--brand);color:white;padding:14px 18px}.topin{max-width:900px;margin:auto;display:flex;justify-content:space-between;gap:12px}.top a{color:white}.wrap{max-width:820px;margin:26px auto;padding:0 16px}.paper{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(16px,5vw,46px);overflow-wrap:anywhere}.tag{display:inline-block;background:#eaf4ff;color:var(--brand);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:750}.date{color:var(--muted);font-size:.9rem}h1{font-size:clamp(1.65rem,5.5vw,2.7rem);line-height:1.2;margin:16px 0}h2{font-size:clamp(1.25rem,4vw,1.7rem);margin-top:28px}.paper p,.paper li{color:#344256}.notice{background:#f0f7ff;border-left:4px solid var(--brand);padding:12px 16px;border-radius:8px}.cover{margin:18px 0 22px;text-align:center}.cover img{display:block;width:auto;max-width:100%;height:auto;max-height:clamp(240px,68vh,680px);object-fit:contain;margin:auto;border-radius:12px}.body{overflow-wrap:anywhere}.body img,.body video,.body iframe{max-width:100%}footer{text-align:center;color:var(--muted);padding:24px;font-size:.85rem}@media(max-width:560px){body{font-size:16px}.wrap{margin:14px auto;padding:0 10px}.paper{padding:18px 15px;border-radius:14px}.cover img{max-height:58vh}}</style></head><body><header class="top"><div class="topin"><a href="../">Gaurav's World</a><a href="./">← सभी लेख</a></div></header><main class="wrap"><article class="paper"><span class="tag">${esc(a.category||'General')}</span><h1>${esc(title)}</h1>${cover}<p class="date">${esc(a.updatedAt||a.date||'Published')}</p>${description?`<p class="notice">${esc(description)}</p>`:''}<div class="body">${markdown(body)}</div></article><a href="./">← Gaurav's World पर वापस जाएँ</a></main><footer>© ${new Date().getFullYear()} Gaurav's World · ONESTOP</footer></body></html>`;const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=id+'.html';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='Static HTML download तैयार है। इसे प्रकाशित करने के लिए approved HTML को site के article path में deploy करना होगा।'});
</script></body></html>
