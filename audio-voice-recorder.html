<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Recorder - ONESTOP</title><style>body{margin:0;padding:20px;font-family:system-ui;background:#070916;color:#fff}.box{max-width:650px;margin:auto;background:#11162f;padding:24px;border-radius:20px;text-align:center}button{padding:14px 22px;margin:6px;border:0;border-radius:12px;font-weight:800;cursor:pointer;background:#16d9ff}.stop{background:#ff6b6b}.timer{font-size:42px;font-variant-numeric:tabular-nums;margin:20px}.msg{min-height:28px;color:#9fe9ff}audio{width:100%;margin-top:15px}a{display:block;margin-top:15px;color:#16d9ff}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><main class="box"><h1>🎙️ Voice Recorder</h1><p>Record your voice directly in your browser. Your recording stays on your device.</p><div id="timer" class="timer">00:00</div><button id="start">● Start Recording</button><button id="stop" class="stop" disabled>■ Stop</button><div id="msg" class="msg"></div><audio id="audio" controls></audio><a id="download" hidden>⬇️ Download recording</a></main><script>let rec,chunks=[],started=0,tick;const st=document.getElementById('start'),sp=document.getElementById('stop'),au=document.getElementById('audio'),dl=document.getElementById('download'),msg=document.getElementById('msg'),tm=document.getElementById('timer');st.onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const types=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/webm'];const type=types.find(x=>MediaRecorder.isTypeSupported(x));rec=new MediaRecorder(stream,type?{mimeType:type}:undefined);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const url=URL.createObjectURL(blob);au.src=url;dl.href=url;dl.download='onestop-voice-recording.'+(blob.type.includes('ogg')?'ogg':'webm');dl.hidden=false;msg.textContent='Recording ready.'};rec.start();started=Date.now();tick=setInterval(()=>{const sec=Math.floor((Date.now()-started)/1000);tm.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},250);st.disabled=true;sp.disabled=false;msg.textContent='Recording…'}catch(e){msg.textContent='Microphone access failed. Allow microphone permission and use HTTPS.'}};sp.onclick=()=>{if(rec&&rec.state!=='inactive'){rec.stop();clearInterval(tick);st.disabled=false;sp.disabled=true;msg.textContent='Processing…'}}</script></body></html>
