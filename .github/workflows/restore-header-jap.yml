name: Restore header Jap button
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore header-only Jap link
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          nav='  <a href="non-stop-jap.html" class="admin-nav jap-nav" title="नॉन स्टॉप जाप">🙏 नॉन स्टॉप जाप</a>\n'
          marker='  <a href="#home">Home</a><a href="#about">About</a><a href="#courses">Courses</a><a href="#learning">Learning</a><a href="#notices">Notices</a><a href="#gallery">Gallery</a><a href="#contact">Contact</a>\n'
          if 'class="admin-nav jap-nav"' not in s:
              s=s.replace(marker, marker+nav, 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/restore-header-jap.yml
          git commit -m 'Restore Jap button in header only' || exit 0
          git rm .github/workflows/restore-header-jap.yml
          git commit -m 'Remove temporary header Jap workflow'
          git push
