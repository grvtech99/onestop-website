name: Build Smit Machchhar Hero WebP

on:
  push:
    paths:
      - 'gauravs-world/data/articles/indian-pilot-smit-machchhar-flydubai-heroism.json'
      - '.github/workflows/build-smit-machchhar-hero.yml'

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build branded WebP hero
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from urllib.request import urlopen
          from io import BytesIO
          import os

          url = "https://upload.wikimedia.org/wikipedia/commons/e/e5/TLV-FlyDubai_Boeing_737_MAX8_A6-FMH.jpg"
          raw = urlopen(url, timeout=30).read()
          img = Image.open(BytesIO(raw)).convert("RGB")
          img.thumbnail((1280, 720), Image.Resampling.LANCZOS)

          canvas = Image.new("RGB", (1280, 720), "white")
          x = (1280 - img.width) // 2
          y = (720 - img.height) // 2
          canvas.paste(img, (x, y))

          draw = ImageDraw.Draw(canvas, "RGBA")
          draw.rectangle((0, 0, 1280, 720), fill=(5, 22, 55, 65))
          draw.rectangle((0, 0, 1280, 155), fill=(5, 22, 55, 225))
          draw.rectangle((0, 155, 1280, 210), fill=(0, 132, 255, 225))

          font_paths = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          ]
          font = next((p for p in font_paths if os.path.exists(p)), None)
          if font:
              f1 = ImageFont.truetype(font, 48)
              f2 = ImageFont.truetype(font, 34)
              f3 = ImageFont.truetype(font, 25)
          else:
              f1 = f2 = f3 = ImageFont.load_default()

          draw.text((48, 28), "Gaurav's World", font=f2, fill="white")
          draw.text((48, 84), "भारतीय पायलट Smit Machchhar की बहादुरी", font=f1, fill="white")
          draw.text((48, 169), "Courage • Presence of Mind • Duty", font=f2, fill="white")

          draw.rounded_rectangle((44, 595, 1236, 680), radius=18, fill=(5, 22, 55, 225))
          draw.text((68, 617), "एक कठिन घड़ी में दूसरों की सुरक्षा को प्राथमिकता देने वाले Captain को सलाम", font=f3, fill="white")
          draw.text((980, 687), "Representative aircraft photo • Wikimedia Commons", font=f3, fill="white", anchor="rs")

          out = "gauravs-world/images/smit-machchhar-hero.webp"
          os.makedirs(os.path.dirname(out), exist_ok=True)
          canvas.save(out, "WEBP", quality=84, method=6)
          PY

      - name: Commit hero
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gauravs-world/images/smit-machchhar-hero.webp
          git diff --cached --quiet || git commit -m "Add Smit Machchhar hero WebP"
          git push
