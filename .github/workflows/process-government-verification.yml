name: Process Verified Government Update

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  verify:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, 'VERIFIED') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ONESTOP
        uses: actions/checkout@v4

      - name: Build verified draft
        env:
          VERIFICATION_COMMENT: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 scripts/process-government-verification.py

      - name: Commit verified draft
        run: |
          set -euo pipefail
          if git diff --quiet -- data/government-verified-drafts; then
            echo 'No verified draft created.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/government-verified-drafts
          git commit -m 'Add verified government update draft'
          git push

      - name: Confirm verification
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **VERIFIED draft created.** The structured update has been saved for final publication review. Nothing has been auto-published to the public Job Update page.'
            });
