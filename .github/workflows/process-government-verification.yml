name: Process Verified Government Update

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  verify:
    if: >-
      github.event.issue.pull_request == null &&
      (contains(github.event.comment.body, 'VERIFIED') || contains(github.event.comment.body, 'REJECTED')) &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ONESTOP
        uses: actions/checkout@v4

      - name: Process review decision
        env:
          VERIFICATION_COMMENT: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: python3 scripts/process-government-verification.py

      - name: Maintain verified draft index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          root='data/government-verified-drafts'
          os.makedirs(root, exist_ok=True)
          items=[]
          for name in sorted(os.listdir(root)):
              if not name.endswith('.json') or name == 'index.json':
                  continue
              path=os.path.join(root,name)
              try:
                  with open(path,encoding='utf-8') as f: d=json.load(f)
              except Exception:
                  continue
              items.append({
                  'path': path.replace('\\','/'),
                  'title': d.get('title',''),
                  'category': d.get('category',''),
                  'meta': d.get('meta',''),
                  'dates': d.get('dates',''),
                  'verifiedAt': d.get('verifiedAt',''),
                  'verificationIssue': d.get('verificationIssue','')
              })
          items.sort(key=lambda x:x.get('verifiedAt',''), reverse=True)
          index={'updatedAt':datetime.now(timezone.utc).isoformat(),'items':items[:100]}
          with open(os.path.join(root,'index.json'),'w',encoding='utf-8') as f:
              json.dump(index,f,indent=2,ensure_ascii=False); f.write('\n')
          PY

      - name: Commit review status and drafts
        run: |
          set -euo pipefail
          if git diff --quiet -- data/government-verified-drafts data/government-update-review-queue.json; then
            echo 'No review state changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/government-verified-drafts data/government-update-review-queue.json
          git commit -m 'Update government review status'
          git push

      - name: Confirm review decision
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          script: |
            const body = process.env.COMMENT_BODY || '';
            const isRejected = /\bREJECTED\b/i.test(body);
            const message = isRejected
              ? '❌ **Review marked REJECTED.** The queue status was updated and nothing was published to the public Job Update page.'
              : '✅ **VERIFIED draft created.** The queue status and structured draft were saved for final publication review. Nothing was auto-published to the public Job Update page.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
