name: Process Verified Government Update

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  verify:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, 'VERIFIED') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ONESTOP
        uses: actions/checkout@v4

      - name: Build verified draft
        env:
          VERIFICATION_COMMENT: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 scripts/process-government-verification.py

      - name: Maintain verified draft index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          root='data/government-verified-drafts'
          os.makedirs(root, exist_ok=True)
          items=[]
          for name in sorted(os.listdir(root)):
              if not name.endswith('.json') or name == 'index.json':
                  continue
              path=os.path.join(root,name)
              try:
                  with open(path,encoding='utf-8') as f: d=json.load(f)
              except Exception:
                  continue
              items.append({
                  'path': path.replace('\\','/'),
                  'title': d.get('title',''),
                  'category': d.get('category',''),
                  'meta': d.get('meta',''),
                  'dates': d.get('dates',''),
                  'verifiedAt': d.get('verifiedAt',''),
                  'verificationIssue': d.get('verificationIssue','')
              })
          items.sort(key=lambda x:x.get('verifiedAt',''), reverse=True)
          index={'updatedAt':datetime.now(timezone.utc).isoformat(),'items':items[:100]}
          with open(os.path.join(root,'index.json'),'w',encoding='utf-8') as f:
              json.dump(index,f,indent=2,ensure_ascii=False); f.write('\n')
          PY

      - name: Commit verified draft and index
        run: |
          set -euo pipefail
          if git diff --quiet -- data/government-verified-drafts; then
            echo 'No verified draft changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/government-verified-drafts
          git commit -m 'Add verified government update draft'
          git push

      - name: Confirm verification
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **VERIFIED draft created.** The structured update and Verified Draft index have been saved for final publication review. Nothing has been auto-published to the public Job Update page.'
            });
