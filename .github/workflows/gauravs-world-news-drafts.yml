name: Gaurav's World — News Draft Candidates

on:
  # Manual-only candidate collection; no AI image generation or draft API call.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauravs-world-news-drafts
  cancel-in-progress: false

jobs:
  draft-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out automation branch
        uses: actions/checkout@v4
        with:
          ref: gauravs-world-automation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test candidate validation
        run: python -m unittest discover -s automation/gauravs-world/tests -v

      - name: Collect source-linked RSS candidates
        run: python automation/gauravs-world/scripts/rss_digest.py

      - name: Validate candidates
        run: python automation/gauravs-world/scripts/validate_candidates.py

      - name: Build human-readable editorial review packet
        run: python automation/gauravs-world/scripts/build_review_packet.py

      - name: Upload review-only candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: gauravs-world-draft-candidates-${{ github.run_number }}
          path: automation/gauravs-world/output/
          if-no-files-found: error
          retention-days: 14
