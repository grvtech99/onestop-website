name: Validate ONESTOP Government Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/government-*.json'
      - 'data/government-verified-drafts/**'
      - 'data/government-ingestion-drafts/**'
      - 'data/government-publication-review/**'
      - '.github/workflows/**government**.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'data/government-*.json'
      - 'data/government-verified-drafts/**'
      - 'data/government-ingestion-drafts/**'
      - 'data/government-publication-review/**'
      - '.github/workflows/**government**.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ONESTOP
        uses: actions/checkout@v4

      - name: 1. Validate government pipeline syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.py; do
            python3 -m py_compile "$file"
          done
          echo "Python syntax: OK"

      - name: 2. Safety smoke check — extraction stays draft-only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/onestop-job-sample.txt <<'EOF'
          Recruitment Advertisement 2026. Total Vacancy: 125 posts. Application Start Date: 10/09/2026. Last Date: 25/10/2026. Application Fee: ₹500. Age Limit: 18 to 32 years. Educational Qualification: Diploma or Degree in Engineering. Selection Process: Computer Based Test and Interview.
          EOF
          python3 scripts/extract-government-job-draft.py https://example.gov.in/notice.pdf /tmp/onestop-job-sample.txt --title 'Example Government Junior Engineer Recruitment 2026' > /tmp/onestop-draft.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/onestop-draft.json').read_text(encoding='utf-8'))
          assert d.get('reviewStatus') == 'draft', 'Extractor must produce draft status'
          assert d.get('verificationRequired') is True, 'Verification must remain required'
          assert d.get('category') == 'jobs', 'Expected jobs classification'
          assert d.get('vacancy') == '125', 'Vacancy extraction failed'
          assert d.get('lastDate') == '25/10/2026', 'Last-date extraction failed'
          assert '500' in d.get('fee',''), 'Fee extraction failed'
          assert '18 to 32' in d.get('age',''), 'Age extraction failed'
          assert 'Diploma or Degree' in d.get('eligibility',''), 'Eligibility extraction failed'
          assert 'Computer Based Test' in d.get('selection',''), 'Selection extraction failed'
          assert d.get('fieldConfidence',{}).get('vacancy',{}).get('level') == 'medium'
          assert d.get('fieldConfidence',{}).get('eligibility',{}).get('level') == 'medium'
          print('Draft-only safety: OK')
          PY

      - name: 3. Validate public government data safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('onestop-updates-data.js').read_text(encoding='utf-8')
          required = ['var DATA=', 'jobs:', 'admit:', 'results:', 'answer:', 'admission:', 'scholarship:', 'syllabus:', 'important:']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing required public-data sections: ' + ', '.join(missing))
          urls = re.findall(r'https?://[^\"\'\s)]+', text)
          unsafe = [u for u in urls if u.lower().startswith(('javascript:', 'data:', 'vbscript:'))]
          if unsafe:
              raise SystemExit('Unsafe URL detected in public government data')
          print(f'Public government data safety: OK ({len(urls)} URLs checked)')
          PY
