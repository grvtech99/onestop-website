name: Validate ONESTOP Government Pipeline
on: push
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Organize government project and replace legacy pipeline
        shell: bash
        run: |
          set -euo pipefail
          R=government-job-update
          mkdir -p "$R"
          [ -d data ] && git mv data "$R/data" || true
          [ -d scripts ] && git rm -r scripts || true
          for f in GOVERNMENT-JOB-UPDATE-OPERATIONS.md onestop-government-admin.html onestop-government-draft-dashboard.html onestop-government-updates-v3.css onestop-update-review-queue.html onestop-updates-data.js onestop-updates-publish.html onestop-updates-review-queue.html onestop-updates-review.html onestop-updates-verified-drafts.html onestop-updates.html; do
            [ -f "$f" ] && git mv "$f" "$R/$f"
          done
          for f in onestop-visual-polish-v2.css onestop-native-ui.css onestop_logo.png; do
            [ -f "$f" ] && cp -f "$f" "$R/$f"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('href="onestop-updates.html"','href="government-job-update/onestop-updates.html"'); p.write_text(s,encoding='utf-8')
          PY
          for f in .github/workflows/*government*.yml .github/workflows/*government*.yaml; do
            [ -e "$f" ] || continue
            [ "$f" = ".github/workflows/validate-government-pipeline.yml" ] || git rm -f "$f"
          done
          cat > "$R/README.md" <<'EOF'
          # ONESTOP Government Job Update
          Portable home for SarkariResult discovery and official-source verification.
          SarkariResult is discovery-only; FreeJobAlert and other aggregators are excluded.
          Missing/conflicting/inaccessible official evidence is held. 402/403/429 responses stop the cycle.
          No bypass, CAPTCHA bypass, proxy rotation, fingerprint spoofing, hidden endpoints or aggressive crawling.
          EOF
          cat > "$R/data/sarkariresult-policy.json" <<'EOF'
          {"schemaVersion":1,"discoverySource":"https://www.sarkariresult.com/","mode":"discovery_only","officialSourceRequiredBeforePublication":true,"excludedSources":["freejobalert","other_aggregators"],"respectRobotsTxt":true,"holdOnConflict":true,"holdOnMissingOfficialSource":true,"no403Bypass":true,"no402Bypass":true,"noCaptchaBypass":true,"noProxyRotation":true,"noFingerprintSpoofing":true,"noHiddenEndpoints":true,"noAggressiveCrawling":true}
          EOF
          cat > "$R/data/sarkariresult-monitor-state.json" <<'EOF'
          {"schemaVersion":1,"source":"sarkariresult","sourceUrl":"https://www.sarkariresult.com/","status":"not_run","lastCheckedAt":null,"lastSuccessfulDiscoveryAt":null,"lastError":null,"items":{}}
          EOF
          cat > "$R/scripts/sarkariresult-monitor.py" <<'PY'
          import hashlib,json,sys,urllib.error,urllib.request,xml.etree.ElementTree as ET
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urljoin
          ROOT=Path(__file__).resolve().parents[1]; D=ROOT/'data'; BASE='https://www.sarkariresult.com/'; UA='ONESTOP-Government-Job-Update/1.0'; STATE=D/'sarkariresult-monitor-state.json'; LOG=D/'sarkariresult-monitor-log.json'
          def save(p,x): p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA}),timeout=20); return r.status,r.read(2000000),None
              except urllib.error.HTTPError as e: return e.code,b'',f'HTTP {e.code}'
              except Exception as e: return None,b'',str(e)[:300]
          def locs(b):
              try: return [e.text.strip() for e in ET.fromstring(b).iter() if e.tag.rsplit('}',1)[-1]=='loc' and e.text]
              except Exception: return []
          def main():
              t=datetime.now(timezone.utc).isoformat(); old={}
              try: old=json.loads(STATE.read_text(encoding='utf-8')).get('items',{})
              except Exception: pass
              log={'checkedAt':t,'source':BASE,'status':'unknown','new':0,'changed':0,'error':None}; c,b,e=get(urljoin(BASE,'robots.txt'))
              if c!=200: log.update(status='source_unavailable',error=e or f'HTTP {c}'); save(LOG,log); return 0
              rules=b.decode('utf-8','replace').lower()
              if 'user-agent: *' in rules and 'disallow: /' in rules: log.update(status='robots_blocked',error='robots.txt disallows generic crawling'); save(LOG,log); return 0
              urls=[]
              for ep in ('feed_rss.xml','sitemap.xml'):
                  c,x,e=get(urljoin(BASE,ep))
                  if c==200: urls += [u for u in locs(x) if u.startswith(BASE)]
              urls=list(dict.fromkeys(urls))[:500]
              if not urls: log.update(status='source_unavailable',error='No accessible public discovery index'); save(LOG,log); return 0
              out={}
              for u in urls:
                  k=hashlib.sha256(u.encode()).hexdigest()[:24]; fp=hashlib.sha256(u.encode()).hexdigest(); out[k]={'id':k,'url':u,'fingerprint':fp,'discoveredAt':t}; log['new']+=k not in old; log['changed']+=k in old and old[k].get('fingerprint')!=fp
              save(STATE,{'schemaVersion':1,'source':'sarkariresult','sourceUrl':BASE,'status':'ok','lastCheckedAt':t,'lastSuccessfulDiscoveryAt':t,'lastError':None,'items':out}); save(LOG,log); return 0
          if __name__=='__main__': sys.exit(main())
          PY
          chmod +x "$R/scripts/sarkariresult-monitor.py"
          cat > .github/workflows/government-job-update.yml <<'EOF'
          name: Government Job Update — SarkariResult Discovery
          on:
            schedule:
              - cron: '47 * * * *'
            workflow_dispatch:
          permissions:
            contents: write
          concurrency:
            group: government-job-update
            cancel-in-progress: false
          jobs:
            discover:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                - run: python government-job-update/scripts/sarkariresult-monitor.py
                - name: Save state
                  run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add government-job-update/data/sarkariresult-monitor-state.json government-job-update/data/sarkariresult-monitor-log.json
                    git diff --cached --quiet || (git commit -m "Update SarkariResult discovery state" && git push)
          EOF
          git rm -f .github/workflows/validate-government-pipeline.yml
          git rm -f .github/workflows/government-job-update-migration.yml 2>/dev/null || true
          git add -A
          git commit -m "Organize government job project and replace legacy workflows"
          git push
