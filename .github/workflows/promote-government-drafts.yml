name: Promote Government Drafts To Review Queue

on:
  workflow_dispatch:
  schedule:
    - cron: '7 4 * * *'

permissions:
  contents: write
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote extracted candidates
        run: python scripts/promote-ingestion-candidates.py
      - name: Create review issues for pending candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/create-government-review-issues.py
      - name: Build dashboard manifest
        run: python scripts/build-government-ingestion-manifest.py
      - name: Commit queue and dashboard state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/government-update-review-queue.json data/government-ingestion-candidates data/government-ingestion-manifest.json
          if git diff --cached --quiet; then
            echo "No queue/dashboard changes."
          else
            git commit -m "chore: update government review dashboard"
            git push
          fi
