name: Government Job Update — SarkariResult Discovery

on:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - 'government-job-update/**'
      - '!government-job-update/data/sarkariresult-monitor-state.json'
      - '!government-job-update/data/sarkariresult-monitor-log.json'
      - '!government-job-update/data/official-verification-state.json'
      - '!government-job-update/data/official-verification-log.json'
      - '!government-job-update/data/publication-queue.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: government-job-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run safe SarkariResult discovery
        run: python government-job-update/scripts/sarkariresult-monitor.py

      - name: Run official-source verification
        run: python government-job-update/scripts/official-source-verifier.py

      - name: Run controlled live end-to-end test
        run: python government-job-update/scripts/end-to-end-test.py

      - name: Run publication gate regression test
        run: python government-job-update/scripts/publication-gate-test.py

      - name: Build verified-only publication queue
        run: python government-job-update/scripts/publication-gate.py

      - name: Save discovery, verification and publication state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add government-job-update/data/sarkariresult-monitor-state.json \
                  government-job-update/data/sarkariresult-monitor-log.json \
                  government-job-update/data/official-verification-state.json \
                  government-job-update/data/official-verification-log.json \
                  government-job-update/data/publication-queue.json
          if git diff --cached --quiet; then
            echo "No discovery/verification/publication state change."
          else
            git commit -m "Update verified government job publication queue"
            git push
          fi
