name: Government Job Update — Multi-Source Discovery

on:
  schedule:
    - cron: '8/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'government-job-update/**'
      - '.github/workflows/government-job-update.yml'
      - '!government-job-update/data/sarkariresult-monitor-state.json'
      - '!government-job-update/data/sarkariresult-monitor-log.json'
      - '!government-job-update/data/official-verification-state.json'
      - '!government-job-update/data/official-verification-log.json'
      - '!government-job-update/data/publication-queue.json'
      - '!government-job-update/data/publication-history.json'
      - '!government-job-update/data/canonical-job-records.json'
      - '!government-job-update/data/admin-dashboard-state.json'
      - '!government-job-update/data/admin-execution-status.json'
      - '!government-job-update/data/discovery-buffer.json'
      - '!government-job-update/test-results/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: government-job-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONESTOP_VERIFY_MAX_RECORDS: 160
      ONESTOP_RECOVERY_MAX_ITEMS: 160
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: discovery
        name: 1. Multi-source discovery
        if: ${{ !cancelled() }}
        run: python government-job-update/scripts/sarkariresult-monitor.py

      - id: buffer
        name: 2. Persist discovery buffer in run workspace
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data=Path('government-job-update/data')
          state=json.loads((data/'sarkariresult-monitor-state.json').read_text(encoding='utf-8'))
          items=state.get('items',{}) if isinstance(state.get('items',{}),dict) else {}
          buffer={'schemaVersion':1,'bufferedAt':datetime.now(timezone.utc).isoformat(),'sourceCheckedAt':state.get('lastCheckedAt'),'sourceStatus':state.get('status'),'itemCount':len(items),'items':items}
          (data/'discovery-buffer.json').write_text(json.dumps(buffer,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'Buffered {len(items)} discovered items for this run; no intermediate git push is performed.')
          PY

      - id: verification
        name: 3. Official-source verification
        if: ${{ !cancelled() }}
        run: python government-job-update/scripts/official-department-verifier.py

      - id: verificationRecovery
        name: 4. Official-link recovery
        if: ${{ !cancelled() }}
        run: python government-job-update/scripts/verification-recovery.py

      - id: enrichment
        name: 5. Official notification enrichment
        if: ${{ !cancelled() }}
        run: python government-job-update/scripts/document-enrichment.py

      - id: e2e
        name: 6. Controlled live E2E validation
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python government-job-update/scripts/end-to-end-test.py

      - id: publicationRegression
        name: 7. Publication-gate regression test
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python government-job-update/scripts/publication-gate-test.py

      - id: publicationQueue
        name: 8. Build verified publication queue and durable history
        if: ${{ !cancelled() }}
        run: python government-job-update/scripts/publication-gate.py

      - id: executionStatus
        name: 9. Record workflow execution telemetry
        if: ${{ !cancelled() }}
        env:
          STEP_DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          STEP_BUFFER_OUTCOME: ${{ steps.buffer.outcome }}
          STEP_VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          STEP_VERIFICATION_RECOVERY_OUTCOME: ${{ steps.verificationRecovery.outcome }}
          STEP_ENRICHMENT_OUTCOME: ${{ steps.enrichment.outcome }}
          STEP_E2E_OUTCOME: ${{ steps.e2e.outcome }}
          STEP_PUBLICATION_REGRESSION_OUTCOME: ${{ steps.publicationRegression.outcome }}
          STEP_PUBLICATION_QUEUE_OUTCOME: ${{ steps.publicationQueue.outcome }}
          STEP_ADMIN_SNAPSHOT_OUTCOME: PENDING
        run: python government-job-update/scripts/build-admin-execution-status.py

      - id: adminSnapshot
        name: 10. Build admin dashboard snapshot
        if: ${{ !cancelled() }}
        run: python government-job-update/scripts/build-admin-status.py

      - name: Upload diagnostic and buffer artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: government-job-update-run-state
          path: |
            government-job-update/data/discovery-buffer.json
            government-job-update/data/admin-dashboard-state.json
            government-job-update/data/admin-execution-status.json
            government-job-update/test-results/
          if-no-files-found: warn

      - id: stateSave
        name: Save discovery, verification, canonical, publication, buffer, admin and execution state
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add government-job-update/data/sarkariresult-monitor-state.json \
                  government-job-update/data/sarkariresult-monitor-log.json \
                  government-job-update/data/official-verification-state.json \
                  government-job-update/data/official-verification-log.json \
                  government-job-update/data/canonical-job-records.json \
                  government-job-update/data/publication-queue.json \
                  government-job-update/data/publication-history.json \
                  government-job-update/data/discovery-buffer.json \
                  government-job-update/data/admin-dashboard-state.json \
                  government-job-update/data/admin-execution-status.json
          if git diff --cached --quiet; then
            echo "state_changed=false" >> "$GITHUB_OUTPUT"
            echo "No pipeline state change."
          else
            git commit -m "Update government job pipeline monitoring state"
            git push
            echo "state_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deterministic Pages publication
        if: ${{ !cancelled() && steps.stateSave.outputs.state_changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({
            'event_type':'government-job-update-published',
            'client_payload':{
              'source_run_id':os.environ['GITHUB_RUN_ID'],
              'source_run_number':os.environ['GITHUB_RUN_NUMBER'],
              'source_sha':os.environ['GITHUB_SHA']
            }
          }))
          PY
          )
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches \
            -d "$payload"
          echo "Pages publication dispatch accepted."
