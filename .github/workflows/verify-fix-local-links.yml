name: Verify and Fix Local Tool Links
on:
  push:
    branches: [free-csc-tools-reorg]
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-csc-tools-reorg
          fetch-depth: 0
      - name: Cross-check local links and remove stale bridges
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          # Canonical basename mapping for legacy audio names and other renamed tools.
          audio={
            'audio-compressor.html':'onestop-audio-compressor.html','audio-equalizer.html':'onestop-audio-equalizer.html','audio-fade.html':'onestop-audio-fade.html','audio-file-info.html':'onestop-audio-file-info.html','audio-mute.html':'onestop-audio-mute.html','audio-noise-reducer.html':'onestop-audio-noise-reducer.html','audio-normalizer.html':'onestop-audio-normalizer.html','audio-pitch-changer.html':'onestop-audio-pitch-changer.html','audio-ringtone-maker.html':'onestop-audio-ringtone-maker.html','audio-silence-remover.html':'onestop-audio-silence-remover.html','audio-speed-changer.html':'onestop-audio-speed-changer.html','audio-to-video.html':'onestop-audio-to-video.html','audio-voice-recorder.html':'onestop-audio-voice-recorder.html','audio-volume-changer.html':'onestop-audio-volume-changer.html','audio-waveform.html':'onestop-audio-waveform.html','video-to-audio.html':'video-to-audio.html','onestop-audio-to-text.html':'onestop-audio-to-text.html','onestop-text-to-speech.html':'onestop-text-to-speech.html','onestop-video-to-audio.html':'onestop-video-to-audio.html','onestop-vocal-remover.html':'onestop-vocal-remover.html','onestop-voice-changer.html':'onestop-voice-changer.html'}
          # Build unique filename index after the physical moves.
          by_name={}
          for p in root.rglob('*'):
            if p.is_file() and '.git' not in p.parts:
              by_name.setdefault(p.name,[]).append('/'+p.relative_to(root).as_posix())
          text_ext={'.html','.css','.js','.md','.txt','.json'}
          attr=re.compile(r'(?P<prefix>href|src)=(?P<q>["\'])(?P<url>[^"\']+)(?P=q)')
          cssurl=re.compile(r'url\((?P<q>["\']?)(?P<url>[^)"\']+)(?P=q)\)')
          changed=[]
          broken=[]
          for p in [x for x in root.rglob('*') if x.is_file() and x.suffix.lower() in text_ext and '.git' not in x.parts]:
            try:s=p.read_text(encoding='utf-8')
            except:continue
            orig=s
            def fix_url(u):
              if not u or u.startswith(('#','http://','https://','mailto:','tel:','data:','javascript:','blob:')): return u
              if u.startswith('/'):
                return u if (root/u.lstrip('/')).exists() else u
              # Normalize old direct audio names to their actual final files.
              if u in audio:
                candidates=by_name.get(audio[u],[])
                if len(candidates)==1:return candidates[0]
              target=(p.parent/u).resolve()
              try: rel=target.relative_to(root.resolve())
              except ValueError:return u
              if target.exists(): return u
              # If the relative target no longer exists, use a unique basename match.
              name=Path(u).name
              candidates=by_name.get(name,[])
              if len(candidates)==1:return candidates[0]
              # Legacy bridge page names map to their canonical final locations.
              legacy={
                'free-tools.html':'/free-csc-tools/index.html',
                'free-online-games.html':'/free-online-games/free-online-games.html',
                'resume-maker-30-templates.html':'/free-one-click-resume/resume-maker-30-templates.html',
                'non-stop-jap.html':'/non-stop-jap/non-stop-jap.html',
                'onestop-free-passport-photo-maker.html.html':'/free-csc-tools/passport/onestop-free-passport-photo-maker.html',
                'onestop-fast-document-print-free-premium.html':'/free-csc-tools/onestop-fast-document-print-free-premium.html',
              }
              return legacy.get(name,u)
            s=attr.sub(lambda m:m.group('prefix')+'='+m.group('q')+fix_url(m.group('url'))+m.group('q'),s)
            s=cssurl.sub(lambda m:'url('+m.group('q')+fix_url(m.group('url'))+m.group('q')+')',s)
            if s!=orig:
              p.write_text(s,encoding='utf-8');changed.append(str(p))
          # Explicitly ensure no old root bridge pages remain.
          for name in ['free-online-games.html','resume-maker-30-templates.html','non-stop-jap.html','onestop-fast-document-print-free-premium.html']:
            p=root/name
            if p.exists(): p.unlink(); changed.append(str(p))
          # Remove any folder-local compatibility bridges left by previous moves.
          for rel in ['free-csc-tools/audio-tools/free-tools.html','free-csc-tools/audio-tools/onestop-native-ui.css','free-csc-tools/audio-tools/onestop-visual-polish-v2.css','free-one-click-resume/free-online-games.html','free-one-click-resume/onestop-native-ui.css','free-one-click-resume/onestop-visual-polish-v2.css','free-online-games/onestop-native-ui.css','free-online-games/onestop-visual-polish-v2.css']:
            p=root/rel
            if p.exists(): p.unlink(); changed.append(str(p))
          print('Changed:',len(changed))
          for x in changed: print(x)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verify and repair direct tool links [skip ci]' || exit 0
          git push origin HEAD:free-csc-tools-reorg
