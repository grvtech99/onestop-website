name: Verify ONESTOP Government Sources

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ONESTOP
        uses: actions/checkout@v4

      - name: Detect official-source changes
        id: detect
        shell: bash
        run: |
          set +e
          python3 scripts/check-government-sources.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit source snapshot and review queue
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/government-source-snapshots.json data/government-update-review-queue.json; then
            echo 'No source snapshot or review queue changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/government-source-snapshots.json data/government-update-review-queue.json
          git commit -m 'Update government source review queue'
          git push

      - name: Report source-check status
        shell: bash
        run: |
          status='${{ steps.detect.outputs.status }}'
          if [ "$status" != '0' ]; then
            echo 'One or more official sources failed. Snapshot and queue were still persisted for review.'
            exit "$status"
          fi
