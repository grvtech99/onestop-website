name: Repair and Validate Games

on:
  push:
    paths:
      - '.github/workflows/repair-validate-games.yml'

permissions:
  contents: write

jobs:
  repair-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good complete game sources
        shell: bash
        run: |
          set -euo pipefail
          git checkout 0a54b1301780cbd5fb503acc4fdaaefb281c0310 -- games/*.html

      - name: Clean duplicate/broken mobile CSS
        shell: python
        run: |
          from pathlib import Path
          names = [
            '01-reaction-rush.html','02-color-match.html','03-2048-neon.html','04-whack-a-mole.html','05-space-dodge.html',
            '06-memory-match.html','07-brick-breaker.html','08-number-ninja.html','09-fruit-catch.html','10-word-scramble.html',
            '11-math-master.html','12-science-quiz.html','13-geography-explorer.html','14-english-vocabulary.html','15-typing-academy.html',
            '16-money-smart.html','17-element-challenge.html','18-logic-sequence.html','19-history-challenge.html','20-computer-genius.html'
          ]
          css = r'''
/* ONESTOP CLEAN MOBILE GAME LAYOUT */
html,body{width:100%;max-width:100%;overflow-x:hidden!important}body{min-width:0!important}
.top,.topin,.page,main{width:100%;max-width:100%;box-sizing:border-box}
.page{padding-left:max(7px,env(safe-area-inset-left));padding-right:max(7px,env(safe-area-inset-right));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.gamebox,.box,.panel,.stage{width:100%;max-width:100%;box-sizing:border-box;min-width:0}
.gamebox,.box{margin-left:auto;margin-right:auto}
canvas,video,img,svg{max-width:100%;box-sizing:border-box}
.topin{gap:8px}.brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.back{flex:0 0 auto;white-space:nowrap}
.credit{position:relative;z-index:2;width:min(100%,1000px);max-width:1000px;margin:0 auto 12px!important;padding:8px 10px!important;display:flex;align-items:center;justify-content:flex-start;gap:8px;box-sizing:border-box;border:1px solid rgba(56,232,255,.25);border-radius:14px;background:linear-gradient(135deg,rgba(56,232,255,.10),rgba(255,79,216,.08) 55%,rgba(255,255,255,.035));box-shadow:0 8px 28px rgba(0,0,0,.22)}
.credit:before{content:'DEVELOPED & DESIGNED BY';align-self:stretch;display:flex;align-items:center;padding-right:8px;border-right:1px solid rgba(255,255,255,.10);color:#8e99bb;font-size:7px;font-weight:900;letter-spacing:.7px;white-space:nowrap}.credit img{width:38px!important;height:38px!important;flex:0 0 38px!important;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid rgba(56,232,255,.65)}.credit div{min-width:0;text-align:left}.credit small{display:block;margin:0 0 2px;color:#8290b4;font-size:7px!important;text-transform:uppercase;letter-spacing:.7px;font-weight:900}.credit strong{display:block;color:#fff;font-size:12px!important;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:650px){
.topin{padding:7px 8px!important}.brand{font-size:13px!important}.back{font-size:9px!important;padding:6px 7px!important}.page{padding-top:7px!important}
.credit{margin-bottom:7px!important;padding:6px 8px!important;min-height:42px!important;border-radius:12px!important;gap:7px!important}.credit:before{font-size:6px!important;padding-right:7px!important}.credit img{width:32px!important;height:32px!important;flex-basis:32px!important}.credit strong{font-size:10px!important}.credit small{font-size:6px!important}
.hero h1{font-size:clamp(24px,8.5vw,34px)!important;line-height:1.04!important;margin:5px 0 4px!important}.hero p{font-size:12px!important;line-height:1.3!important;margin:0 auto 8px!important}.tag{font-size:8px!important;padding:5px 8px!important}
.gamebox,.box{border-radius:16px!important}.panel{border-radius:15px!important}.hud{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:4px!important;padding:5px!important}.h{min-width:0!important;padding:6px 3px!important;border-radius:8px!important}.h small{font-size:6.5px!important}.h b{font-size:15px!important;line-height:1.05!important}
.stage{width:100%!important;min-width:0!important;height:clamp(300px,calc(100svh - 300px),440px)!important;min-height:300px!important;max-height:440px!important;padding:0!important;overflow:hidden!important}.stage canvas{width:100%!important;height:100%!important;display:block!important}
.content{width:100%!important;max-width:100%!important}.question{font-size:clamp(20px,6vw,30px)!important;line-height:1.15!important}.choices{gap:8px!important}.choice{padding:12px 9px!important;font-size:13px!important;border-radius:11px!important}.input{width:100%!important;font-size:16px!important;padding:11px!important}.primary{width:100%!important;padding:11px 12px!important;font-size:14px!important}
.modal{max-width:calc(100vw - 24px)!important;max-height:calc(100% - 14px)!important;padding:15px 10px!important;border-radius:15px!important;overflow:auto!important}.modal h2{font-size:22px!important;line-height:1.1!important}.modal p{font-size:12px!important;line-height:1.35!important}.modal .big,.modal .emoji{font-size:38px!important}.info{margin-top:9px!important;padding:10px!important;font-size:11px!important;line-height:1.4!important}
}
@media(max-width:430px){.topin{padding:5px 6px!important}.brand{font-size:11px!important}.back{font-size:8px!important;padding:5px 6px!important}.page{padding:5px 6px 20px!important}.credit{margin-bottom:5px!important;padding:4px 6px!important;min-height:36px!important}.credit:before{display:none!important}.credit img{width:28px!important;height:28px!important;flex-basis:28px!important}.credit strong{font-size:9px!important}.credit small{font-size:5.5px!important}.hero h1{font-size:22px!important;margin:3px 0!important}.hero p{display:none!important}.tag{font-size:6.5px!important;padding:3px 6px!important}.hud{gap:3px!important;padding:3px!important}.h{padding:4px 2px!important;min-height:32px!important}.h small{font-size:5px!important}.h b{font-size:12px!important}.stage{height:clamp(285px,calc(100svh - 245px),410px)!important;min-height:285px!important;max-height:410px!important}}
@media(max-width:360px){.topin{padding:4px 5px!important}.brand{font-size:10px!important}.back{font-size:7px!important;padding:4px 5px!important}.page{padding:4px 5px 18px!important}.credit{min-height:33px!important;padding:3px 5px!important}.credit img{width:26px!important;height:26px!important;flex-basis:26px!important}.credit strong{font-size:8px!important}.credit small{font-size:5px!important}.hud{gap:2px!important;padding:2px!important}.h{min-height:30px!important;padding:3px 2px!important}.h b{font-size:11px!important}.stage{height:clamp(280px,calc(100svh - 225px),390px)!important;min-height:280px!important;max-height:390px!important}}
'''
          for name in names:
              p=Path('games')/name
              s=p.read_text(encoding='utf-8')
              # Keep the complete known-good HTML body/script, but reduce the old CSS to its base section.
              marker='/* ONESTOP MOBILE RESPONSIVE PATCH */'
              if marker in s:
                  s=s[:s.index(marker)] + '</style>' + s.split('</style>',1)[1]
              # If old polish/final markers somehow remain, remove them before the closing head.
              for m in ['/* ONESTOP MOBILE GAME POLISH */','/* ONESTOP_FINAL_MOBILE_V2 */','/* ONESTOP MOBILE RESPONSIVE PATCH */']:
                  s=s.replace(m,'')
              i=s.find('</style>')
              if i<0: raise SystemExit(f'No style in {name}')
              s=s[:i]+css+s[i:]
              p.write_text(s,encoding='utf-8')

      - name: Validate HTML, JavaScript, IDs and duplicates BEFORE commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          names=[f'{i:02d}-'+n+'.html' for i,n in enumerate(['reaction-rush','color-match','2048-neon','whack-a-mole','space-dodge','memory-match','brick-breaker','number-ninja','fruit-catch','word-scramble','math-master','science-quiz','geography-explorer','english-vocabulary','typing-academy','money-smart','element-challenge','logic-sequence','history-challenge','computer-genius'],1)]
          bad=[]
          for name in names:
              s=(Path('games')/name).read_text(encoding='utf-8')
              for tag in ['head','body','html']:
                  if s.lower().count(f'</{tag}>')!=1: bad.append(f'{name}: closing </{tag}> count != 1')
              if s.find('<body')<0 or s.find('</body>')<0 or s.find('<script')<0: bad.append(f'{name}: missing body/script')
              if s.find('ONESTOP_FINAL_MOBILE_V2')>=0 or s.find('ONESTOP MOBILE GAME POLISH')>=0 or s.find('ONESTOP MOBILE RESPONSIVE PATCH')>=0: bad.append(f'{name}: duplicate/legacy CSS marker remains')
              if s.rfind('</html>') < s.rfind('</body>'): pass
              else: bad.append(f'{name}: invalid body/html closing order')
              ids=set(re.findall(r'\bid=["\']([^"\']+)["\']',s))
              refs=re.findall(r'getElementById\(["\']([^"\']+)["\']\)',s)
              for rid in refs:
                  if rid not in ids: bad.append(f'{name}: JS references missing id {rid}')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
              for j,js in enumerate(scripts):
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(js); fn=f.name
                  r=subprocess.run(['node','--check',fn],text=True,capture_output=True)
                  if r.returncode: bad.append(f'{name}: JS syntax error in script {j}: {r.stderr.strip()}')
              fnames=re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', '\n'.join(scripts))
              from collections import Counter
              for fn,c in Counter(fnames).items():
                  if c>1: bad.append(f'{name}: duplicate function declaration {fn} x{c}')
          if bad:
              print('\n'.join(bad)); raise SystemExit(1)
          print('PASS: 20/20 HTML structure, JS syntax, DOM IDs and duplicate-function checks')
          PY

      - name: Commit only after validation passes
        shell: bash
        run: |
          git config user.name 'ONESTOP Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/*.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair game HTML and clean mobile CSS [skip ci]'
          git push
