name: Apply Final Game Mobile Fix
on:
  push:
    paths:
      - '.github/workflows/apply-final-game-mobile-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply final mobile layout to all 20 games
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          files = sorted(Path('games').glob('*.html'))
          if len(files) != 20:
              print(f'ERROR: expected 20 game files, found {len(files)}')
              sys.exit(1)
          css = r'''<style id="onestop-mobile-final-v2">
          @media(max-width:650px){
            .credit{justify-content:center!important;text-align:center!important;margin-left:auto!important;margin-right:auto!important;}
            .credit div{text-align:center!important;}
            .hud{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:5px!important;padding:7px!important;margin:0!important;}
            .h{min-height:54px!important;padding:8px 4px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:center!important;}
            .h small{font-size:7.5px!important;line-height:1.1!important;}
            .h b{font-size:18px!important;line-height:1.1!important;}
            .hint{display:none!important;}
            .info{display:none!important;}
          }
          @media(max-width:430px){
            .credit{justify-content:center!important;}
            .hud{gap:4px!important;padding:6px!important;}
            .h{min-height:52px!important;padding:7px 3px!important;}
            .h small{font-size:7px!important;}
            .h b{font-size:17px!important;}
          }
          @media(max-width:360px){
            .hud{gap:3px!important;padding:5px!important;}
            .h{min-height:49px!important;padding:6px 2px!important;}
            .h small{font-size:6.5px!important;}
            .h b{font-size:16px!important;}
          }
          </style>'''
          for p in files:
              s = p.read_text(encoding='utf-8')
              original_len = len(s)
              # Remove every previous version of our final override block.
              s = re.sub(r'<style\s+id="onestop-(?:hud-center-final|mobile-final-v2)"[^>]*>.*?</style>\s*', '', s, flags=re.I|re.S)
              # Remove the descriptive info card from every game; the game screen is the focus on mobile.
              s = re.sub(r'\s*<div\s+class="info"[^>]*>.*?</div>\s*', '\n', s, count=1, flags=re.I|re.S)
              # Add one canonical override immediately before </head>.
              if '</head>' not in s.lower():
                  print(f'ERROR: missing </head> in {p}')
                  sys.exit(1)
              s = re.sub(r'</head>', css + '\n</head>', s, count=1, flags=re.I)
              # Structural sanity before writing.
              if s.count('</head>') != 1 or s.count('</body>') != 1 or s.count('</html>') != 1:
                  print(f'ERROR: broken HTML structure in {p}')
                  sys.exit(1)
              if '<body' not in s.lower() or '<script' not in s.lower() or len(s) < 50000:
                  print(f'ERROR: suspiciously incomplete game file {p} ({len(s)} bytes; was {original_len})')
                  sys.exit(1)
              p.write_text(s, encoding='utf-8')
          print('Updated 20/20 games')
          PY
      - name: Validate all game files
        shell: bash
        run: |
          set -e
          files=(games/*.html)
          test "${#files[@]}" -eq 20
          for f in "${files[@]}"; do
            test "$(grep -o '</head>' "$f" | wc -l)" -eq 1
            test "$(grep -o '</body>' "$f" | wc -l)" -eq 1
            test "$(grep -o '</html>' "$f" | wc -l)" -eq 1
            test "$(grep -c 'onestop-mobile-final-v2' "$f")" -eq 1
            test "$(grep -c 'class=\"info\"' "$f")" -eq 0
            test "$(grep -c 'class=\"hint\"' "$f")" -ge 0
            python3 - "$f" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',s,re.I|re.S)
          if not scripts: raise SystemExit('no script')
          for x in scripts:
              Path('/tmp/check.js').write_text(x,encoding='utf-8')
              import subprocess
              if subprocess.run(['node','--check','/tmp/check.js'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
                  raise SystemExit('JS syntax error')
          PY
          done
          echo 'PASS: 20/20 games validated'
      - name: Commit game fixes and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/*.yml .github/workflows/*.yaml
          git add games .github/workflows
          git commit -m 'Fix mobile game HUD and remove extra game text' || exit 0
          git push
