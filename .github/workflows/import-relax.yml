name: Build Relax Games
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate 20 relaxing games
        env:
          PHOTO_B64: 
        run: |
          python3 - <<'PY'
          import os,html
          from pathlib import Path
          out=Path('games/relax'); out.mkdir(parents=True,exist_ok=True)
          photo='data:image/jpeg;base64,'+os.environ['PHOTO_B64']
          games=[
          ('01','Bubble Calm','🫧','Tap anywhere to create gentle bubbles.'),('02','Zen Garden','🪨','Shape a quiet garden with every touch.'),('03','Color Flow','🌈','Paint slow, flowing waves of color.'),('04','Ocean Relax','🌊','Make soft ocean ripples and listen.'),('05','Zen Spiral','🌀','Trace a peaceful spiral with your finger.'),('06','Rainy Window','🌧️','Tap to create relaxing raindrop rings.'),('07','Glow Dots','✨','Create soft glowing points and watch them drift.'),('08','Relax Puzzle','🧩','Connect nearby lights into calming patterns.'),('09','Stone Balance','🪨','Place stones and build a peaceful stack.'),('10','Cosmic Calm','🌌','Release stars into a slow cosmic field.'),('11','Leaf Drift','🍃','Guide floating leaves through a gentle breeze.'),('12','Sand Art','🏖️','Draw simple flowing patterns in virtual sand.'),('13','Firefly Meadow','🪲','Light up a quiet meadow with fireflies.'),('14','Aquarium Calm','🐠','Create bubbles and watch a tranquil aquarium.'),('15','Cloud Touch','☁️','Touch the sky and make clouds wander.'),('16','Mandala Bloom','🌸','Grow a symmetrical flower with each tap.'),('17','Zen Tiles','🔲','Fill the canvas with balanced soft tiles.'),('18','Water Ripple','💧','Create overlapping water ripples.'),('19','Star Breath','⭐','Tap on the slow breathing rhythm.'),('20','Peaceful Memory','🧠','Reveal soft symbols and remember their pairs.')]
          template='''<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title} | ONESTOP</title><style>:root{{--bg:#071014;--panel:#101b20;--text:#f5fbfa;--muted:#9eb1b0;--a:#66e0c0}}*{{box-sizing:border-box}}html,body{{margin:0;min-height:100%;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 15% 5%,rgba(102,224,192,.13),transparent 28%),var(--bg);color:var(--text)}}body{{overflow-x:hidden}}.top{{height:58px;background:rgba(7,16,20,.9);border-bottom:1px solid rgba(255,255,255,.08)}}.topin{{height:100%;max-width:900px;margin:auto;padding:9px 14px;display:flex;align-items:center;justify-content:space-between}}.brand{{font-weight:950;font-size:15px}}.brand span{{color:var(--a)}}.back{{color:#fff;text-decoration:none;font-size:11px;font-weight:800;border:1px solid #ffffff20;padding:7px 10px;border-radius:9px}}.page{{max-width:900px;margin:auto;padding:10px 12px 18px}}.credit{{height:62px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:left;color:#819492;font-size:9px}}.credit img{{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #66e0c066}}.credit strong{{display:block;color:#b9c9c6;font-size:11px}}.hero{{text-align:center}}.tag{{display:inline-block;padding:5px 9px;border-radius:999px;background:#66e0c014;border:1px solid #66e0c033;color:#a9f5e1;font-size:8px;font-weight:950;letter-spacing:1px}}h1{{font-size:clamp(25px,5vw,40px);margin:6px 0 3px}}.hero p{{color:var(--muted);font-size:11px;margin:0 0 8px}}.hud{{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.h{{background:#101b20;border:1px solid #ffffff12;border-radius:11px;padding:8px;text-align:center}}.h small{{display:block;color:#8ea19f;font-size:8px}}.h b{{display:block;font-size:18px;margin-top:3px}}.stage{{position:relative;height:clamp(390px,58vh,600px);border:1px solid #ffffff12;border-radius:15px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#123027,#071014 70%)}}canvas{{display:block;width:100%;height:100%;touch-action:none}}.actions{{display:flex;gap:7px;justify-content:center;margin-top:8px;flex-wrap:wrap}}button{{border:1px solid #ffffff18;background:#101b20;color:#fff;border-radius:9px;padding:9px 14px;font-weight:850;cursor:pointer}}button.primary{{background:#66e0c0;color:#06130f;border-color:#66e0c0}}.hint{{text-align:center;color:#718381;font-size:9px;margin-top:7px}}@media(max-width:650px){{html,body{{width:100%;max-width:100%;overflow-x:hidden!important}}.topin{{width:100%!important;height:40px!important;min-height:40px!important;padding:6px 8px!important}}.brand{{font-size:15px!important;line-height:1!important}}.back{{font-size:11px!important;padding:6px 9px!important}}.page{{width:100%!important;max-width:100%;padding:5px 8px 10px!important}}.credit{{width:100%!important;height:50px!important;min-height:50px!important;margin:2px auto 5px!important;padding:4px 8px!important;justify-content:center!important;text-align:center!important;gap:8px!important}}.credit div{{text-align:center!important}}.credit img{{width:34px!important;height:34px!important;min-width:34px!important}}.credit small{{font-size:7px!important}}.credit strong{{font-size:10px!important;white-space:nowrap!important}}.hero{{margin:0 0 5px!important}}.tag{{font-size:8px!important;padding:4px 8px!important}}h1{{font-size:23px!important;line-height:1!important;margin:2px 0 4px!important}}.hero p{{font-size:10px!important;margin:0 auto 5px!important}}.hud{{width:100%!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:5px!important;padding:0!important}}.h{{min-width:0!important;min-height:62px!important;padding:8px 3px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important}}.h small{{font-size:8px!important;line-height:1.1!important}}.h b{{font-size:21px!important;line-height:1.05!important;margin-top:3px!important}}.stage{{width:100%!important;height:clamp(420px,calc(100svh - 245px),680px)!important;min-height:420px!important;max-height:680px!important}}.hint{{display:none!important}}.actions button{{min-height:44px}}}}@media(max-width:430px){{.topin{{height:38px!important;min-height:38px!important}}.brand{{font-size:14px!important}}.back{{font-size:10px!important}}.page{{padding:4px 7px 8px!important}}.credit{{height:48px!important;min-height:48px!important}}.credit img{{width:32px!important;height:32px!important;min-width:32px!important}}.credit strong{{font-size:9.5px!important}}.hud{{gap:4px!important}}.h{{min-height:60px!important}}.h small{{font-size:7.5px!important}}.h b{{font-size:20px!important}}.stage{{height:clamp(410px,calc(100svh - 235px),650px)!important;min-height:410px!important;max-height:650px!important}}}}@media(max-width:360px){{.topin{{height:36px!important;min-height:36px!important}}.brand{{font-size:13px!important}}.back{{font-size:9px!important}}.page{{padding:4px 7px 8px!important}}.credit{{height:46px!important;min-height:46px!important}}.credit img{{width:30px!important;height:30px!important;min-width:30px!important}}.hud{{gap:3px!important}}.h{{min-height:56px!important}}.h small{{font-size:7px!important}}.h b{{font-size:19px!important}}.stage{{height:clamp(400px,calc(100svh - 225px),620px)!important;min-height:400px!important;max-height:620px!important}}}}</style></head><body><header class="top"><div class="topin"><div class="brand">🧘 ONESTOP <span>RELAX</span></div><a class="back" href="../free-online-games.html">← Back to Games</a></div></header><main class="page"><section class="credit"><img src="{photo}" alt="Developer"><div><small>GAME CREATOR</small><strong>Developed &amp; Designed by Venkatesh Yadav</strong></div></section><section class="hero"><span class="tag">🌿 FREE • NO LOGIN • RELAX &amp; UNWIND</span><h1>{icon} {title}</h1><p>{desc}</p></section><div class="hud"><div class="h"><small>CALM</small><b id="score">0</b></div><div class="h"><small>STREAK</small><b id="streak">0</b></div><div class="h"><small>TIME</small><b id="time">60</b></div><div class="h"><small>SOUND</small><b id="soundState">ON</b></div></div><div class="stage"><canvas id="c"></canvas></div><div class="actions"><button class="primary" id="sound">🔊 Sound On</button><button id="reset">↻ Reset</button></div><div class="hint">Touch • Mouse • Keyboard</div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),stage=document.querySelector('.stage');let W,H,dpr,score=0,streak=0,time=60,running=true,soundOn=true,pts=[],raf,timer;function size(){{dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}}function beep(f=420,d=.08){{if(!soundOn)return;try{{const A=window.AudioContext||window.webkitAudioContext;if(!window._a)window._a=new A();let o=window._a.createOscillator(),g=window._a.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,window._a.currentTime);g.gain.exponentialRampToValueAtTime(.05,window._a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,window._a.currentTime+d);o.connect(g).connect(window._a.destination);o.start();o.stop(window._a.currentTime+d)}}catch(e){{}}}}function add(px,py){{pts.push({{x:px,y:py,r:5+Math.random()*12,a:1,v:.25+Math.random()*.6,ang:Math.random()*6.28}});score++;streak++;document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;beep(380+Math.random()*260)}}function draw(t){{x.clearRect(0,0,W,H);x.fillStyle='#071014';x.fillRect(0,0,W,H);for(let i=0;i<18;i++){{let xx=(i*97+(t*.008*(i%3+1)))%W,yy=H*(.15+(i%7)/9);x.beginPath();x.arc(xx,yy,1.5+(i%3),0,7);x.fillStyle='rgba(150,230,210,.12)';x.fill()}}pts.forEach(p=>{{p.a-=.004;p.r+=p.v;p.y+=Math.sin(t*.001+p.ang)*.15;p.x+=Math.cos(t*.0007+p.ang)*.15;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.strokeStyle='rgba(102,224,192,'+Math.max(0,p.a)+')';x.lineWidth=2;x.stroke()}});pts=pts.filter(p=>p.a>0);raf=requestAnimationFrame(draw)}}c.addEventListener('pointerdown',e=>{{const r=c.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top)}});document.getElementById('sound').onclick=()=>{{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';document.getElementById('soundState').textContent=soundOn?'ON':'OFF';if(soundOn)beep(600,.12)}};function reset(){{score=0;streak=0;time=60;pts=[];running=true;document.getElementById('score').textContent=0;document.getElementById('streak').textContent=0;document.getElementById('time').textContent=60;clearInterval(timer);timer=setInterval(()=>{{if(time>0){{time--;document.getElementById('time').textContent=time}}else{{clearInterval(timer);running=false;beep(260,.18)}}}},1000);beep(320,.1)}}document.getElementById('reset').onclick=reset;addEventListener('resize',size);size();reset();raf=requestAnimationFrame(draw);</script></body></html>'''
          for n,title,icon,desc in games:
            (out/f'{n}-{title.lower().replace(" ","-")}.html').write_text(template.format(title=html.escape(title),icon=icon,desc=html.escape(desc),photo=photo),encoding='utf-8')
          links=''.join(f'<a class="game" href="games/relax/{n}-{title.lower().replace(" ","-")}.html"><span class="game-icon">{icon}</span><span class="game-info"><span class="game-title">{html.escape(title)}</span><span class="game-desc">{html.escape(desc)}</span></span><span class="play">PLAY</span></a>' for n,title,icon,desc in games)
          section='<section class="category"><button class="cat-head" type="button" aria-expanded="false"><span>🧘 RELAX GAMES</span><small>20 Games</small><span class="arrow">▼</span></button><div class="game-list">'+links+'</div></section>'
          p=Path('free-online-games.html'); s=p.read_text(encoding='utf-8'); marker='</div><div class="empty" id="empty">';
          if 'RELAX GAMES' not in s: s=s.replace(marker,section+marker,1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/import-relax.yml').unlink()
          Path('images/venkatesh-yadav.jpg').unlink(missing_ok=True)
          PY
      - name: Commit generated games and page
        run: |
          git config user.name "grvtech99"
          git config user.email "109285656+grvtech99@users.noreply.github.com"
          git add games/relax free-online-games.html .github/workflows/import-relax.yml images/venkatesh-yadav.jpg
          git commit -m "Add 20 relaxing games with sound effects"
          git push
