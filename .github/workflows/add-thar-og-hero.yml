name: Add Thar OG hero image

on:
  push:
    paths:
      - '.github/workflows/add-thar-og-hero.yml'

jobs:
  fetch-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current Thar OG image
        run: |
          python - <<'PY'
          import re, requests
          url = "https://www.carwale.com/mahindra-cars/thar/images/mahindra-thar-facelift-right-front-three-quarter-809854/"
          h = {"User-Agent":"Mozilla/5.0"}
          html = requests.get(url, headers=h, timeout=30).text
          m = re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)', html, re.I)
          if not m:
              m = re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']', html, re.I)
          if not m:
              raise SystemExit("Could not find og:image")
          img = m.group(1).replace("&amp;","&")
          print(img)
          data = requests.get(img, headers=h, timeout=30).content
          open("/tmp/thar.jpg","wb").write(data)
          PY
          mkdir -p gauravs-world/images
          magick /tmp/thar.jpg -strip -quality 88 gauravs-world/images/mahindra-thar-og-2026-hero.webp
      - name: Commit image and point manifest to it
        run: |
          python - <<'PY'
          import json
          p="gauravs-world/data/articles.json"
          with open(p,encoding="utf-8") as f: d=json.load(f)
          for a in d["articles"]:
              if a["id"]=="mahindra-thar-og-2026-new-launch-price-features":
                  a["image"]="images/mahindra-thar-og-2026-hero.webp"
          with open(p,"w",encoding="utf-8") as f: json.dump(d,f,ensure_ascii=False,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gauravs-world/images/mahindra-thar-og-2026-hero.webp gauravs-world/data/articles.json
          git commit -m "Add verified Thar OG hero image"
          git push
