name: Temp CSC Colorful Thumbnails
on:
  push:
    paths:
      - '.github/workflows/temp-csc-colorful-thumbnails.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow and BeautifulSoup
        run: pip install pillow beautifulsoup4
      - name: Generate colorful PNG thumbnails and update page
        run: |
          cat > build_thumbnails.py <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont
          import re, hashlib, shutil

          ROOT=Path('free-csc-tools')
          HTML_PATH=ROOT/'index.html'
          html=HTML_PATH.read_text(encoding='utf-8')
          soup=BeautifulSoup(html,'html.parser')

          shutil.rmtree(ROOT/'tool-thumbnails', ignore_errors=True)
          shutil.rmtree(ROOT/'category-thumbnails', ignore_errors=True)
          tool_dir=ROOT/'tool-thumbnails'
          cat_dir=ROOT/'category-thumbnails'
          tool_dir.mkdir(parents=True, exist_ok=True)
          cat_dir.mkdir(parents=True, exist_ok=True)

          font_bold=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 34)
          font_mid=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 22)
          font_small=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 16)

          palettes={
            'Image & Photo Tools':((25,105,210),(94,234,212)),
            'Documents & PDF':((220,38,38),(251,191,36)),
            'Social Media & Design':((190,24,93),(124,58,237)),
            'Finance & Calculators':((5,150,105),(16,185,129)),
            'Audio Tools':((124,58,237),(236,72,153)),
            'Video Tools':((234,88,12),(245,158,11)),
            'Utilities & Productivity':((7,89,133),(14,165,233)),
            'Games & Entertainment':((79,70,229),(236,72,153)),
          }

          def slug(s):
              return re.sub(r'[^a-z0-9]+','-',s.lower()).strip('-')

          def category_for_tool(a):
              parent=a.find_parent(class_='accordion-category')
              if parent:
                  h=parent.find(class_='category-title')
                  if h: return h.get_text(' ',strip=True)
              return 'Utilities & Productivity'

          def gradient(size, c1, c2):
              w,h=size; im=Image.new('RGB',size); px=im.load()
              for y in range(h):
                  t=y/(h-1)
                  for x in range(w):
                      q=x/(w-1)
                      mix=min(1,max(0,0.62*t+0.38*q))
                      px[x,y]=tuple(int(c1[i]*(1-mix)+c2[i]*mix) for i in range(3))
              return im

          def draw_icon(d, cat, cx, cy, scale=1):
              # Bold category-specific vector artwork; intentionally no screenshot/UI chrome.
              if cat=='Image & Photo Tools':
                  d.rounded_rectangle((cx-105*scale,cy-72*scale,cx+105*scale,cy+72*scale),18*scale,fill='white',outline=(220,235,255),width=max(2,int(3*scale)))
                  d.rounded_rectangle((cx-82*scale,cy-48*scale,cx-8*scale,cy+50*scale),12*scale,fill=(219,234,254))
                  d.ellipse((cx-62*scale,cy-31*scale,cx-28*scale,cy+3*scale),fill=(245,195,160))
                  d.rounded_rectangle((cx-69*scale,cy+2*scale,cx-21*scale,cy+47*scale),14*scale,fill=(20,52,100))
                  d.ellipse((cx+16*scale,cy-45*scale,cx+82*scale,cy+21*scale),fill=(34,197,94))
                  d.polygon([(cx+15*scale,cy+43*scale),(cx+48*scale,cy+5*scale),(cx+82*scale,cy+43*scale)],fill=(255,255,255))
              elif cat=='Documents & PDF':
                  d.rounded_rectangle((cx-80*scale,cy-88*scale,cx+62*scale,cy+92*scale),12*scale,fill='white')
                  d.polygon([(cx+25*scale,cy-88*scale),(cx+62*scale,cy-51*scale),(cx+25*scale,cy-51*scale)],fill=(226,232,240))
                  d.rounded_rectangle((cx-50*scale,cy-22*scale,cx+42*scale,cy+45*scale),9*scale,fill=(220,38,38))
                  d.text((cx-33*scale,cy-8*scale),'PDF',font=font_mid,fill='white')
                  d.line((cx-50*scale,cy+62*scale,cx+38*scale,cy+62*scale),fill=(147,197,253),width=int(6*scale))
              elif cat=='Social Media & Design':
                  boxes=[(-92,-58,(236,72,153)),(8,-58,(37,99,235)),(-92,18,(239,68,68)),(8,18,(124,58,237))]
                  for ox,oy,c in boxes: d.rounded_rectangle((cx+ox*scale,cy+oy*scale,cx+(ox+78)*scale,cy+(oy+58)*scale),12*scale,fill='white'); d.rounded_rectangle((cx+(ox+8)*scale,cy+(oy+8)*scale,cx+(ox+70)*scale,cy+(oy+50)*scale),9*scale,fill=c)
                  d.ellipse((cx-75*scale,cy-42*scale,cx-54*scale,cy-21*scale),outline='white',width=int(3*scale))
              elif cat=='Finance & Calculators':
                  d.rounded_rectangle((cx-72*scale,cy-90*scale,cx+72*scale,cy+90*scale),18*scale,fill=(15,23,42))
                  d.rounded_rectangle((cx-52*scale,cy-65*scale,cx+52*scale,cy-22*scale),8*scale,fill=(167,243,208))
                  for r in range(3):
                      for c in range(3):
                          x=c*48-48; y=r*45+3
                          d.rounded_rectangle((cx+(x-16)*scale,cy+(y-16)*scale,cx+(x+16)*scale,cy+(y+16)*scale),7*scale,fill=(34,197,94))
              elif cat=='Audio Tools':
                  bars=[18,55,92,42,78,110,66,32,84,58,96]
                  for i,b in enumerate(bars):
                      x=cx-110+i*22
                      d.rounded_rectangle((x*scale,cy-b*scale/2,(x+10)*scale,cy+b*scale/2),5*scale,fill='white')
                  d.ellipse((cx+70*scale,cy-28*scale,cx+126*scale,cy+28*scale),fill=(236,72,153))
                  d.polygon([(cx+89*scale,cy-13*scale),(cx+89*scale,cy+13*scale),(cx+111*scale,cy)],fill='white')
              elif cat=='Video Tools':
                  d.rounded_rectangle((cx-112*scale,cy-72*scale,cx+112*scale,cy+72*scale),18*scale,fill=(15,23,42),outline='white',width=int(3*scale))
                  d.polygon([(cx-28*scale,cy-38*scale),(cx-28*scale,cy+38*scale),(cx+45*scale,cy)],fill=(251,146,60))
                  d.rounded_rectangle((cx-95*scale,cy+49*scale,cx+95*scale,cy+58*scale),4*scale,fill=(251,191,36))
              elif cat=='Games & Entertainment':
                  d.rounded_rectangle((cx-112*scale,cy-55*scale,cx+112*scale,cy+62*scale),50*scale,fill=(30,41,59),outline='white',width=int(3*scale))
                  d.line((cx-70*scale,cy+5*scale,cx-25*scale,cy+5*scale),fill=(96,165,250),width=int(12*scale)); d.line((cx-47*scale,cy-18*scale,cx-47*scale,cy+28*scale),fill=(96,165,250),width=int(12*scale))
                  d.ellipse((cx+38*scale,cy-10*scale,cx+58*scale,cy+10*scale),fill=(236,72,153)); d.ellipse((cx+67*scale,cy+10*scale,cx+87*scale,cy+30*scale),fill=(245,158,11))
              else:
                  d.rounded_rectangle((cx-98*scale,cy-72*scale,cx+98*scale,cy+72*scale),18*scale,fill='white')
                  d.rounded_rectangle((cx-72*scale,cy-43*scale,cx-25*scale,cy+43*scale),9*scale,fill=(14,165,233))
                  d.rounded_rectangle((cx-10*scale,cy-43*scale,cx+72*scale,cy-20*scale),7*scale,fill=(7,89,133))
                  d.rounded_rectangle((cx-10*scale,cy-5*scale,cx+55*scale,cy+18*scale),7*scale,fill=(56,189,248))

          def make_png(path, title, cat, category=False):
              c1,c2=palettes.get(cat,palettes['Utilities & Productivity'])
              im=gradient((640,360),c1,c2)
              d=ImageDraw.Draw(im)
              # Decorative circles and soft panels.
              d.ellipse((470,-70,720,180),fill=tuple(min(255,x+25) for x in c2))
              d.ellipse((-90,250,150,490),fill=tuple(min(255,x+15) for x in c1))
              draw_icon(d,cat,320,155,1.0)
              # Bottom translucent label panel.
              d.rounded_rectangle((24,282,616,338),16,fill=(255,255,255))
              label=title if len(title)<=31 else title[:29]+'…'
              bb=d.textbbox((0,0),label,font=font_mid); tw=bb[2]-bb[0]
              d.text(((640-tw)/2,294),label,font=font_mid,fill=(10,35,88))
              d.text((28,28),cat.upper(),font=font_small,fill='white')
              im.save(path,'PNG',optimize=True)

          # Generate one category hero image per accordion.
          for cat in soup.select('.accordion-category'):
              h=cat.select_one('.category-title')
              if not h: continue
              name=h.get_text(' ',strip=True)
              p=cat.select_one('.category-icon img')
              if p:
                  fn=f'category-thumbnails/{slug(name)}.png'
                  make_png(cat_dir/f'{slug(name)}.png',name,name,True)
                  p['src']=fn
                  p['alt']=name+' category'

          # Generate a distinct, colourful PNG for every tool card in trending and categories.
          seen=set()
          for a in soup.select('a.tool-card, a.category-tool'):
              href=a.get('href','')
              img=a.select_one('img')
              title=(a.select_one('h3') or a.select_one('strong'))
              if not img or not title or not href: continue
              name=title.get_text(' ',strip=True)
              cat=category_for_tool(a)
              key=href.split('#')[0]
              fn=f'tool-thumbnails/{slug(key)}.png'
              if key not in seen:
                  make_png(tool_dir/f'{slug(key)}.png',name,cat)
                  seen.add(key)
              img['src']=fn
              img['alt']=name+' colourful preview'

          HTML_PATH.write_text(str(soup),encoding='utf-8')
          print('Generated',len(seen),'tool thumbnails and',len(list(cat_dir.glob('*.png'))),'category thumbnails')
          PY
          python build_thumbnails.py
      - name: Commit changes and remove temporary workflow
        run: |
          rm -f build_thumbnails.py .github/workflows/temp-csc-colorful-thumbnails.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A free-csc-tools .github/workflows/temp-csc-colorful-thumbnails.yml
          git commit -m 'Use colorful category-based PNG thumbnails for CSC tools'
          git push
