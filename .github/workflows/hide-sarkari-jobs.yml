name: Temporarily Hide Sarkari Jobs Button
on:
  push:
    paths:
      - ".github/workflows/hide-sarkari-jobs.yml"
permissions:
  contents: write
jobs:
  hide-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide hero button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '<a href="government-job-update/onestop-updates.html"><span>📢</span>Latest Sarkari Jobs</a>'
          new = '<a href="government-job-update/onestop-updates.html" style="display:none!important" aria-hidden="true" tabindex="-1"><span>📢</span>Latest Sarkari Jobs</a>'
          if old not in s:
              raise SystemExit("Target button not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Temporarily hide Latest Sarkari Jobs button"
          git push
