name: Deploy ONESTOP Native Blue White UI

on:
  push:
    branches:
      - feature/native-blue-white-ui-20260911

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply shared ONESTOP UI theme
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          css = 'onestop-native-ui.css'
          if not Path(css).exists():
              raise SystemExit('Safety check failed: shared theme missing')

          targets = []
          # Root-level utility/tool pages.
          excluded = {
              'index.html','ui-demo.html','ui-v2.html','non-stop-jap.html',
              'ONESTOP_SOCIAL_MEDIA_POST_MAKER_FREE_V14_CLEAN.html'
          }
          for p in root.glob('*.html'):
              if p.name not in excluded:
                  targets.append(p)
          # The games landing page and all individual games.
          for base in [root/'games', root/'games'/'relax', root/'audio-tools']:
              if base.exists():
                  targets.extend(base.rglob('*.html'))
          # Free Tools landing page is included explicitly.
          for p in [root/'free-tools.html', root/'free-online-games.html']:
              if p.exists() and p not in targets:
                  targets.append(p)

          changed = 0
          for p in sorted(set(targets)):
              s = p.read_text(encoding='utf-8')
              if 'onestop-native-ui.css' in s:
                  continue
              if '</head>' not in s.lower():
                  raise SystemExit(f'Safety check failed: missing </head> in {p}')
              depth = len(p.parent.relative_to(root).parts)
              href = ('../' * depth) + css
              link = f'<link rel="stylesheet" href="{href}">'
              pos = s.lower().find('</head>')
              s = s[:pos] + link + s[pos:]
              p.write_text(s, encoding='utf-8')
              changed += 1

          print(f'Themed {changed} HTML pages')
          PY

      - name: Commit theme rollout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'games/**/*.html' 'games/relax/**/*.html' 'audio-tools/**/*.html' || true
          git commit -m "Apply native ONESTOP blue white UI theme" || echo "No HTML changes needed"
          git push
