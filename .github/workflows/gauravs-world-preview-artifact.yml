name: Gaurav's World — Isolated Preview Artifact

on:
  workflow_dispatch:

# This workflow intentionally does NOT deploy to GitHub Pages, change Pages settings,
# touch the custom domain, or push to the production branch. It only packages the
# Gaurav's World static site from this automation branch as a downloadable artifact.
permissions:
  contents: read

concurrency:
  group: gauravs-world-preview-artifact
  cancel-in-progress: false

jobs:
  package-preview:
    name: Validate and package preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout automation branch only
        uses: actions/checkout@v4
        with:
          ref: gauravs-world-automation
          persist-credentials: false

      - name: Verify expected site entry files
        shell: bash
        run: |
          set -euo pipefail
          test -f gauravs-world/index.html
          test -f gauravs-world/article.html
          test -f gauravs-world/assets/style.css
          test -f gauravs-world/assets/app.js
          echo "Required Gaurav's World files are present."

      - name: Prepare isolated preview package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-package
          cp -a gauravs-world/. preview-package/
          printf 'Preview source branch: gauravs-world-automation\n' > preview-package/PREVIEW-INFO.txt
          printf 'This package is not a production deployment.\n' >> preview-package/PREVIEW-INFO.txt
          cd preview-package
          zip -qr ../gauravs-world-preview.zip .

      - name: Upload preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gauravs-world-preview-${{ github.run_number }}
          path: gauravs-world-preview.zip
          if-no-files-found: error
          retention-days: 14
