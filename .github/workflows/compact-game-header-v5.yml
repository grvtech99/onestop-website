name: Mobile Game Focus V5
on:
  push:
    paths: ['.github/workflows/compact-game-header-v5.yml']
jobs:
  compact:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact mobile game layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          names='01-reaction-rush 02-color-match 03-2048-neon 04-whack-a-mole 05-space-dodge 06-memory-match 07-brick-breaker 08-number-ninja 09-fruit-catch 10-word-scramble 11-math-master 12-science-quiz 13-geography-explorer 14-english-vocabulary 15-typing-academy 16-money-smart 17-element-challenge 18-logic-sequence 19-history-challenge 20-computer-genius'.split()
          css='''<style id="onestop-mobile-focus-v5">@media(max-width:650px){.topin{padding:4px 7px!important;height:36px!important}.brand{font-size:11px!important}.back{font-size:7px!important;padding:4px 5px!important}.page{padding:4px!important}.credit{height:30px!important;min-height:30px!important;margin:0 auto 3px!important;padding:2px 5px!important;gap:4px!important;border-radius:9px!important}.credit:before{display:none!important}.credit img{width:24px!important;height:24px!important;flex:0 0 24px!important}.credit small{font-size:5px!important}.credit strong{font-size:8.5px!important;line-height:1!important}.hero .tag{font-size:6px!important;padding:2px 5px!important}.hero h1{font-size:20px!important;line-height:1!important;margin:2px 0!important}.hero p{display:none!important}.gamebox,.box{border-radius:12px!important}.panel{border-radius:11px!important}.hud{gap:2px!important;padding:2px!important}.h{min-height:32px!important;padding:3px 2px!important;border-radius:6px!important}.h small{font-size:5px!important}.h b{font-size:12px!important;line-height:1!important}.stage{width:100%!important;height:clamp(480px,84svh,760px)!important;min-height:480px!important;max-height:760px!important;padding:0!important;overflow:hidden!important}.stage canvas{width:100%!important;height:100%!important;display:block!important}.info{display:none!important}}@media(max-width:430px){.stage{height:clamp(470px,86svh,740px)!important;min-height:470px!important}.credit{height:29px!important;min-height:29px!important}.credit img{width:23px!important;height:23px!important;flex-basis:23px!important}.credit strong{font-size:8px!important}.hero h1{font-size:19px!important}} </style>'''
          for n in names:
            p=Path('games')/(n+'.html'); t=p.read_text(encoding='utf-8')
            if 'onestop-mobile-focus-v5' not in t: p.write_text(t.replace('</head>',css+'</head>',1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'ONESTOP Mobile Layout Bot'; git config user.email 'actions@users.noreply.github.com'
          git add games/*.html
          git commit -m 'Optimize mobile game screen for gameplay [skip ci]' || true
          git push
