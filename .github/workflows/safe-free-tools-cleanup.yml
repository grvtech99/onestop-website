name: One-time Free Tools cleanup and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  cleanup-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe Free Tools cleanup
        shell: python
        run: |
          from pathlib import Path
          p = Path('free-tools.html')
          s = p.read_text(encoding='utf-8')
          old = "  // Make the first category gently expanded on desktop for immediate discovery.\n  if(window.innerWidth>700&&cats[0])cats[0].classList.add('open');\n"
          new = "  // Keep all tool categories closed by default for a clean, scannable landing page.\n"
          if old not in s:
              raise SystemExit('Expected accordion auto-open block was not found; no change made.')
          s = s.replace(old, new, 1)
          s = s.replace('<meta name=\"theme-color\" content=\"#070916\">', '<meta name=\"theme-color\" content=\"#0757c9\">', 1)
          p.write_text(s, encoding='utf-8')

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/safe-free-tools-cleanup.yml

      - name: Commit cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add free-tools.html .github/workflows/safe-free-tools-cleanup.yml
          git diff --cached --quiet && { echo 'No changes to commit.'; exit 0; }
          git commit -m 'Keep Free Tools categories closed by default'
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
