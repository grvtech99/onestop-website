name: Temp CSC Realistic UI Fix
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Apply realistic thumbnails and accordion
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import re

          path = Path('free-csc-tools/index.html')
          html = path.read_text(encoding='utf-8')
          soup = BeautifulSoup(html, 'html.parser')
          thumb_dir = Path('free-csc-tools/tool-thumbnails')

          def shot_for_href(href):
              if not href:
                  return None
              href = href.split('#')[0].split('?')[0]
              if href.startswith('http://') or href.startswith('https://') or href.startswith('../'):
                  return None
              p = href.lstrip('./')
              stem = re.sub(r'[^a-zA-Z0-9]+', '-', p).strip('-').lower()
              if not stem.endswith('-html'):
                  stem += '-html'
              f = thumb_dir / (stem + '.png')
              return f if f.exists() else None

          for card in soup.select('.tool-card'):
              link = card.select_one('a.tool-open[href]') or card.select_one('a[href]')
              shot = shot_for_href(link.get('href') if link else None)
              thumb = card.select_one('.thumb')
              if shot and thumb:
                  thumb.clear()
                  img = soup.new_tag('img', src='tool-thumbnails/' + shot.name, alt='Real preview of ' + (card.select_one('h3').get_text(' ', strip=True) if card.select_one('h3') else 'tool'), loading='lazy')
                  thumb.append(img)
                  thumb['class'] = ['thumb','real-thumb']

          for idx, cat in enumerate(soup.select('.category')):
              head = cat.select_one('.category-head')
              tools = cat.select_one('.category-tools')
              if not head or not tools:
                  continue
              cat_id = f'csc-category-{idx+1}'
              cat['data-category'] = cat_id
              cat['class'] = [c for c in cat.get('class', []) if c not in ('open','accordion-category')] + ['accordion-category']
              tools['id'] = cat_id + '-tools'
              tools['class'] = [c for c in tools.get('class', []) if c != 'accordion-tools'] + ['accordion-tools']
              tools['hidden'] = True

              # Rebuild the header control so clicking anywhere on the header opens the category.
              old = head.select_one('.category-toggle')
              if old:
                  old.decompose()
              title = head.select_one('h3')
              desc = head.select_one('p')
              if title:
                  title['class'] = list(title.get('class', [])) + ['category-title']
                  title_html = str(title.extract())
              else:
                  title_html = ''
              desc_html = str(desc.extract()) if desc else ''
              button = soup.new_tag('button', type='button', **{'class':'category-toggle','aria-expanded':'false','aria-controls':tools['id']})
              label = soup.new_tag('span', **{'class':'toggle-label'})
              label.append(BeautifulSoup(title_html + desc_html, 'html.parser'))
              button.append(label)
              chevron = soup.new_tag('span', **{'class':'toggle-chevron'})
              chevron.string = '⌄'
              button.append(chevron)
              head.append(button)

              for tool in tools.select('.category-tool'):
                  link = tool if tool.name == 'a' else tool.select_one('a[href]')
                  href = link.get('href') if link else None
                  shot = shot_for_href(href)
                  old_thumb = tool.select_one('.category-thumb')
                  if shot:
                      if old_thumb:
                          old_thumb.clear()
                          img = soup.new_tag('img', src='tool-thumbnails/' + shot.name, alt='Tool preview', loading='lazy')
                          old_thumb.append(img)
                          old_thumb['class'] = ['category-thumb','real-category-thumb']
                      else:
                          thumb = soup.new_tag('span', **{'class':'category-thumb','real-category-thumb':True})
                          thumb['class'] = ['category-thumb','real-category-thumb']
                          thumb.append(soup.new_tag('img', src='tool-thumbnails/' + shot.name, alt='Tool preview', loading='lazy'))
                          tool.insert(0, thumb)
                  tool['class'] = list(dict.fromkeys(list(tool.get('class', [])) + ['screenshot-tool']))

          style = soup.new_tag('style')
          style.string = r'''
          /* FINAL REALISTIC CSC TOOL UI */
          .real-thumb{padding:0!important;background:#eef5ff!important;display:block!important;height:150px!important}
          .real-thumb:before,.real-thumb:after{display:none!important}.real-thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
          .tool-card:hover .real-thumb img{transform:scale(1.025);transition:transform .25s ease}
          .accordion-category{grid-column:1/-1;border-radius:20px;margin-bottom:16px;overflow:hidden}
          .accordion-category .category-head{padding:0!important;display:flex;align-items:stretch;min-height:138px;position:relative}
          .accordion-category .category-icon{margin:22px 18px;flex:0 0 58px;width:58px;height:58px}
          .accordion-category .category-toggle{border:0;background:transparent;cursor:pointer;flex:1;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px 22px 0;color:inherit}
          .accordion-category .toggle-label{display:block}.accordion-category .category-title{display:block;font-size:22px!important;color:var(--dark)}.accordion-category .category-title+p{display:block;margin-top:5px}
          .accordion-category .toggle-chevron{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid #dbe8f8;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex:0 0 42px;transition:transform .2s ease}
          .accordion-category.open .toggle-chevron{transform:rotate(180deg)}.accordion-tools[hidden]{display:none!important}
          .accordion-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:18px;background:#fff}
          .accordion-tools .screenshot-tool{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0!important;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;min-height:205px;box-shadow:0 4px 14px rgba(20,33,61,.05);transition:.2s}
          .accordion-tools .screenshot-tool:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,33,61,.1);background:#fff}
          .accordion-tools .real-category-thumb{width:100%!important;height:112px!important;flex:0 0 112px!important;border:0!important;border-radius:0!important;background:#eef5ff!important;display:block!important;padding:0!important;overflow:hidden}
          .accordion-tools .real-category-thumb:before,.accordion-tools .real-category-thumb:after{display:none!important}.accordion-tools .real-category-thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
          .accordion-tools .screenshot-tool strong{padding:11px 12px 3px;font-size:13px;line-height:1.25}.accordion-tools .screenshot-tool small{padding:0 12px 9px;font-size:10px;line-height:1.3}
          .accordion-tools .screenshot-tool .arrow{margin-left:auto;margin-right:12px;margin-bottom:10px;width:26px;height:26px;border-radius:50%;background:#eaf3ff;display:flex;align-items:center;justify-content:center}
          .accordion-category .category-more{display:none!important}
          @media(max-width:1000px){.accordion-tools{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.accordion-tools{grid-template-columns:repeat(2,minmax(0,1fr))}.accordion-category .category-head{min-height:112px}.accordion-category .category-icon{margin:18px 12px}.accordion-category .category-toggle{padding-right:14px}.accordion-category .category-title{font-size:18px!important}}@media(max-width:480px){.accordion-tools{grid-template-columns:1fr}.accordion-category .category-head{min-height:100px}.accordion-category .category-icon{flex-basis:48px;width:48px;height:48px;margin:16px 10px}.accordion-category .toggle-chevron{width:34px;height:34px;flex-basis:34px}}
          '''
          soup.head.append(style)

          script = soup.new_tag('script')
          script.string = r'''
          document.querySelectorAll('.accordion-category .category-toggle').forEach(function(btn){btn.addEventListener('click',function(){var cat=btn.closest('.accordion-category');var tools=document.getElementById(btn.getAttribute('aria-controls'));var open=btn.getAttribute('aria-expanded')==='true';document.querySelectorAll('.accordion-category.open').forEach(function(other){if(other!==cat){other.classList.remove('open');var b=other.querySelector('.category-toggle');var t=other.querySelector('.accordion-tools');if(b)b.setAttribute('aria-expanded','false');if(t)t.hidden=true;}});btn.setAttribute('aria-expanded',String(!open));cat.classList.toggle('open',!open);tools.hidden=open;if(!open)setTimeout(function(){cat.scrollIntoView({behavior:'smooth',block:'start'});},80);});});
          '''
          soup.body.append(script)
          path.write_text(str(soup), encoding='utf-8')
          print('Applied realistic screenshot thumbnails and working category accordion.')
          PY
      - name: Commit live change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-csc-tools/index.html
          git rm .github/workflows/temp-csc-realistic-ui-fix.yml
          git commit -m "Use realistic CSC screenshots with category accordion"
          git push origin main
