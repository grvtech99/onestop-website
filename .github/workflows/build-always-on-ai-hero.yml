name: Build Always-On AI hero WebP
on:
  push:
    paths:
      - 'gauravs-world/images/always-on-ai-agents-hero.svg'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WebP
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image
          cairosvg.svg2png(url='gauravs-world/images/always-on-ai-agents-hero.svg', write_to='/tmp/hero.png', output_width=1280, output_height=720)
          im=Image.open('/tmp/hero.png').convert('RGB')
          im.save('gauravs-world/images/always-on-ai-agents-hero.webp','WEBP',quality=88,method=6)
          PY
      - name: Commit WebP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gauravs-world/images/always-on-ai-agents-hero.webp
          git commit -m "Add Always-On AI Agents hero WebP" || exit 0
          git push
