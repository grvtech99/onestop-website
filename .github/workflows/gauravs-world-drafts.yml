name: Gaurav's World — News Review Drafts

on:
  # Initial rollout is manual-only to avoid unexpected API usage.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gauravs-world-news-review
  cancel-in-progress: false

jobs:
  collect-generate-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: gauravs-world-automation
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Hindi and English RSS candidates
        run: python automation/gauravs-world/scripts/rss_digest.py

      - name: Validate links and remove duplicate candidates
        run: python automation/gauravs-world/scripts/validate_candidates.py

      - name: Generate bilingual drafts and AI cover images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MAX_DRAFTS_PER_RUN: '3'
        run: python automation/gauravs-world/scripts/run.py

      - name: Commit review drafts and images to automation branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/gauravs-world/output automation/gauravs-world/images
          if git diff --cached --quiet; then
            echo "No generated files to commit."
          else
            git commit -m "chore(automation): save review drafts and generated images"
            git push origin HEAD:gauravs-world-automation
          fi

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauravs-world-review-drafts-${{ github.run_number }}
          path: |
            automation/gauravs-world/output/
            automation/gauravs-world/images/
          if-no-files-found: warn
          retention-days: 30
