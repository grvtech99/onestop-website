name: Government Job Update — One-Time Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Migrate government job project into one folder
        shell: bash
        run: |
          set -euo pipefail
          ROOT="government-job-update"
          if [ -f "$ROOT/README.md" ]; then
            echo "Migration already completed."
            exit 0
          fi
          mkdir -p "$ROOT/scripts" "$ROOT/data" "$ROOT/docs"

          if [ -d data ]; then
            find data -mindepth 1 -maxdepth 1 -exec git mv {} "$ROOT/data/" \;
            rmdir data || true
          fi
          if [ -d scripts ]; then
            find scripts -mindepth 1 -maxdepth 1 -exec git mv {} "$ROOT/scripts/" \;
            rmdir scripts || true
          fi

          for f in \
            GOVERNMENT-JOB-UPDATE-OPERATIONS.md \
            onestop-government-admin.html \
            onestop-government-draft-dashboard.html \
            onestop-government-updates-v3.css \
            onestop-update-review-queue.html \
            onestop-updates-data.js \
            onestop-updates-publish.html \
            onestop-updates-review-queue.html \
            onestop-updates-review.html \
            onestop-updates-verified-drafts.html \
            onestop-updates.html; do
            if [ -f "$f" ]; then git mv "$f" "$ROOT/$(basename "$f")"; fi
          done

          for f in onestop-visual-polish-v2.css onestop-native-ui.css onestop_logo.png; do
            if [ -f "$f" ]; then cp -f "$f" "$ROOT/$f"; fi
          done

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="onestop-updates.html"', 'href="government-job-update/onestop-updates.html"')
          p.write_text(s, encoding='utf-8')
          PY

          for f in .github/workflows/*government*.yml .github/workflows/*government*.yaml; do
            [ -e "$f" ] || continue
            case "$f" in
              .github/workflows/government-job-update-migration.yml) continue ;;
            esac
            git rm -f "$f"
          done

          cat > "$ROOT/README.md" <<'EOF'
          # ONESTOP Government Job Update

          This folder is the portable home of the Government Job Update project.

          - SarkariResult is the only discovery source.
          - Official government/recruitment authority pages are the final verification source.
          - FreeJobAlert and other aggregators are not used.
          - New/changed items are processed incrementally.
          - Missing, conflicting, inaccessible, or ambiguous official evidence is held; it is never auto-published.
          - HTTP 402/403/429 and similar access-control responses are treated as source-unavailable.
          - No bypass, CAPTCHA bypass, proxy rotation, fingerprint spoofing, hidden endpoint, or aggressive crawling is used.

          All Government Job Update code, data, UI, scripts and documentation live under this folder. The only repository-root exception is the small GitHub Actions entry workflow required by GitHub to discover scheduled workflows.
          EOF

          cat > "$ROOT/data/sarkariresult-monitor-state.json" <<'EOF'
          {
            "schemaVersion": 1,
            "source": "sarkariresult",
            "sourceUrl": "https://www.sarkariresult.com/",
            "status": "not_run",
            "lastCheckedAt": null,
            "lastSuccessfulDiscoveryAt": null,
            "lastError": null,
            "items": {}
          }
          EOF

          cat > "$ROOT/data/sarkariresult-policy.json" <<'EOF'
          {
            "schemaVersion": 1,
            "discoverySource": {
              "id": "sarkariresult",
              "url": "https://www.sarkariresult.com/",
              "mode": "discovery_only",
              "officialSourceRequiredBeforePublication": true
            },
            "excludedSources": ["freejobalert", "other_aggregators"],
            "accessPolicy": {
              "respectRobotsTxt": true,
              "no403Bypass": true,
              "no402Bypass": true,
              "noCaptchaBypass": true,
              "noProxyRotation": true,
              "noFingerprintSpoofing": true,
              "noHiddenEndpoints": true,
              "noAggressiveCrawling": true
            },
            "publication": {
              "autoPublishOnlyAfterOfficialVerification": true,
              "holdOnConflict": true,
              "holdOnMissingOfficialSource": true,
              "holdOnAmbiguousExtraction": true
            }
          }
          EOF

          cat > "$ROOT/scripts/sarkariresult-monitor.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import hashlib, json, sys, urllib.error, urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          ROOT = Path(__file__).resolve().parents[1]
          DATA = ROOT / "data"
          STATE_FILE = DATA / "sarkariresult-monitor-state.json"
          POLICY_FILE = DATA / "sarkariresult-policy.json"
          LOG_FILE = DATA / "sarkariresult-monitor-log.json"
          BASE = "https://www.sarkariresult.com/"
          ROBOTS = urljoin(BASE, "robots.txt")
          SITEMAP = urljoin(BASE, "sitemap.xml")
          RSS = urljoin(BASE, "feed_rss.xml")
          USER_AGENT = "ONESTOP-Government-Job-Update/1.0"
          TIMEOUT = 20
          MAX_SITEMAPS = 5
          MAX_URLS = 500

          def now(): return datetime.now(timezone.utc).isoformat()
          def load(path, default):
              try: return json.loads(path.read_text(encoding="utf-8"))
              except Exception: return default
          def save(path, value): path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT, "Accept": "text/html,application/xml,text/xml,text/plain;q=0.9,*/*;q=0.1"})
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      return {"ok": True, "status": getattr(r, "status", 200), "url": r.geturl(), "body": r.read(2_000_000)}
              except urllib.error.HTTPError as e:
                  return {"ok": False, "status": e.code, "url": url, "body": b"", "error": f"HTTP {e.code}"}
              except Exception as e:
                  return {"ok": False, "status": None, "url": url, "body": b"", "error": str(e)[:300]}
          def robots_rules(text):
              groups=[]; agents=[]; rules=[]
              for raw in text.splitlines():
                  line=raw.split('#',1)[0].strip()
                  if not line or ':' not in line: continue
                  k,v=line.split(':',1); k=k.strip().lower(); v=v.strip()
                  if k=='user-agent':
                      if agents: groups.append((agents,rules))
                      agents=[v.lower()]; rules=[]
                  elif k in ('allow','disallow') and agents: rules.append((k,v))
              if agents: groups.append((agents,rules))
              out=[]
              for a,r in groups:
                  if '*' in a or USER_AGENT.lower() in a: out.extend(r)
              return out
          def allowed(url, rules):
              path=urlparse(url).path or '/'; best=None; n=-1
              for action,rule in rules:
                  if rule and path.startswith(rule) and len(rule)>n: best=action; n=len(rule)
              return best != 'disallow'
          def locs(blob):
              out=[]
              try:
                  root=ET.fromstring(blob)
                  for el in root.iter():
                      if el.tag.rsplit('}',1)[-1]=='loc' and el.text: out.append(el.text.strip())
              except ET.ParseError: pass
              return out
          def rss_items(blob):
              out=[]
              try:
                  root=ET.fromstring(blob)
                  for item in root.iter():
                      if item.tag.rsplit('}',1)[-1] != 'item': continue
                      d={}
                      for c in item:
                          if c.text: d[c.tag.rsplit('}',1)[-1]]=c.text.strip()
                      if d.get('link'): out.append({'url':d['link'],'title':d.get('title',''),'published':d.get('pubDate','')})
              except ET.ParseError: pass
              return out
          def main():
              state=load(STATE_FILE, {'schemaVersion':1,'source':'sarkariresult','items':{}})
              checked=now(); log={'checkedAt':checked,'source':BASE,'status':'unknown','rss':0,'sitemap':0,'new':0,'changed':0,'error':None}
              rb=fetch(ROBOTS)
              if not rb['ok']:
                  log.update(status='source_unavailable',error=rb.get('error','robots.txt unavailable'))
                  state.update(status=log['status'],lastCheckedAt=checked,lastError=log['error']); save(STATE_FILE,state); save(LOG_FILE,log); print(json.dumps(log)); return 0
              rules=robots_rules(rb['body'].decode('utf-8','replace'))
              if not allowed(BASE,rules):
                  log.update(status='robots_blocked',error='robots.txt disallows this monitor')
                  state.update(status=log['status'],lastCheckedAt=checked,lastError=log['error']); save(STATE_FILE,state); save(LOG_FILE,log); print(json.dumps(log)); return 0
              discovered=[]
              rr=fetch(RSS)
              if rr['ok']:
                  discovered.extend(rss_items(rr['body'])); log['rss']=len(discovered)
              else: log['rssStatus']=rr.get('status')
              sm=fetch(SITEMAP)
              if sm['ok']:
                  urls=locs(sm['body'])
                  for u in urls[:MAX_SITEMAPS]:
                      if u.rstrip('/')==SITEMAP.rstrip('/'): continue
                      cr=fetch(u)
                      if cr['ok']:
                          discovered.extend({'url':x,'title':'','published':''} for x in locs(cr['body']))
                  if not urls or b'<urlset' in sm['body'][:5000].lower(): discovered.extend({'url':x,'title':'','published':''} for x in urls)
                  log['sitemap']=len(discovered)
              else: log['sitemapStatus']=sm.get('status')
              unique={i.get('url'):i for i in discovered if i.get('url','').startswith(BASE)}
              discovered=list(unique.values())[:MAX_URLS]
              if not discovered:
                  log.update(status='source_unavailable',error='No public RSS/sitemap discovery items were accessible in this cycle')
                  state.update(status=log['status'],lastCheckedAt=checked,lastError=log['error']); save(STATE_FILE,state); save(LOG_FILE,log); print(json.dumps(log)); return 0
              old=state.get('items',{}); new_items={}
              for item in discovered:
                  url=item['url']; key=hashlib.sha256(url.encode()).hexdigest()[:24]
                  fp=hashlib.sha256(json.dumps(item,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
                  if key not in old: log['new']+=1
                  elif old[key].get('fingerprint')!=fp: log['changed']+=1
                  new_items[key]={**item,'id':key,'fingerprint':fp,'discoveredAt':checked}
              state.update(status='ok',lastCheckedAt=checked,lastSuccessfulDiscoveryAt=checked,lastError=None,items=new_items)
              save(STATE_FILE,state); save(LOG_FILE,log); print(json.dumps(log,ensure_ascii=False)); return 0
          if __name__=='__main__': sys.exit(main())
          PY
          chmod +x "$ROOT/scripts/sarkariresult-monitor.py"

          cat > .github/workflows/government-job-update.yml <<'EOF'
          name: Government Job Update — SarkariResult Discovery
          on:
            schedule:
              - cron: '17 * * * *'
                timezone: 'Asia/Kolkata'
            workflow_dispatch:
          permissions:
            contents: write
          concurrency:
            group: government-job-update
            cancel-in-progress: false
          jobs:
            discover-and-verify:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v6
                  with:
                    fetch-depth: 0
                - name: Run safe SarkariResult discovery
                  run: python government-job-update/scripts/sarkariresult-monitor.py
                - name: Commit discovery state
                  shell: bash
                  run: |
                    set -euo pipefail
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add government-job-update/data/sarkariresult-monitor-state.json government-job-update/data/sarkariresult-monitor-log.json
                    if git diff --cached --quiet; then echo "No discovery state change."; exit 0; fi
                    git commit -m "Update SarkariResult discovery state"
                    git push
          EOF

          git rm -f .github/workflows/government-job-update-migration.yml
          git add -A
          git commit -m "Organize government job project and replace legacy workflows"
          git push
