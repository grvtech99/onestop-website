name: ONESTOP Speed Widget Live Test Fix
on:
  push:
    branches:
      - feature/speed-widget-live-test-20260910
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Safely switch widget script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="onestop-speed-widget.js" defer></script>'
          new='<script src="onestop-speed-widget-v2.js" defer></script>'
          if new in s:
              print('v2 already active')
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Expected widget script tag not found')
          for required in ['const SCRIPT_URL=','id="admissionForm"','id="receiptOverlay"']:
              if required not in s:
                  raise SystemExit('Safety check failed: '+required)
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Switched to cache-busted v2 widget')
          PY
      - name: Validate
        run: |
          grep -q 'onestop-speed-widget-v2.js' index.html
          grep -q 'const SCRIPT_URL=' index.html
          grep -q 'id="admissionForm"' index.html
          grep -q 'id="receiptOverlay"' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix speed widget hero clipping in test'
          git push