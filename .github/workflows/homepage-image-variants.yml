name: Homepage and Article Image Variants
on:
  push:
    paths:
      - 'gauravs-world/data/articles.json'
      - 'gauravs-world/data/articles/**'
      - 'gauravs-world/images/**'
      - '!gauravs-world/images/optimized/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - name: Generate responsive WebP variants
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),sharp=require('sharp');
          const root='gauravs-world';
          const index=JSON.parse(fs.readFileSync(path.join(root,'data/articles.json'),'utf8'));
          const sources=new Set();
          const add=(v)=>{
            const p=String(v||'').trim();
            if(/^images\/[A-Za-z0-9][A-Za-z0-9._\/-]*\.(?:webp|png|jpe?g|svg)$/i.test(p)) sources.add(p);
          };
          (index.articles||[]).forEach(a=>add(a.image||a.coverImage));
          const dir=path.join(root,'data/articles');
          if(fs.existsSync(dir)){
            for(const file of fs.readdirSync(dir)){
              if(!file.endsWith('.json')) continue;
              try{
                const a=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
                add(a.image||a.coverImage);
              }catch(_){}
            }
          }
          (async()=>{
            const out=path.join(root,'images/optimized');
            fs.mkdirSync(out,{recursive:true});
            const targets=[480,800,1200];
            for(const rel of sources){
              const src=path.join(root,rel);
              if(!fs.existsSync(src)) continue;
              const b=path.basename(rel,path.extname(rel));
              for(const width of targets){
                let result=null;
                for(const q of [80,74,68,62,56,50,44,38]){
                  result=await sharp(src).resize({
                    width,height:Math.round(width*9/16),fit:'cover',position:'centre',withoutEnlargement:true
                  }).webp({quality:q,effort:6}).toBuffer();
                  if(result.length<=100*1024) break;
                }
                let actualWidth=width;
                while(result.length>100*1024 && actualWidth>360){
                  actualWidth=Math.round(actualWidth*0.9);
                  result=await sharp(src).resize({
                    width:actualWidth,height:Math.round(actualWidth*9/16),fit:'cover',position:'centre',withoutEnlargement:true
                  }).webp({quality:38,effort:6}).toBuffer();
                }
                fs.writeFileSync(path.join(out,b+'-'+width+'.webp'),result);
              }
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit generated variants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gauravs-world/images/optimized
          git diff --cached --quiet || git commit -m "Optimize article and homepage image variants"
          git push
