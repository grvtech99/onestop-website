name: Deploy Free Tools V3

on:
  push:
    branches:
      - feature/free-tools-v3-20260911

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade free-tools.html to V3 UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('free-tools.html')
          s = p.read_text(encoding='utf-8')
          if 'ONESTOP FREE TOOLS V3' in s:
              raise SystemExit('V3 already present')
          required = ['class="categories"', 'id="search"', 'class="credit"', '</head>', '</body>']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Safety check failed: missing ' + ', '.join(missing))

          css = r'''<style id="onestop-free-tools-v3">
          :root{--v3-bg:#070a16;--v3-panel:#10162d;--v3-panel2:#0c1227;--v3-line:rgba(255,255,255,.09);--v3-text:#f7f9ff;--v3-muted:#9da8c7;--v3-cyan:#39e7ff;--v3-blue:#6c7cff;--v3-green:#65f6a2;--v3-shadow:0 18px 55px rgba(0,0,0,.28)}
          html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
          body{background:radial-gradient(900px 420px at 8% -8%,rgba(57,231,255,.13),transparent 60%),radial-gradient(850px 420px at 92% -10%,rgba(108,124,255,.16),transparent 60%),linear-gradient(180deg,#080b18 0%,#060813 100%);font-size:15px}
          .top{height:68px;background:rgba(7,10,22,.78);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:20;backdrop-filter:blur(18px)}
          .topin{max-width:1180px;padding:12px 20px}.brand{font-size:17px}.back{font-size:13px;padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.035);transition:.2s}.back:hover{border-color:rgba(57,231,255,.38);transform:translateY(-1px)}
          main{height:auto;max-width:1180px;padding:28px 20px 22px;display:block}
          .hero{position:relative;padding:18px 10px 8px}.tag{padding:7px 13px;font-size:11px;background:rgba(57,231,255,.07);box-shadow:0 0 28px rgba(57,231,255,.08)}
          h1{font-size:clamp(38px,5vw,62px);margin:13px 0 7px;letter-spacing:-2.1px;background:linear-gradient(90deg,#fff 10%,#cfd7ff 55%,#72f0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
          .hero p{font-size:15px;max-width:680px;margin-bottom:14px}.stats{gap:10px;margin-bottom:17px}.stat{font-size:12px;padding:8px 13px;border-radius:11px;background:rgba(16,22,45,.72);box-shadow:0 8px 22px rgba(0,0,0,.14)}
          .search{width:min(820px,100%);margin:0 auto 14px;position:relative}.search input{height:52px;padding:0 18px 0 18px;border-radius:15px;background:rgba(16,22,45,.9);border:1px solid rgba(255,255,255,.12);font-size:15px;box-shadow:0 14px 38px rgba(0,0,0,.22)}.search input:focus{border-color:rgba(57,231,255,.5);box-shadow:0 0 0 4px rgba(57,231,255,.08),0 14px 38px rgba(0,0,0,.22)}
          .v3-filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 auto 22px}.v3-filter{border:1px solid var(--v3-line);background:rgba(16,22,45,.72);color:var(--v3-muted);padding:8px 13px;border-radius:999px;font:700 12px inherit;cursor:pointer;transition:.2s}.v3-filter:hover,.v3-filter.active{color:#fff;border-color:rgba(57,231,255,.38);background:rgba(57,231,255,.08)}
          .v3-featured{margin:0 0 25px}.v3-section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 12px}.v3-section-title{font-size:18px;font-weight:850;letter-spacing:-.3px}.v3-section-sub{color:var(--v3-muted);font-size:12px}.v3-feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.v3-feature-card{display:flex;align-items:center;gap:11px;min-width:0;padding:13px;border:1px solid var(--v3-line);border-radius:14px;background:linear-gradient(145deg,rgba(18,25,52,.94),rgba(11,16,36,.94));text-decoration:none;color:#fff;box-shadow:var(--v3-shadow);transition:transform .2s,border-color .2s,background .2s}.v3-feature-card:hover{transform:translateY(-3px);border-color:rgba(57,231,255,.34);background:linear-gradient(145deg,rgba(22,32,65,.98),rgba(12,19,42,.98))}.v3-feature-icon{width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px;border-radius:12px;background:rgba(57,231,255,.08);font-size:21px}.v3-feature-info{min-width:0}.v3-feature-title{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v3-feature-desc{font-size:10px;color:var(--v3-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v3-go{margin-left:auto;color:var(--v3-cyan);font-size:10px;font-weight:800}
          .tools-area{overflow:visible;padding:0}.categories{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.category{border-radius:16px;background:linear-gradient(145deg,rgba(16,22,45,.96),rgba(10,15,33,.96));border-color:var(--v3-line);box-shadow:0 12px 34px rgba(0,0,0,.18);transition:border-color .2s,transform .2s}.category:hover{border-color:rgba(255,255,255,.15)}.category.open{border-color:rgba(57,231,255,.28)}
          .cat-head{padding:15px 16px;min-height:62px;font-size:14px}.cat-head>span:first-child{display:flex;align-items:center;gap:8px}.cat-head small{font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.045);margin-right:9px}.arrow{font-size:10px;color:#c7d0ed}.category.open .cat-head{background:rgba(57,231,255,.025)}
          .tool-list{padding:0 11px 11px;gap:8px}.tool{padding:10px 11px;border-radius:11px;background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.065);min-height:58px;transition:.18s}.tool:hover{transform:translateY(-1px);border-color:rgba(57,231,255,.32);background:rgba(57,231,255,.055)}.tool-icon{font-size:19px;width:25px;flex-basis:25px}.tool-title{font-size:12px}.tool-desc{font-size:10px}.open{font-size:9px}
          .category.v3-filter-hidden{display:none}.v3-featured.v3-hidden{display:none}.v3-empty{display:none;text-align:center;margin:20px 0;padding:35px 15px;color:var(--v3-muted);border:1px dashed rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.02)}
          .credit{font-size:11px;padding:28px 0 8px}.credit b{color:#aeb8d6}
          @media(max-width:900px){.v3-feature-grid{grid-template-columns:repeat(2,1fr)}}
          @media(max-width:700px){main{padding:20px 14px}.topin{padding:10px 14px}.hero{padding-top:10px}.categories{grid-template-columns:1fr}.v3-feature-grid{grid-template-columns:repeat(2,1fr)}h1{letter-spacing:-1.4px}.hero p{font-size:13px}.search input{height:48px}}
          @media(max-width:480px){.top{height:62px}.brand{font-size:14px}.back{font-size:11px;padding:8px 10px}.v3-feature-grid{grid-template-columns:1fr}.v3-feature-card{padding:12px}.cat-head{font-size:13px}.cat-head small{font-size:10px}.tool-list{grid-template-columns:1fr}.v3-section-head{align-items:start;flex-direction:column;gap:3px}}
          </style>'''

          js = r'''<script id="onestop-free-tools-v3">
          document.addEventListener('DOMContentLoaded',()=>{
            const hero=document.querySelector('.hero'), cats=[...document.querySelectorAll('.category')], area=document.querySelector('.tools-area');
            if(!hero||!area)return;
            hero.insertAdjacentHTML('beforeend','<div class="v3-filters" role="tablist" aria-label="Tool filters"><button class="v3-filter active" data-filter="all">All Tools</button><button class="v3-filter" data-filter="popular">⭐ Popular</button><button class="v3-filter" data-filter="live">🟢 Live Now</button><button class="v3-filter" data-filter="soon">🚀 Coming Soon</button></div>');
            const feature=document.createElement('section');feature.className='v3-featured';feature.innerHTML='<div class="v3-section-head"><div><div class="v3-section-title">⭐ Popular Tools</div><div class="v3-section-sub">Quick access to tools you can use right now</div></div></div><div class="v3-feature-grid"></div>';
            area.parentNode.insertBefore(feature,area);
            const grid=feature.querySelector('.v3-feature-grid');
            const picks=[];cats.forEach(c=>c.querySelectorAll('.tool:not(.soon)').forEach(t=>{if(picks.length<8)picks.push(t)}));
            picks.forEach(t=>{const a=t.cloneNode(true);a.className='v3-feature-card';a.removeAttribute('style');a.innerHTML='<span class="v3-feature-icon">'+(t.querySelector('.tool-icon')?.textContent||'🛠️')+'</span><span class="v3-feature-info"><span class="v3-feature-title">'+(t.querySelector('.tool-title')?.textContent||'Tool')+'</span><span class="v3-feature-desc">'+(t.querySelector('.tool-desc')?.textContent||'Free online tool')+'</span></span><span class="v3-go">OPEN →</span>';grid.appendChild(a)});
            const filters=[...document.querySelectorAll('.v3-filter')];
            const apply=(mode)=>{
              filters.forEach(b=>b.classList.toggle('active',b.dataset.filter===mode));
              feature.classList.toggle('v3-hidden',mode!=='all'&&mode!=='popular');
              cats.forEach(cat=>{
                const tools=[...cat.querySelectorAll('.tool')];
                let visible=0;
                tools.forEach(t=>{const soon=t.classList.contains('soon');const show=mode==='all'||mode==='live'&&!soon||mode==='soon'&&soon; t.style.display=show?'flex':'none'; if(show)visible++});
                cat.classList.toggle('v3-filter-hidden',mode!=='popular'&&visible===0);
                if(mode==='popular'||mode==='all'){tools.forEach(t=>t.style.display='flex');cat.classList.remove('v3-filter-hidden')}
              });
              if(mode==='popular'){cats.forEach(c=>c.classList.add('v3-filter-hidden'))}
            };
            filters.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.filter)));
            // Make the first category gently expanded on desktop for immediate discovery.
            if(window.innerWidth>700&&cats[0])cats[0].classList.add('open');
            // Repair accessibility state for existing accordion buttons.
            cats.forEach(c=>c.querySelector('.cat-head')?.setAttribute('aria-expanded',c.classList.contains('open')?'true':'false'));
          });
          </script>'''
          s=s.replace('</head>',css+js+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit V3 UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-tools.html
          git commit -m "Upgrade Free Tools page to V3 UI" || echo "No changes to commit"
          git push
