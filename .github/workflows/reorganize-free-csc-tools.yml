name: Reorganize Free CSC Tools
on:
  push:
    branches: [free-csc-tools-reorg]
permissions:
  contents: write
jobs:
  reorganize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-csc-tools-reorg
          fetch-depth: 0
      - name: Reorganize tool hierarchy
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil
          root=Path('.'); csc=root/'free-csc-tools'; csc.mkdir(exist_ok=True)
          for src_name in ['audio-tools','fast-print']:
              src=root/src_name; dst=csc/src_name
              if src.exists() and not dst.exists(): shutil.move(str(src),str(dst))
          calc=csc/'calculators'; calc.mkdir(exist_ok=True)
          for name in ['age-calculator.html','compound-interest-calculator.html','discount-calculator.html','emi-calculator.html','gst-calculator.html','percentage-calculator.html','profit-loss-calculator.html','salary-calculator.html','simple-interest-calculator.html','sip-calculator.html']:
              src=root/name; dst=calc/name
              if src.exists() and not dst.exists(): shutil.move(str(src),str(dst))
          pdf=csc/'pdf-tools'; pdf.mkdir(exist_ok=True)
          src=root/'onestop-pdf-tools.html'; dst=pdf/'onestop-pdf-tools.html'
          if src.exists() and not dst.exists(): shutil.move(str(src),str(dst))
          passport=csc/'passport'; passport.mkdir(exist_ok=True)
          for name in ['PASSPORT_PHOTO.webp','passport_id_icon.svg']:
              src=root/name; dst=passport/name
              if src.exists() and not dst.exists(): shutil.move(str(src),str(dst))
          src=csc/'onestop-free-passport-photo-maker.html'; dst=passport/'onestop-free-passport-photo-maker.html'
          if src.exists() and not dst.exists(): shutil.move(str(src),str(dst))
          social=csc/'social-media'; social.mkdir(exist_ok=True)
          for p in root.glob('ONESTOP_SOCIAL_MEDIA_POST_MAKER_FREE_*.html'):
              dst=social/p.name
              if not dst.exists(): shutil.move(str(p),str(dst))
          portal=csc/'index.html'
          if (root/'free-tools.html').exists() and not portal.exists(): shutil.move(str(root/'free-tools.html'),str(portal))
          game_css=root/'onestop-games-native-overrides.css'; game_dir=root/'free-online-games'; bridge=game_dir/'onestop-games-native-overrides.css'
          if game_css.exists():
              if bridge.exists(): bridge.unlink()
              shutil.move(str(game_css),str(bridge))
          for name in ['free-online-games.html','resume-maker-30-templates.html','non-stop-jap.html','onestop-fast-document-print-free-premium.html']:
              p=root/name
              if p.exists(): p.unlink()
          for rel in ['audio-tools/free-tools.html','audio-tools/onestop-native-ui.css','audio-tools/onestop-visual-polish-v2.css','free-online-games/onestop-native-ui.css','free-online-games/onestop-visual-polish-v2.css','free-one-click-resume/free-online-games.html','free-one-click-resume/onestop-native-ui.css','free-one-click-resume/onestop-visual-polish-v2.css']:
              p=root/rel
              if p.exists(): p.unlink()
          moved={}
          for p in calc.glob('*.html'): moved[p.name]='/free-csc-tools/calculators/'+p.name
          for p in (csc/'audio-tools').glob('*.html'): moved[p.name]='/free-csc-tools/audio-tools/'+p.name
          moved['onestop-pdf-tools.html']='/free-csc-tools/pdf-tools/onestop-pdf-tools.html'
          moved['onestop-free-passport-photo-maker.html']='/free-csc-tools/passport/onestop-free-passport-photo-maker.html'
          for p in (csc/'social-media').glob('*.html'): moved[p.name]='/free-csc-tools/social-media/'+p.name
          for p in (csc/'fast-print').rglob('*'):
              if p.is_file(): moved[('fast-print/'+p.relative_to(csc/'fast-print').as_posix())]='/free-csc-tools/fast-print/'+p.relative_to(csc/'fast-print').as_posix()
          moved['free-tools.html']='/free-csc-tools/index.html'
          moved['free-online-games.html']='/free-online-games/free-online-games.html'
          moved['resume-maker-30-templates.html']='/free-one-click-resume/resume-maker-30-templates.html'
          moved['non-stop-jap.html']='/non-stop-jap/non-stop-jap.html'
          moved['onestop-fast-document-print-free-premium.html']='/free-csc-tools/onestop-fast-document-print-free-premium.html'
          text_ext={'.html','.css','.js','.json','.md','.txt'}
          for p in [x for x in root.rglob('*') if x.is_file() and x.suffix.lower() in text_ext and '.git' not in x.parts]:
              try: s=p.read_text(encoding='utf-8')
              except Exception: continue
              original=s
              for old,new in sorted(moved.items(),key=lambda x:len(x[0]),reverse=True):
                  for a,b in [('href="','"'),("href='","'"),('src="','"'),("src='","'")]:
                      if s.find(a+old+b)>=0: s=s.replace(a+old+b,a+new+b)
                  s=s.replace('url("'+old+'")','url("'+new+'")').replace("url('"+old+"')","url('"+new+"')")
              depth=len(p.parent.relative_to(root).parts); shared='../'*depth
              s=s.replace('href="onestop-native-ui.css"',f'href="{shared}onestop-native-ui.css"').replace("href='onestop-native-ui.css'",f"href='{shared}onestop-native-ui.css'")
              s=s.replace('href="onestop-visual-polish-v2.css"',f'href="{shared}onestop-visual-polish-v2.css"').replace("href='onestop-visual-polish-v2.css'",f"href='{shared}onestop-visual-polish-v2.css'")
              if p==csc/'index.html': s=s.replace('href="index.html"','href="/index.html"')
              if s!=original: p.write_text(s,encoding='utf-8')
          p=root/'404.html'
          if p.exists():
              s=p.read_text(encoding='utf-8')
              for old in ['free-online-games.html','resume-maker-30-templates.html','non-stop-jap.html','onestop-fast-document-print-free-premium.html']: s=s.replace(old,'')
              p.write_text(s,encoding='utf-8')
          for p in [csc/'onestop-native-ui.css',csc/'onestop-visual-polish-v2.css']:
              if p.exists(): p.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Free CSC Tools folder hierarchy [skip ci]' || exit 0
          git push origin HEAD:free-csc-tools-reorg
