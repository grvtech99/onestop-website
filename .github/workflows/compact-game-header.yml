name: Repair Game HTML Structure
on:
  push:
    paths:
      - '.github/workflows/compact-game-header.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove accidentally appended CSS text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          names='01-reaction-rush 02-color-match 03-2048-neon 04-whack-a-mole 05-space-dodge 06-memory-match 07-brick-breaker 08-number-ninja 09-fruit-catch 10-word-scramble 11-math-master 12-science-quiz 13-geography-explorer 14-english-vocabulary 15-typing-academy 16-money-smart 17-element-challenge 18-logic-sequence 19-history-challenge 20-computer-genius'.split()
          markers=['/* ONESTOP_MOBILE_GAME_FOCUS_V3 */','/* ONESTOP_FINAL_MOBILE_V2 */']
          for n in names:
              p=Path('games')/(n+'.html')
              t=p.read_text(encoding='utf-8')
              cut=None
              for m in markers:
                  i=t.find(m)
                  if i!=-1:
                      cut=i if cut is None else min(cut,i)
              if cut is not None:
                  t=t[:cut].rstrip()
                  if not t.endswith('</html>'):
                      t += '\n</body></html>\n'
                  p.write_text(t,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'ONESTOP HTML Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/*.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair game HTML structure [skip ci]'
          git push
