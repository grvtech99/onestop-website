name: Apply ONESTOP Games Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Games theme stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('free-online-games.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="onestop-games-native-overrides.css">'
          if marker not in s:
              s = s.replace('</head>', marker + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Games theme and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-online-games.html
          git rm .github/workflows/apply-games-theme.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply native ONESTOP theme to games page"
          git push
