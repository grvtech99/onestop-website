name: Build AI Cyber Crime Hero WebP
on:
  push:
    paths:
      - 'gauravs-world/images/ai-cyber-crime-ai-powered-scams-hero.svg'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin webp fonts-noto-core fonts-noto-extra
      - name: Convert SVG to WebP
        run: |
          rsvg-convert -w 1280 -h 720 -o /tmp/cyber.png gauravs-world/images/ai-cyber-crime-ai-powered-scams-hero.svg
          cwebp -quiet -q 82 /tmp/cyber.png -o gauravs-world/images/ai-cyber-crime-ai-powered-scams-hero.webp
      - name: Commit WebP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gauravs-world/images/ai-cyber-crime-ai-powered-scams-hero.webp
          git commit -m "Build AI cyber crime hero WebP" || exit 0
          git push
