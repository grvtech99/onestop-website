name: Mobile Game Focus V4

on:
  push:
    paths:
      - '.github/workflows/mobile-game-focus-v4.yml'

jobs:
  compact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make mobile header ultra compact and play area dominant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            '01-reaction-rush.html','02-color-match.html','03-2048-neon.html','04-whack-a-mole.html',
            '05-space-dodge.html','06-memory-match.html','07-brick-breaker.html','08-number-ninja.html',
            '09-fruit-catch.html','10-word-scramble.html','11-math-master.html','12-science-quiz.html',
            '13-geography-explorer.html','14-english-vocabulary.html','15-typing-academy.html',
            '16-money-smart.html','17-element-challenge.html','18-logic-sequence.html',
            '19-history-challenge.html','20-computer-genius.html'
          ]
          css = r'''
          /* ONESTOP_MOBILE_GAME_FOCUS_V4 */
          @media(max-width:650px){
            .topin{padding:5px 8px!important;min-height:38px!important;height:38px!important;gap:5px!important}
            .brand{font-size:12px!important;line-height:1!important}
            .back{font-size:8px!important;padding:5px 6px!important;border-radius:7px!important}
            .page{padding:5px 5px 12px!important}
            .credit{height:34px!important;min-height:34px!important;margin:0 auto 4px!important;padding:3px 6px!important;border-radius:10px!important;gap:5px!important}
            .credit:before{display:none!important}
            .credit img{width:27px!important;height:27px!important;flex:0 0 27px!important;border-width:1px!important;box-shadow:none!important}
            .credit small{font-size:5.5px!important;line-height:1!important;margin:0 0 1px!important;letter-spacing:.35px!important}
            .credit strong{font-size:9px!important;line-height:1!important}
            .hero .tag{font-size:6.5px!important;padding:3px 6px!important;line-height:1!important;letter-spacing:.3px!important;margin:0!important}
            .hero h1{font-size:clamp(21px,6.5vw,28px)!important;line-height:1!important;margin:3px 0!important;letter-spacing:-.7px!important}
            .hero p{display:none!important}
            .gamebox,.box{border-radius:13px!important}
            .panel{border-radius:12px!important}
            .hud{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:2px!important;padding:3px!important}
            .h{padding:4px 2px!important;min-height:36px!important;border-radius:6px!important}
            .h small{font-size:5.5px!important;line-height:1!important;letter-spacing:.3px!important}
            .h b{font-size:13px!important;line-height:1!important}
            .stage{width:100%!important;height:clamp(470px,78svh,720px)!important;min-height:470px!important;max-height:720px!important;padding:0!important;overflow:hidden!important}
            .stage:has(canvas){padding:0!important}
            .stage canvas{width:100%!important;height:100%!important;max-width:100%!important;display:block!important}
            .info{display:none!important}
            .overlay{padding:7px!important}
            .modal{max-width:calc(100vw - 20px)!important;max-height:calc(100% - 10px)!important;padding:11px 9px!important;border-radius:12px!important}
            .modal .big,.modal .emoji{font-size:30px!important}
            .modal h2{font-size:19px!important;margin:3px 0!important}
            .modal p{font-size:10px!important;line-height:1.2!important;margin:4px 0!important}
            .primary{padding:8px 9px!important;font-size:11px!important}
            .question{font-size:clamp(17px,5vw,24px)!important;margin:6px 0 8px!important}
            .choices{gap:5px!important}
            .choice{padding:8px 6px!important;font-size:11px!important}
            .input{font-size:16px!important;padding:8px!important}
          }
          @media(max-width:430px){
            .topin{padding:4px 6px!important;min-height:36px!important;height:36px!important}
            .brand{font-size:11px!important}
            .back{font-size:7.5px!important;padding:4px 5px!important}
            .page{padding:4px 4px 10px!important}
            .credit{height:32px!important;min-height:32px!important;padding:2px 5px!important;margin-bottom:3px!important}
            .credit img{width:25px!important;height:25px!important;flex-basis:25px!important}
            .credit strong{font-size:8.5px!important}
            .credit small{font-size:5px!important}
            .hero .tag{font-size:6px!important;padding:2px 5px!important}
            .hero h1{font-size:21px!important;margin:2px 0!important}
            .hud{padding:2px!important;gap:2px!important}
            .h{min-height:34px!important;padding:3px 2px!important}
            .h small{font-size:5px!important}
            .h b{font-size:12px!important}
            .stage{height:clamp(460px,82svh,700px)!important;min-height:460px!important;max-height:700px!important}
          }
          @media(max-width:360px){
            .topin{min-height:34px!important;height:34px!important}
            .credit{height:30px!important;min-height:30px!important}
            .credit img{width:23px!important;height:23px!important;flex-basis:23px!important}
            .credit strong{font-size:8px!important}
            .hero h1{font-size:20px!important}
            .h{min-height:32px!important}
            .h b{font-size:11px!important}
            .stage{height:clamp(440px,84svh,680px)!important;min-height:440px!important}
          }
          '''
          css = css.replace('          ', '')
          marker = '/* ONESTOP_MOBILE_GAME_FOCUS_V4 */'
          for name in files:
              p = Path('games') / name
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  p.write_text(text.rstrip() + '\n\n' + css + '\n', encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'ONESTOP Mobile Layout Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/*.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Make mobile gameplay area dominant [skip ci]'
            git push
          fi
