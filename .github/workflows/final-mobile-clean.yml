name: Final Mobile Game Cleanup
on:
  push:
    paths:
      - '.github/workflows/final-mobile-clean.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good game sources
        shell: bash
        run: |
          set -euo pipefail
          git checkout 0a54b1301780cbd5fb503acc4fdaaefb281c0310 -- games/*.html
      - name: Replace duplicate mobile CSS with one clean mobile layout
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          names='01-reaction-rush 02-color-match 03-2048-neon 04-whack-a-mole 05-space-dodge 06-memory-match 07-brick-breaker 08-number-ninja 09-fruit-catch 10-word-scramble 11-math-master 12-science-quiz 13-geography-explorer 14-english-vocabulary 15-typing-academy 16-money-smart 17-element-challenge 18-logic-sequence 19-history-challenge 20-computer-genius'.split()
          css=r'''\n/* ONESTOP FINAL CLEAN MOBILE LAYOUT */\nhtml,body{width:100%;max-width:100%;overflow-x:hidden!important}\nbody{min-width:0!important}\n.top,.topin,.page,main,.gamebox,.box,.panel,.stage{box-sizing:border-box;max-width:100%;min-width:0}\n.topin{width:100%;gap:6px}\n.brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.back{flex:0 0 auto;white-space:nowrap}\n.page{width:100%;padding-left:7px!important;padding-right:7px!important}\n.gamebox,.box{width:100%!important;margin-left:auto!important;margin-right:auto!important}\n.panel{width:100%!important}\n.stage{width:100%!important;min-width:0!important;overflow:hidden!important;padding:0!important}\n.stage canvas{display:block!important;width:100%!important;height:100%!important;max-width:100%!important}\n.credit{box-sizing:border-box!important;max-width:100%!important}\n@media(max-width:650px){\n.topin{padding:5px 7px!important;min-height:36px!important}\n.brand{font-size:11px!important;line-height:1!important}\n.back{font-size:8px!important;padding:5px 6px!important;border-radius:8px!important}\n.page{padding-top:6px!important;padding-bottom:16px!important}\n.credit{height:54px!important;min-height:54px!important;margin:0 auto 6px!important;padding:4px 7px!important;gap:6px!important;border-radius:12px!important}\n.credit:before{display:none!important}\n.credit img{width:34px!important;height:34px!important;flex:0 0 34px!important}\n.credit small{font-size:6px!important;line-height:1!important;margin:0 0 2px!important}\n.credit strong{font-size:10px!important;line-height:1.05!important;white-space:nowrap!important}\n.hero .tag{font-size:7px!important;padding:4px 7px!important;line-height:1!important;margin:0!important}\n.hero h1{font-size:24px!important;line-height:1!important;margin:4px 0 4px!important;letter-spacing:-.7px!important}\n.hero p{font-size:11px!important;line-height:1.2!important;margin:0 auto 6px!important;max-width:100%!important}\n.gamebox,.box{border-radius:14px!important}\n.panel{border-radius:13px!important}\n.hud{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:3px!important;padding:4px!important}\n.h{min-width:0!important;padding:5px 2px!important;border-radius:7px!important;min-height:34px!important}\n.h small{font-size:5.5px!important;line-height:1!important}\n.h b{font-size:13px!important;line-height:1!important}\n.stage{height:clamp(300px,calc(100svh - 540px),380px)!important;min-height:300px!important;max-height:380px!important}\n.overlay{padding:8px!important}\n.modal{max-width:calc(100vw - 22px)!important;max-height:calc(100% - 12px)!important;padding:12px 9px!important;border-radius:13px!important;overflow:auto!important}\n.modal .big,.modal .emoji{font-size:32px!important}\n.modal h2{font-size:20px!important;line-height:1.1!important;margin:3px 0!important}\n.modal p{font-size:11px!important;line-height:1.25!important;margin:4px 0!important}\n.primary{width:100%!important;padding:9px!important;font-size:12px!important}\n.info{font-size:10px!important;padding:9px!important;margin-top:7px!important}\n}\n@media(max-width:430px){\n.topin{padding:4px 6px!important;min-height:34px!important}\n.brand{font-size:10px!important}\n.back{font-size:7px!important;padding:4px 5px!important}\n.page{padding:5px!important}\n.credit{height:48px!important;min-height:48px!important;padding:3px 6px!important;margin-bottom:5px!important;border-radius:11px!important}\n.credit img{width:30px!important;height:30px!important;flex-basis:30px!important}\n.credit strong{font-size:9px!important}\n.credit small{font-size:5.5px!important}\n.hero .tag{font-size:6.5px!important;padding:3px 6px!important}\n.hero h1{font-size:22px!important;margin:3px 0!important}\n.hero p{font-size:10px!important;margin-bottom:5px!important}\n.hud{gap:2px!important;padding:3px!important}\n.h{min-height:31px!important;padding:4px 2px!important}\n.h small{font-size:5px!important}\n.h b{font-size:12px!important}\n.stage{height:clamp(285px,calc(100svh - 500px),360px)!important;min-height:285px!important;max-height:360px!important}\n}\n@media(max-width:360px){\n.credit{height:44px!important;min-height:44px!important}\n.credit img{width:27px!important;height:27px!important;flex-basis:27px!important}\n.credit strong{font-size:8.5px!important}\n.hero h1{font-size:20px!important}\n.stage{height:clamp(280px,calc(100svh - 470px),335px)!important;min-height:280px!important;max-height:335px!important}\n}\n'''
          marker='/* ONESTOP MOBILE RESPONSIVE PATCH */'
          for n in names:
              p=Path('games')/(n+'.html')
              s=p.read_text(encoding='utf-8')
              first_close=s.find('</style>')
              if first_close<0: raise SystemExit(f'{n}: missing style close')
              base=s[:first_close]
              if marker in base:
                  base=base[:base.index(marker)]
              # Remove any old mobile markers from the base section too.
              for m in ['/* ONESTOP MOBILE GAME POLISH */','/* ONESTOP_FINAL_MOBILE_V2 */','/* ONESTOP_MOBILE_GAME_FOCUS_V4 */','/* ONESTOP MOBILE FOCUS V5 */']:
                  base=base.replace(m,'')
              s=base+css+s[first_close:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate all 20 games before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          names='01-reaction-rush 02-color-match 03-2048-neon 04-whack-a-mole 05-space-dodge 06-memory-match 07-brick-breaker 08-number-ninja 09-fruit-catch 10-word-scramble 11-math-master 12-science-quiz 13-geography-explorer 14-english-vocabulary 15-typing-academy 16-money-smart 17-element-challenge 18-logic-sequence 19-history-challenge 20-computer-genius'.split()
          bad=[]
          for n in names:
              s=(Path('games')/(n+'.html')).read_text(encoding='utf-8')
              low=s.lower()
              if low.count('</head>')!=1 or low.count('</body>')!=1 or low.count('</html>')!=1: bad.append(f'{n}: invalid document closing tags')
              if '<body' not in low or '<script' not in low: bad.append(f'{n}: missing body/script')
              if low.rfind('</html>')<=low.rfind('</body>'): bad.append(f'{n}: bad body/html order')
              for m in ['ONESTOP MOBILE RESPONSIVE PATCH','ONESTOP MOBILE GAME POLISH','ONESTOP_FINAL_MOBILE_V2','ONESTOP_MOBILE_GAME_FOCUS_V4']:
                  if m in s: bad.append(f'{n}: duplicate legacy marker {m}')
              ids=set(re.findall(r'\bid=["\']([^"\']+)["\']',s))
              for rid in re.findall(r'getElementById\(["\']([^"\']+)["\']\)',s):
                  if rid not in ids: bad.append(f'{n}: missing DOM id {rid}')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
              for j,js in enumerate(scripts):
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f: f.write(js); fn=f.name
                  r=subprocess.run(['node','--check',fn],capture_output=True,text=True)
                  if r.returncode: bad.append(f'{n}: JS syntax error script {j}: {r.stderr.strip()}')
              funcs=re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', '\n'.join(scripts))
              from collections import Counter
              for fn,c in Counter(funcs).items():
                  if c>1: bad.append(f'{n}: duplicate function {fn} x{c}')
          if bad:
              print('\n'.join(bad)); raise SystemExit(1)
          print('PASS: 20/20 games — HTML structure, JS syntax, DOM IDs, duplicate-function and duplicate-CSS checks')
          PY
      - name: Commit only after validation passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ONESTOP Final Mobile Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/*.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix mobile game sizing without changing game logic [skip ci]'
          git push
