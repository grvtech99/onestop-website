name: Fix Mobile Game Layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile-layout:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile game layout
        run: |
          python - <<'PY'
          from pathlib import Path

          names = [
              '01-reaction-rush.html','02-color-match.html','03-2048-neon.html',
              '04-whack-a-mole.html','05-space-dodge.html','06-memory-match.html',
              '07-brick-breaker.html','08-number-ninja.html','09-fruit-catch.html',
              '10-word-scramble.html','11-math-master.html','12-science-quiz.html',
              '13-geography-explorer.html','14-english-vocabulary.html','15-typing-academy.html',
              '16-money-smart.html','17-element-challenge.html','18-logic-sequence.html',
              '19-history-challenge.html','20-computer-genius.html'
          ]

          marker = '/* ONESTOP FINAL MOBILE GAME LAYOUT V2 */'
          css = r'''\n/* ONESTOP FINAL MOBILE GAME LAYOUT V2 */
html,body{width:100%;max-width:100%;overflow-x:hidden!important}
body{min-width:0!important}
img,video,canvas,svg{max-width:100%}
@media(max-width:650px){
  .topin{padding:8px 9px!important;gap:7px!important}
  .brand{font-size:14px!important;min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
  .back{font-size:10px!important;padding:7px 8px!important;flex:0 0 auto!important;white-space:nowrap!important}
  .page{padding:10px 7px 24px!important}
  .credit{margin:0 auto 8px!important;padding:6px 8px!important;min-height:48px!important;border-radius:13px!important;gap:7px!important}
  .credit img{width:34px!important;height:34px!important;flex:0 0 34px!important}
  .credit strong{font-size:11px!important;line-height:1.15!important}
  .credit small{font-size:7px!important}
  .hero h1{font-size:clamp(25px,8vw,36px)!important;line-height:1.04!important;margin:6px 0 4px!important;letter-spacing:-1px!important}
  .hero p{font-size:12px!important;line-height:1.3!important;margin:0 auto 9px!important;max-width:100%!important}
  .tag{font-size:8px!important;padding:5px 8px!important;letter-spacing:.4px!important}
  .gamebox,.box{border-radius:16px!important}
  .panel{border-radius:15px!important}
  .hud{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:4px!important;padding:5px!important}
  .h{padding:6px 3px!important;min-width:0!important;border-radius:8px!important}
  .h small{font-size:7px!important;letter-spacing:.6px!important}
  .h b{font-size:15px!important;line-height:1.05!important}
  .stage{width:100%!important;min-width:0!important;height:clamp(300px,calc(100svh - 355px),440px)!important;min-height:300px!important;max-height:440px!important;padding:10px!important;overflow:hidden!important}
  .stage:has(canvas){padding:0!important}
  .stage canvas{width:100%!important;height:100%!important;max-width:100%!important;display:block!important}
  .content{width:100%!important;max-width:100%!important}
  .question{font-size:clamp(20px,6vw,30px)!important;margin:10px 0 14px!important;line-height:1.15!important}
  .choices{gap:8px!important}
  .choice{padding:12px 9px!important;font-size:13px!important;border-radius:11px!important}
  .input{width:100%!important;font-size:16px!important;padding:11px!important}
  .primary{width:100%!important;padding:11px 12px!important;font-size:14px!important}
  .modal{max-width:calc(100vw - 26px)!important;max-height:calc(100% - 16px)!important;padding:16px 11px!important;border-radius:15px!important;overflow:auto!important}
  .modal h2{font-size:22px!important;line-height:1.1!important}
  .modal p{font-size:12px!important;line-height:1.35!important}
  .modal .big,.modal .emoji{font-size:38px!important}
  .info{margin-top:9px!important;padding:11px!important;font-size:11px!important;line-height:1.45!important}
}
@media(max-width:430px){
  .page{padding-left:6px!important;padding-right:6px!important}
  .brand{font-size:13px!important}
  .back{font-size:9px!important;padding:6px 7px!important}
  .credit{padding:6px 7px!important;margin-bottom:7px!important}
  .credit:before{display:none!important}
  .credit img{width:32px!important;height:32px!important;flex-basis:32px!important}
  .credit strong{font-size:10.5px!important}
  .stage{height:clamp(285px,calc(100svh - 350px),420px)!important;min-height:285px!important;max-height:420px!important}
  .stage:has(canvas){padding:0!important}
  .hero h1{font-size:clamp(24px,8.5vw,34px)!important}
}
@media(max-width:360px){
  .topin{padding-left:6px!important;padding-right:6px!important}
  .hud{gap:3px!important;padding:4px!important}
  .h{padding:5px 2px!important}
  .h b{font-size:14px!important}
  .h small{font-size:6.5px!important}
  .stage{height:clamp(280px,calc(100svh - 345px),390px)!important;min-height:280px!important;max-height:390px!important}
  .stage:has(canvas){padding:0!important}
}
'''

          changed = []
          for name in names:
              p = Path('games') / name
              if not p.exists():
                  raise SystemExit(f'Missing game file: {p}')
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  continue
              pos = text.rfind('</style>')
              if pos < 0:
                  raise SystemExit(f'No </style> in {p}')
              text = text[:pos] + css + text[pos:]
              p.write_text(text, encoding='utf-8')
              changed.append(name)
          print('Updated:', ', '.join(changed))
          PY

      - name: Commit mobile layout changes
        run: |
          git config user.name "ONESTOP Mobile Layout Bot"
          git config user.email "actions@github.com"
          git add games/*.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Fix mobile game layouts [skip ci]"
          git push
