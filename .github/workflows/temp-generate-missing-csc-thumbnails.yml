name: Temp Generate Missing CSC Thumbnails
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8000 >/tmp/onestop-http.log 2>&1 &
      - name: Capture missing tool screenshots
        run: |
          cat > capture-csc-thumbnails.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const base = 'http://127.0.0.1:8000/';
          const index = fs.readFileSync('free-csc-tools/index.html','utf8');
          const hrefs = [...index.matchAll(/href="([^"]+\.html)"/gi)].map(m=>m[1]).filter(h=>!h.startsWith('http'));
          const unique = [...new Set(hrefs)];
          function normalized(href){
            const rel = path.posix.normalize(path.posix.join('free-csc-tools', href));
            return rel.replace(/^\.\//,'');
          }
          function filename(href){
            return href.replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()+'.png';
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1100,height:700},deviceScaleFactor:1});
            for(const href of unique){
              const rel=normalized(href);
              if(!fs.existsSync(rel)) continue;
              const out=path.join('free-csc-tools','tool-thumbnails',filename(href));
              if(fs.existsSync(out)) continue;
              await page.goto(base+rel,{waitUntil:'networkidle',timeout:30000});
              await page.screenshot({path:out,fullPage:false});
              console.log('Captured',href,'=>',out);
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture-csc-thumbnails.js
          rm capture-csc-thumbnails.js
      - name: Commit screenshots and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-csc-tools/tool-thumbnails
          git rm .github/workflows/temp-generate-missing-csc-thumbnails.yml
          git commit -m "Add missing realistic CSC tool thumbnails"
          git push origin main
