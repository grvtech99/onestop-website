name: Temporary Free CSC thumbnail polish
on:
  push:
    branches: [main]

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add visual thumbnails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('free-csc-tools/index.html')
          s=p.read_text()
          marker='/* VISUAL TOOL THUMBNAILS */'
          if marker not in s:
              css=r'''
          /* VISUAL TOOL THUMBNAILS */
          .thumb{background:linear-gradient(135deg,#edf6ff 0%,#fff 72%);position:relative}
          .thumb:before{content:"";position:absolute;inset:10px;border-radius:13px;background:linear-gradient(145deg,rgba(7,87,201,.07),rgba(22,136,232,.02));border:1px solid rgba(7,87,201,.08)}
          .thumb.mock-photo{gap:7px;padding:17px}
          .thumb.mock-photo .photo{position:relative;width:43px;height:64px;border-radius:7px;background:linear-gradient(#dbeafe 0 27%,#f8fafc 27% 100%);border:3px solid #fff;box-shadow:0 6px 12px rgba(7,87,201,.18);overflow:hidden}
          .thumb.mock-photo .photo:before{content:"";position:absolute;width:18px;height:22px;border-radius:50%;background:#f1c7a7;left:10px;top:8px;box-shadow:0 -4px 0 2px #26354a}
          .thumb.mock-photo .photo:after{content:"";position:absolute;width:28px;height:23px;border-radius:14px 14px 5px 5px;background:#17325f;left:5px;bottom:0}
          .thumb.mock-doc{gap:0}
          .thumb.mock-doc .sheet{width:72px;height:86px;padding:11px;background:#fff;border-radius:6px;box-shadow:0 7px 16px rgba(7,87,201,.14);position:relative}
          .thumb.mock-doc .sheet:first-child{transform:rotate(-6deg);margin-right:-28px}
          .thumb.mock-doc .sheet:last-child{transform:rotate(5deg);z-index:2}
          .thumb.mock-doc .sheet:before{content:"";display:block;width:22px;height:22px;border-radius:50%;background:#dbeafe;margin-bottom:7px}
          .thumb.mock-doc .sheet i{height:4px;margin:5px 0;background:#b9d3f5}
          .thumb.mock-doc .sheet i:nth-child(2){width:75%}.thumb.mock-doc .sheet i:nth-child(3){width:90%}.thumb.mock-doc .sheet i:nth-child(4){width:60%}
          .thumb.mock-social{gap:8px;flex-wrap:wrap;max-width:190px}
          .thumb.mock-social b{width:40px;height:40px;border-radius:11px;background:#fff;box-shadow:0 5px 13px rgba(7,87,201,.14);border:1px solid #dce8f8;font-size:20px}
          .thumb.mock-social b:nth-child(1){color:#e1306c}.thumb.mock-social b:nth-child(2){color:#1877f2}.thumb.mock-social b:nth-child(3){color:#f00}.thumb.mock-social b:nth-child(4){color:#0757c9}
          .tool-card[href*="1click-id-card"] .thumb-icon{font-size:0;width:132px;height:78px;border-radius:10px;position:relative;background:linear-gradient(135deg,#0757c9,#1688e8);overflow:hidden}
          .tool-card[href*="1click-id-card"] .thumb-icon:before{content:"ID CARD";position:absolute;left:10px;top:12px;color:#fff;font-size:12px;font-weight:900;letter-spacing:.5px}
          .tool-card[href*="1click-id-card"] .thumb-icon:after{content:"";position:absolute;right:11px;top:14px;width:34px;height:45px;border-radius:5px;background:linear-gradient(#f1c7a7 0 42%,#17325f 42%);box-shadow:-46px 18px 0 -14px #dbeafe}
          .tool-card[href*="pdf-tools"] .thumb{gap:8px}
          .tool-card[href*="pdf-tools"] .thumb-icon{font-size:0;width:72px;height:88px;border-radius:7px;background:#fff;border:1px solid #d6e3f6;position:relative}
          .tool-card[href*="pdf-tools"] .thumb-icon:before{content:"PDF";display:flex;align-items:center;justify-content:center;position:absolute;inset:13px 8px;background:#dc2626;color:#fff;font-size:18px;font-weight:900;border-radius:4px}
          .category-thumb{font-size:0;overflow:hidden;position:relative;background:#edf6ff}
          .category-thumb:before{content:"";position:absolute;width:24px;height:28px;border-radius:4px;background:#fff;box-shadow:10px 6px 0 -2px #bcd4f7;transform:rotate(-6deg)}
          .category-tool[href*="passport"] .category-thumb{background:linear-gradient(135deg,#dbeafe,#fff)}
          .category-tool[href*="passport"] .category-thumb:before{width:22px;height:28px;background:linear-gradient(#dbeafe 0 30%,#f8fafc 30%);box-shadow:0 0 0 2px #fff,8px 7px 0 -1px #bcd4f7}
          .category-tool[href*="id-card"] .category-thumb{background:linear-gradient(135deg,#0757c9,#1688e8)}
          .category-tool[href*="id-card"] .category-thumb:before{width:32px;height:22px;background:#fff;box-shadow:none;transform:rotate(0);border-radius:4px}
          .category-tool[href*="id-card"] .category-thumb:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#f1c7a7;left:26px;top:13px}
          .category-tool[href*="resume"] .category-thumb:before{background:#fff;box-shadow:5px 4px 0 #bcd4f7;width:26px;height:31px}
          .category-tool[href*="pdf"] .category-thumb:before{content:"PDF";width:28px;height:30px;background:#dc2626;color:#fff;box-shadow:none;transform:none;border-radius:4px;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center}
          .category-tool[href*="social-media"] .category-thumb:before{width:26px;height:26px;background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4);box-shadow:none;border-radius:8px;transform:none}
          .category-tool[href*="social-media"] .category-thumb:after{content:"•";position:absolute;color:#fff;font-size:20px;left:18px;top:7px}
          .category-tool[href*="calculator"],.category-tool[href*="gst"] .category-thumb{ }
          .category-tool[href*="emi"] .category-thumb:before,.category-tool[href*="gst"] .category-thumb:before{background:#fff;box-shadow:inset 0 -5px 0 #dbeafe,0 4px 0 #bcd4f7}
          .category-tool[href*="audio"] .category-thumb:before{content:"♪";width:28px;height:28px;background:#dbeafe;color:#0757c9;box-shadow:none;transform:none;border-radius:8px;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}
          .category-tool[href*="video"] .category-thumb:before{content:"▶";width:30px;height:24px;background:#0757c9;color:#fff;box-shadow:none;transform:none;border-radius:7px;font-size:12px;display:flex;align-items:center;justify-content:center}
          @media(max-width:520px){.thumb.mock-photo .photo{width:47px;height:68px}.thumb.mock-doc .sheet{width:78px;height:92px}}
          '''
              s=s.replace('</style>',css+'\n</style>',1)
              p.write_text(s)
          PY
      - name: Commit thumbnail update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-csc-tools/index.html
          git diff --cached --quiet || git commit -m "Improve Free CSC tool thumbnails"
          git push
