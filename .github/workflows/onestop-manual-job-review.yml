name: ONESTOP — Manual Single Job Review

on:
  workflow_dispatch:
    inputs:
      job_url:
        description: 'Paste the single job/recruitment URL to extract'
        required: true
        type: string
      commit_review:
        description: 'Save the review result into the repository for the Admin dashboard'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: onestop-manual-job-review
  cancel-in-progress: false

jobs:
  review:
    name: Extract one job page
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install PDF extraction dependency
        run: python -m pip install --disable-pip-version-check --no-input pypdf==6.18.1

      - name: Extract supplied job URL
        id: review
        env:
          JOB_URL: ${{ inputs.job_url }}
        run: python government-job-update/scripts/manual-job-review-v3.py | tee manual-job-review-output.json

      - name: Build GitHub Actions review summary
        env:
          JOB_URL: ${{ inputs.job_url }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('government-job-update/data/manual-job-review.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          r=d.get('record',{})
          lines=[]
          lines.append('# ONESTOP Manual Single Job Review')
          lines.append('')
          lines.append(f"**Status:** `{d.get('status')}`")
          lines.append(f"**Input URL:** {d.get('inputUrl')}")
          lines.append(f"**Final URL:** {d.get('finalUrl')}")
          lines.append('')
          lines.append('## Extracted fields')
          lines.append('')
          lines.append('| Field | Value | Status |')
          lines.append('|---|---|---|')
          for k,v in d.get('fieldStatus',{}).items():
              value=r.get(k,'')
              if isinstance(value,(dict,list)): value=json.dumps(value,ensure_ascii=False)
              value=str(value or '—').replace('|','\\|')[:500]
              lines.append(f"| `{k}` | {value} | `{v}` |")
          lines.append('')
          missing=d.get('missingRequiredFields',[])
          if missing:
              lines.append('## ACTION REQUIRED')
              lines.append('')
              lines.append('The following required fields are missing and must be supplied/reviewed by Admin before publication:')
              for x in missing: lines.append(f'- `{x}`')
          else:
              lines.append('## ADMIN REVIEW')
              lines.append('')
              lines.append('All required fields were extracted from the supplied page. Admin should review the values and use the notification/source links for cross-checking before publication.')
          Path('/tmp/summary.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload single-job review artifact
        uses: actions/upload-artifact@v4
        with:
          name: onestop-manual-job-review-${{ github.run_id }}
          path: |
            government-job-update/data/manual-job-review.json
            manual-job-review-output.json
          if-no-files-found: error

      - name: Save review result for Admin dashboard
        if: ${{ inputs.commit_review }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add government-job-update/data/manual-job-review.json
          if git diff --cached --quiet; then
            echo "No review-state change to commit."
            exit 0
          fi
          git commit -m "Record ONESTOP manual job review"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main
            sleep 2
          done
          echo 'Unable to save review state after 5 attempts.'
          exit 1

      - name: Require Admin action when extraction is incomplete
        if: ${{ always() && steps.review.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('government-job-update/data/manual-job-review.json',encoding='utf-8'))
          if d.get('actionRequired'):
              print('ACTION REQUIRED:', d.get('status'))
              print('Missing required fields:', ', '.join(d.get('missingRequiredFields',[])) or 'none')
              sys.exit(1)
          print('Manual job extraction has all required fields.')
          PY
