name: Fix homepage quick buttons
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep header Jap and remove duplicate hero button
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Keep the Hindi Jap item in the WHITE HEADER; remove only any Jap item inside the blue hero quick-access row.
          s=re.sub(r'(<div class="hero-quick"[^>]*>)(.*?)(</div>)', lambda m: m.group(1)+re.sub(r'\s*<a[^>]*href=["\']non-stop-jap\.html["\'][^>]*>.*?</a>', '', m.group(2), flags=re.S)+m.group(3), s, count=1, flags=re.S)
          # Remove a duplicate Onestop Job Update quick button while retaining the first one.
          s=s.replace('  <a href="onestop-updates.html"><span>📢</span> Onestop Job Update</a>\n  <a href="onestop-updates.html"><span>📢</span> Onestop Job Update</a>', '  <a href="onestop-updates.html"><span>📢</span> Onestop Job Update</a>')
          # Preserve the original header Jap navigation item if it is present; do not alter it.
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-homepage-buttons.yml
          git commit -m 'Fix homepage quick buttons and restore header Jap' || exit 0
          git rm .github/workflows/fix-homepage-buttons.yml
          git commit -m 'Remove temporary homepage button workflow'
          git push
