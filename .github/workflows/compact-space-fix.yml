name: Compact Mobile Game Layout

on:
  push:
    branches: [main]

jobs:
  compact:
    if: github.event.head_commit.message != 'Fix compact mobile game layout'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply compact mobile layout to all 20 games
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = sorted(Path('games').glob('*.html'))
          if len(files) != 20:
              raise SystemExit(f'Expected 20 game files, found {len(files)}')

          css = r'''<style id="onestop-compact-mobile-final">
          @media (max-width:650px){
            body{overflow-x:hidden}
            .page{padding:4px 10px 12px!important}
            header{min-height:34px!important;height:34px!important;padding:4px 10px!important;margin-bottom:2px!important}
            header .brand{font-size:17px!important;line-height:1!important}
            header .back{font-size:12px!important;padding:6px 9px!important}
            .credit{margin:4px 0 2px!important;padding:5px 9px!important;min-height:42px!important;border-radius:16px!important;gap:8px!important}
            .credit img,.credit .avatar{width:30px!important;height:30px!important;min-width:30px!important}
            .credit strong{font-size:9px!important;line-height:1.15!important}
            .credit small,.credit span{font-size:7px!important;line-height:1!important}
            .hero{margin:2px 0 4px!important;padding:0!important}
            .tag{font-size:9px!important;padding:4px 9px!important;margin:0 0 3px!important}
            h1{font-size:21px!important;line-height:1!important;margin:2px 0 4px!important}
            .hero p,.subtitle{font-size:10px!important;line-height:1.2!important;margin:0 0 5px!important}
            .hud{gap:5px!important;padding:5px!important;margin:0 0 4px!important}
            .hud>div{padding:5px 3px!important;min-height:40px!important}
            .hud b,.hud strong{font-size:14px!important;line-height:1!important}
            .hud small,.hud span{font-size:7px!important}
            .stage{height:clamp(270px,calc(100svh - 505px),340px)!important;min-height:270px!important;max-height:340px!important;margin:0!important}
            canvas{width:100%!important;height:100%!important;display:block!important}
          }
          @media (max-width:430px){
            .page{padding:3px 8px 10px!important}
            header{height:32px!important;min-height:32px!important;padding:3px 8px!important}
            header .brand{font-size:15px!important}
            header .back{font-size:11px!important;padding:5px 8px!important}
            .credit{margin:3px 0 1px!important;padding:4px 8px!important;min-height:36px!important;gap:7px!important}
            .credit img,.credit .avatar{width:27px!important;height:27px!important;min-width:27px!important}
            .credit strong{font-size:8px!important}
            .credit small,.credit span{font-size:6.5px!important}
            .tag{font-size:8px!important;padding:3px 8px!important;margin:0 0 2px!important}
            h1{font-size:19px!important;margin:1px 0 3px!important}
            .hero p,.subtitle{font-size:9px!important;line-height:1.15!important;margin:0 0 4px!important}
            .hud{padding:4px!important;gap:4px!important;margin-bottom:3px!important}
            .hud>div{min-height:35px!important;padding:4px 2px!important}
            .hud b,.hud strong{font-size:12px!important}
            .stage{height:clamp(255px,calc(100svh - 465px),315px)!important;min-height:255px!important;max-height:315px!important}
          }
          @media (max-width:360px){
            .credit{min-height:33px!important;padding:3px 7px!important}
            .credit img,.credit .avatar{width:24px!important;height:24px!important;min-width:24px!important}
            .credit strong{font-size:7.5px!important}
            .credit small,.credit span{font-size:6px!important}
            h1{font-size:18px!important}
            .hero p,.subtitle{font-size:8.5px!important}
            .stage{height:clamp(245px,calc(100svh - 445px),295px)!important;min-height:245px!important;max-height:295px!important}
          }
          </style>'''

          for p in files:
              text = p.read_text(encoding='utf-8')
              marker = 'id="onestop-compact-mobile-final"'
              if marker in text:
                  before, after = text.split('<style id="onestop-compact-mobile-final">', 1)
                  _, after = after.split('</style>', 1)
                  text = before + css + after
              else:
                  if '</head>' not in text:
                      raise SystemExit(f'Missing </head> in {p}')
                  text = text.replace('</head>', css + '\n</head>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate before commit
        shell: bash
        run: |
          set -e
          count=0
          for f in games/*.html; do
            count=$((count+1))
            test "$(grep -o '</head>' "$f" | wc -l)" -eq 1
            test "$(grep -o '</body>' "$f" | wc -l)" -eq 1
            test "$(grep -o '</html>' "$f" | wc -l)" -eq 1
            grep -q '<body' "$f"
            grep -q '<script' "$f"
          done
          test "$count" -eq 20
          echo "PASS: 20/20 game files validated"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/*.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix compact mobile game layout'
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/compact-space-fix.yml || true
          git commit -m 'Remove temporary compact layout workflow' || true
          git push || true
