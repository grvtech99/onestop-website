name: Final Game Cleanup V2
on:
  push:
    branches: [main]
jobs:
  clean:
    if: github.event.head_commit.message != 'Final game cleanup v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild one clean mobile CSS layer
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          css='''
          /* ONESTOP FINAL MOBILE CSS */
          @media(max-width:650px){
          html,body{width:100%;max-width:100%;overflow-x:hidden!important}
          .topin{width:100%!important;height:40px!important;min-height:40px!important;padding:6px 8px!important}
          .brand{font-size:15px!important;line-height:1!important}.back{font-size:11px!important;padding:6px 9px!important}
          .page{width:100%!important;max-width:100%!important;padding:5px 8px 10px!important}
          .credit{width:100%!important;height:50px!important;min-height:50px!important;margin:2px auto 5px!important;padding:4px 8px!important;justify-content:center!important;text-align:center!important;gap:8px!important}
          .credit div{text-align:center!important}.credit img,.credit .avatar{width:34px!important;height:34px!important;min-width:34px!important}.credit small{font-size:7px!important}.credit strong{font-size:10px!important;white-space:nowrap!important}
          .hero{margin:0 0 5px!important}.hero .tag,.tag{font-size:8px!important;padding:4px 8px!important}.hero h1,h1{font-size:23px!important;line-height:1!important;margin:2px 0 4px!important}.hero p{font-size:10px!important;margin:0 auto 5px!important}
          .gamebox,.box,.panel{width:100%!important;max-width:100%!important}.hud{width:100%!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:5px!important;padding:6px!important}
          .h{min-width:0!important;min-height:62px!important;padding:8px 3px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important}.h small{font-size:8px!important;line-height:1.1!important}.h b{font-size:21px!important;line-height:1.05!important;margin-top:3px!important}
          .stage{width:100%!important;height:clamp(420px,calc(100svh - 245px),680px)!important;min-height:420px!important;max-height:680px!important}.stage canvas{width:100%!important;height:100%!important}.hint,.info{display:none!important}
          .overlay{padding:8px!important}.modal{max-width:calc(100vw - 24px)!important;padding:13px 10px!important}.primary{width:100%!important}
          }
          @media(max-width:430px){.topin{height:38px!important;min-height:38px!important}.brand{font-size:14px!important}.back{font-size:10px!important}.page{padding:4px 7px 8px!important}.credit{height:48px!important;min-height:48px!important}.credit img,.credit .avatar{width:32px!important;height:32px!important;min-width:32px!important}.credit strong{font-size:9.5px!important}.hud{gap:4px!important;padding:5px!important}.h{min-height:60px!important}.h small{font-size:7.5px!important}.h b{font-size:20px!important}.stage{height:clamp(410px,calc(100svh - 235px),650px)!important;min-height:410px!important;max-height:650px!important}}
          @media(max-width:360px){.topin{height:36px!important;min-height:36px!important}.brand{font-size:13px!important}.back{font-size:9px!important}.credit{height:46px!important;min-height:46px!important}.credit img,.credit .avatar{width:30px!important;height:30px!important;min-width:30px!important}.hud{gap:3px!important;padding:4px!important}.h{min-height:56px!important}.h small{font-size:7px!important}.h b{font-size:19px!important}.stage{height:clamp(400px,calc(100svh - 225px),620px)!important;min-height:400px!important;max-height:620px!important}}
          '''
          games=sorted(Path('games').glob('*.html'))
          assert len(games)==20, len(games)
          for p in games:
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'\n/\* ONESTOP FINAL CLEAN MOBILE LAYOUT \*/.*?(?=</style>)','',s,flags=re.S)
              s=re.sub(r'<style\s+id=["\']onestop-[^"\']+["\']>.*?</style>\s*','',s,flags=re.S|re.I)
              s=re.sub(r'\n/\* ONESTOP FINAL MOBILE CSS \*/.*?(?=</style>)','',s,flags=re.S)
              assert s.count('</head>')==1 and s.count('</body>')==1 and s.count('</html>')==1, p
              s=s.replace('</style>','</style><style id="onestop-final-mobile">'+css+'</style>',1)
              assert s.count('id="onestop-final-mobile"')==1, p
              p.write_text(s,encoding='utf-8')
          print('20 games cleaned')
          PY
      - name: Validate
        run: |
          set -e
          test "$(find games -maxdepth 1 -name '*.html' -type f | wc -l)" -eq 20
          for f in games/*.html; do
            test "$(grep -o '</head>' "$f"|wc -l)" -eq 1
            test "$(grep -o '</body>' "$f"|wc -l)" -eq 1
            test "$(grep -o '</html>' "$f"|wc -l)" -eq 1
            test "$(grep -o 'id=\"onestop-final-mobile\"' "$f"|wc -l)" -eq 1
            ! grep -q 'onestop-compact-mobile-final' "$f"
            ! grep -q 'onestop-hud-center-final' "$f"
          done
          echo 'PASS 20/20'
      - name: Commit and remove workflows
        run: |
          rm -rf .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Final game cleanup v2'
          git push origin main
