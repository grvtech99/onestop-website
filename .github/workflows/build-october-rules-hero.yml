name: Build October Rules Hero WebP
on:
  push:
    paths:
      - 'gauravs-world/images/october-2026-new-rules-hero.svg'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Convert
        working-directory: gauravs-world
        run: |
          npm init -y >/dev/null 2>&1
          npm install sharp@0.33.5 >/dev/null 2>&1
          node -e "require('sharp')('images/october-2026-new-rules-hero.svg').resize(1280,720,{fit:'cover'}).webp({quality:82}).toFile('images/october-2026-new-rules-hero.webp').then(()=>console.log('built'))"
      - name: Commit WebP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gauravs-world/images/october-2026-new-rules-hero.webp
          git diff --cached --quiet || git commit -m "Add October 2026 rules hero WebP"
          git push