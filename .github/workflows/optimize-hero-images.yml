name: Optimize Blog Hero Images
on:
  push:
    paths:
      - 'gauravs-world/.github/optimize-hero-images.trigger'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Optimize WebP heroes
        working-directory: gauravs-world
        run: |
          npm init -y >/dev/null 2>&1
          npm install sharp@0.33.5 >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs'), path=require('path'), sharp=require('sharp');
          const dir='images';
          const files=fs.readdirSync(dir).filter(f=>f.toLowerCase().endsWith('.webp'));
          (async()=>{
            for(const f of files){
              const p=path.join(dir,f), st=fs.statSync(p);
              if(st.size<=200000) continue;
              const tmp=p+'.tmp.webp';
              await sharp(p).webp({quality:80,effort:6}).toFile(tmp);
              const ns=fs.statSync(tmp).size;
              if(ns<st.size*0.9) fs.renameSync(tmp,p); else fs.unlinkSync(tmp);
              console.log(f, st.size, '->', ns);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gauravs-world/images/*.webp
          git diff --cached --quiet || git commit -m "Optimize blog hero WebP images"
          git push