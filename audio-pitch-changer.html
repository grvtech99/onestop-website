<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Pitch Changer | ONESTOP</title><style>body{font-family:system-ui;background:#070916;color:#fff;padding:20px}.box{max-width:650px;margin:auto;background:#11162f;padding:22px;border-radius:18px}input,button{width:100%;margin:12px 0;padding:12px;box-sizing:border-box}button{background:#38e8ff;border:0;border-radius:10px;font-weight:800}audio{width:100%}</style><link rel="stylesheet" href="onestop-native-ui.css"></head><body><div class="box"><h1>🎚️ Audio Pitch Changer</h1><p>Change pitch in semitones. Processing stays in your browser.</p><input id="f" type="file" accept="audio/*"><label>Pitch: <b id="v">0 semitones</b></label><input id="p" type="range" min="-12" max="12" step="1" value="0"><button id="go">Process & Download WAV</button><audio id="a" controls></audio><p id="m"></p></div><script>let b;$=x=>document.getElementById(x);$('p').oninput=()=>$('v').textContent=$('p').value+' semitones';$('f').onchange=async e=>{if(e.target.files[0])b=await new AudioContext().decodeAudioData(await e.target.files[0].arrayBuffer())};$('go').onclick=async()=>{try{if(!b)throw Error('Select an audio file first.');let semi=+$('p').value,rate=Math.pow(2,semi/12),o=new OfflineAudioContext(b.numberOfChannels,Math.ceil(b.length/rate),b.sampleRate),x=o.createBufferSource();x.buffer=b;x.playbackRate.value=rate;x.connect(o.destination);x.start();let r=await o.startRendering(),blob=wav(r),u=URL.createObjectURL(blob);$('a').src=u;$('<a>');let z=document.createElement('a');z.href=u;z.download='onestop-pitch.wav';z.click()}catch(e){$('m').textContent=e.message}};function wav(b){let n=b.numberOfChannels,l=44+b.length*n*2,a=new ArrayBuffer(l),v=new DataView(a),p=0,w=s=>{for(let c of s)v.setUint8(p++,c.charCodeAt(0))},u=x=>{v.setUint32(p,x,true);p+=4},q=x=>{v.setUint16(p,x,true);p+=2};w('RIFF');u(l-8);w('WAVEfmt ');u(16);q(1);q(n);u(b.sampleRate);u(b.sampleRate*n*2);q(n*2);q(16);w('data');u(l-p-4);for(let i=0;i<b.length;i++)for(let c=0;c<n;c++){let x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([a],{type:'audio/wav'})}</script></body></html>
