<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio File Info - ONESTOP</title><style>body{margin:0;padding:20px;font-family:system-ui;background:#070916;color:#fff}.box{max-width:700px;margin:auto;background:#11162f;padding:24px;border-radius:20px}input{width:100%;box-sizing:border-box;padding:13px;margin:10px 0}.card{margin-top:15px;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:15px;background:rgba(255,255,255,.03)}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}.row:last-child{border:0}.muted{color:#9fe9ff}</style></head><body><main class="box"><h1>ℹ️ Audio File Info</h1><p>View audio filename, type, size, duration, sample rate, channels and more.</p><input id="file" type="file" accept="audio/*"><div id="out" class="card">Select an audio file.</div></main><script>const f=document.getElementById('file'),o=document.getElementById('out');f.onchange=async()=>{const x=f.files[0];if(!x)return;o.textContent='Reading…';try{const c=new AudioContext(),b=await c.decodeAudioData(await x.arrayBuffer());const kb=(x.size/1024).toFixed(1),mb=(x.size/1048576).toFixed(2);o.innerHTML='<div class="row"><b>Filename</b><span>'+esc(x.name)+'</span></div><div class="row"><b>Type</b><span>'+esc(x.type||'Unknown')+'</span></div><div class="row"><b>Size</b><span>'+kb+' KB ('+mb+' MB)</span></div><div class="row"><b>Duration</b><span>'+b.duration.toFixed(2)+' sec</span></div><div class="row"><b>Sample Rate</b><span>'+b.sampleRate+' Hz</span></div><div class="row"><b>Channels</b><span>'+b.numberOfChannels+'</span></div><div class="row"><b>Bit Depth</b><span>Source dependent</span></div>';await c.close()}catch(e){o.innerHTML='<span class="muted">This audio format could not be decoded by your browser.</span>'}};function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
