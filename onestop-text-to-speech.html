<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text to Speech | ONESTOP</title><style>body{margin:0;font-family:system-ui;background:#070916;color:#fff}main{max-width:760px;margin:auto;padding:24px}textarea{width:100%;min-height:230px;box-sizing:border-box;background:#11162f;color:#fff;border:1px solid #30385d;border-radius:14px;padding:14px;font:16px system-ui}select,input,button{font:inherit;margin-top:10px}select,input{padding:9px;background:#11162f;color:#fff;border:1px solid #30385d;border-radius:9px}button{background:#38e8ff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;margin-right:5px}.secondary{background:#242b4c;color:#fff}.status{color:#9af5ff;margin-top:12px}p{color:#aeb7d8}</style></head><body><main><a href="free-tools.html" style="color:#38e8ff">← Back</a><h1>🔤 Text → Speech</h1><p>Read text aloud using voices available in your browser. Nothing is uploaded.</p><textarea id="t" placeholder="Type or paste text here…">Welcome to ONESTOP Free Tools.</textarea><div><select id="v"></select><label> Speed <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1"></label><span id="rv">1×</span></div><button id="play">▶ Speak</button><button class="secondary" id="stop">■ Stop</button><div id="s" class="status">Ready</div></main><script>const t=document.getElementById('t'),v=document.getElementById('v'),r=document.getElementById('rate'),rv=document.getElementById('rv'),s=document.getElementById('s');function load(){v.innerHTML='';speechSynthesis.getVoices().forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=x.name+' — '+x.lang;v.appendChild(o)})}load();speechSynthesis.onvoiceschanged=load;r.oninput=()=>rv.textContent=r.value+'×';document.getElementById('play').onclick=()=>{speechSynthesis.cancel();if(!t.value.trim()){s.textContent='Enter some text.';return}let u=new SpeechSynthesisUtterance(t.value);let voices=speechSynthesis.getVoices();u.voice=voices[v.value];u.rate=+r.value;u.onstart=()=>s.textContent='Speaking…';u.onend=()=>s.textContent='Finished';speechSynthesis.speak(u)};document.getElementById('stop').onclick=()=>{speechSynthesis.cancel();s.textContent='Stopped'};</script></body></html>
