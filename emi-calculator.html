<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP EMI Calculator</title><style>body{margin:0;font-family:system-ui,Arial;background:#07142e;color:#fff}main{max-width:620px;margin:auto;padding:22px}a{color:#38e8ff}.box{background:#111d3d;border:1px solid #2c3c6b;border-radius:16px;padding:20px}label{display:block;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #46557f;background:#08122d;color:#fff;font-size:16px}button{margin-top:16px;padding:12px 16px;border:0;border-radius:10px;background:#38e8ff;font-weight:800}.out{margin-top:18px;padding:16px;background:#08122d;border-radius:12px;line-height:1.8}</style></head><body><main><a href="free-tools.html">← Back to Free Tools</a><h1>🏦 EMI Calculator</h1><div class="box"><label>Loan amount (₹)</label><input id="loan" type="number" min="0"><label>Annual interest rate (%)</label><input id="rate" type="number" min="0" step="0.01"><label>Tenure (years)</label><input id="years" type="number" min="0.1" step="0.1"><button onclick="go()">Calculate EMI</button><div id="out" class="out">Enter loan details.</div></div></main><script>function go(){let P=+loan.value,R=+rate.value,N=+years.value*12;if(!P||P<0||R<0||!N){out.textContent='Please enter valid loan details.';return}let m=R/1200,emi=m?P*m*Math.pow(1+m,N)/(Math.pow(1+m,N)-1):P/N,total=emi*N;out.innerHTML='Monthly EMI: <b>₹'+emi.toFixed(2)+'</b><br>Total Interest: <b>₹'+(total-P).toFixed(2)+'</b><br>Total Payment: <b>₹'+total.toFixed(2)+'</b>'}</script></body></html>
