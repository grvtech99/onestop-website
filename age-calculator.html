<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONESTOP Age Calculator</title><style>body{margin:0;font-family:system-ui,Arial;background:#07142e;color:#fff}main{max-width:620px;margin:auto;padding:22px}.box{background:#111d3d;border:1px solid #2c3c6b;border-radius:16px;padding:20px}a{color:#38e8ff}label{display:block;margin:14px 0 6px;color:#cbd4f4}input,button{font:inherit}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #46557f;background:#08122d;color:#fff}button{margin-top:16px;padding:12px 16px;border:0;border-radius:10px;background:#38e8ff;font-weight:800;cursor:pointer}.result{margin-top:18px;padding:16px;border-radius:12px;background:#08122d;line-height:1.7}.muted{color:#aeb7d8;font-size:13px}</style></head><body><main><a href="free-tools.html">← Back to Free Tools</a><h1>🎂 Age Calculator</h1><p class="muted">Calculate age in years, months and days.</p><div class="box"><label>Date of birth</label><input id="dob" type="date"><label>Calculate as of</label><input id="asof" type="date"><button id="calc">Calculate Age</button><div id="out" class="result">Enter your dates.</div></div></main><script>const d=document.getElementById('dob'),a=document.getElementById('asof'),o=document.getElementById('out');const today=new Date();a.value=today.toISOString().slice(0,10);document.getElementById('calc').onclick=()=>{if(!d.value||!a.value){o.textContent='Please enter both dates.';return}let b=new Date(d.value+'T00:00:00'),x=new Date(a.value+'T00:00:00');if(b>x){o.textContent='Date of birth cannot be after the calculation date.';return}let y=x.getFullYear()-b.getFullYear(),m=x.getMonth()-b.getMonth(),day=x.getDate()-b.getDate();if(day<0){m--;day+=new Date(x.getFullYear(),x.getMonth(),0).getDate()}if(m<0){y--;m+=12}o.innerHTML='<b>'+y+' years, '+m+' months, '+day+' days</b><br>Total years: '+(y+m/12+day/365.2425).toFixed(2);}</script></body></html>
