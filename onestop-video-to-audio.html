<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video to Audio | ONESTOP</title><style>body{margin:0;font-family:system-ui;background:#070916;color:#fff}main{max-width:760px;margin:auto;padding:24px}.box{background:#11162f;border:1px solid #273052;border-radius:16px;padding:18px}input,button{font:inherit}button{background:#38e8ff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;margin-top:10px}audio{width:100%;margin-top:15px}.status{color:#9af5ff;margin-top:12px}p{color:#aeb7d8}.note{font-size:13px;color:#8892b0}</style></head><body><main><a href="free-tools.html" style="color:#38e8ff">← Back</a><h1>🎬 Video → Audio</h1><p>Extract the audio track from a supported video file locally.</p><div class="box"><input id="f" type="file" accept="video/*"><br><button id="go">Extract Audio</button><div id="s" class="status">Choose a video.</div><audio id="a" controls></audio><br><a id="d" download="onestop-extracted-audio.wav" style="display:none;color:#65f6a2;font-weight:800">⬇ Download WAV</a><p class="note">The browser decodes the video's audio track and exports it as WAV. Support depends on the codecs your browser can decode.</p></div></main><script>const f=document.getElementById('f'),s=document.getElementById('s'),a=document.getElementById('a'),d=document.getElementById('d');document.getElementById('go').onclick=async()=>{try{if(!f.files[0])throw Error('Select a video file.');s.textContent='Reading video audio…';const ac=new AudioContext(),buf=await ac.decodeAudioData(await f.files[0].arrayBuffer());const blob=wav(buf),url=URL.createObjectURL(blob);a.src=url;d.href=url;d.style.display='inline-block';s.textContent='Done — audio extracted as WAV.';ac.close()}catch(e){s.textContent='Error: '+e.message+'. Try MP4/WebM with a browser-supported audio codec.'}};function wav(b){const ch=b.numberOfChannels,r=b.sampleRate,len=b.length*ch,buf=new ArrayBuffer(44+len*2),v=new DataView(buf);let p=0,w=x=>{for(const z of x)v.setUint8(p++,z.charCodeAt(0))},u=x=>{v.setUint32(p,x,true);p+=4},q=x=>{v.setUint16(p,x,true);p+=2};w('RIFF');u(36+len*2);w('WAVEfmt ');u(16);q(1);q(ch);u(r);u(r*ch*2);q(ch*2);q(16);w('data');u(len*2);for(let i=0;i<b.length;i++)for(let c=0;c<ch;c++){let z=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,z<0?z*32768:z*32767,true);p+=2}return new Blob([buf],{type:'audio/wav'})}</script></body></html>
